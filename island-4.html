<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulau 4 - Pengakuan 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-muda: #ffd6e8;
      --pink-soft: #ffb6d5;
      --pink: #ff8fb8;
      --pink-tua: #d66b94;
      --putih: #fff5fa;
      --teks-gelap: #3a2b3a;
      --teks-lembut: #6b4a5e;
      --bubble-bg: rgba(255, 255, 255, 0.75);
      --bubble-border: rgba(255, 143, 184, 0.6);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-image: url('assets/background-island-4.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #1a1a2e;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      padding: 80px 20px 100px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Rajdhani', sans-serif;
      color: var(--teks-gelap);
    }

    .main-container {
      position: relative;
      z-index: 2;
      max-width: 650px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }

    .bubble-chat {
      border-radius: 30px;
      padding: 30px 30px 35px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: var(--bubble-bg);
      border: 1px solid var(--bubble-border);
    }

    .letter-header {
      text-align: center;
      margin-bottom: 30px;
      animation: fadeInDown 1.5s ease;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .letter-tag {
      display: inline-block;
      padding: 6px 20px;
      border: 2px solid var(--pink);
      border-radius: 50px;
      color: var(--pink-tua);
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-transform: uppercase;
      background: rgba(255, 143, 184, 0.15);
    }
    .letter-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--teks-gelap);
    }
    .letter-subtitle {
      color: var(--teks-lembut);
      font-size: 1rem;
      margin-top: 10px;
    }

    .accent-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 20px 0 30px;
    }
    .accent-line .line { height: 2px; width: 60px; background: var(--pink-soft); }
    .accent-line .dot { width: 6px; height: 6px; background: var(--pink); border-radius: 50%; }

    .gif-profile {
      display: block;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin: 10px auto 30px;
      border: 4px solid var(--pink-soft);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      background: #fff;
    }

    .typewriter-text {
      font-size: 1.2rem;
      line-height: 1.9;
      margin-bottom: 25px;
      min-height: 1.9em;
      font-weight: 500;
      color: var(--teks-gelap);
    }

    .signature {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--pink-tua);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 40px;
      text-align: right;
      opacity: 0;
      transition: opacity 1.5s;
    }

    .final-question {
      margin-top: 30px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    .final-question.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .question-text {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--teks-gelap);
      margin-bottom: 25px;
      letter-spacing: 1px;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }
    .btn-yes, .btn-no {
      padding: 15px 40px;
      border: none;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-yes {
      background: linear-gradient(135deg, var(--pink), #ff6b9d);
      color: white;
      box-shadow: 0 8px 20px rgba(255, 107, 157, 0.5);
    }
    .btn-yes:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(255, 107, 157, 0.8);
    }
    .btn-no {
      background: rgba(255,255,255,0.8);
      color: var(--pink-tua);
      border: 2px solid var(--pink-soft);
    }
    .btn-no:hover {
      background: rgba(255,255,255,0.95);
      transform: translateY(-3px);
      border-color: var(--pink);
    }

    /* Bagian jawaban + textarea */
    .answer-section {
      display: none;
      margin-top: 25px;
    }
    .answer-section.visible {
      display: block;
      animation: fadeInUp 0.5s ease;
    }
    textarea {
      width: 100%;
      padding: 15px;
      border-radius: 15px;
      border: 2px solid var(--pink-soft);
      font-size: 1rem;
      font-family: 'Rajdhani', sans-serif;
      color: var(--teks-gelap);
      background: rgba(255,255,255,0.7);
      resize: vertical;
      min-height: 100px;
      outline: none;
      transition: border-color 0.3s;
    }
    textarea:focus { border-color: var(--pink); }
    .btn-send {
      margin-top: 15px;
      padding: 13px 30px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, var(--pink), #ff6b9d);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 20px rgba(255,107,157,0.4);
    }
    .btn-send:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(255,107,157,0.7); }

    .response-message {
      margin-top: 15px;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--teks-gelap);
      min-height: 30px;
      animation: fadeInUp 0.5s ease;
    }
    .btn-back-map {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 30px;
      border: none;
      border-radius: 50px;
      background: var(--pink);
      color: white;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s;
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .btn-back-map:hover { transform: translateY(-3px); }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .letter-title { font-size: 1.8rem; }
      .typewriter-text { font-size: 1.05rem; }
      .bubble-chat { padding: 20px 15px; }
      .question-text { font-size: 1.4rem; }
      .btn-yes, .btn-no { padding: 12px 25px; font-size: 1rem; }
      .gif-profile { width: 90px; height: 90px; }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="bubble-chat">
      <div class="letter-header">
        <div class="letter-tag">🏝️ Pulau Terakhir</div>
        <h1 class="letter-title">Surat Pengakuan</h1>
        <div class="letter-subtitle">Untuk Ratu Kucing Duyung</div>
      </div>

      <div class="accent-line">
        <div class="line"></div>
        <div class="dot"></div>
        <div class="line"></div>
      </div>

      <img src="assets/blush.gif" alt="Blush GIF" class="gif-profile">

      <p class="typewriter-text" data-text="Halo, Ratu Kucing Duyung..."></p>
      <p class="typewriter-text" data-text="Aku sudah berlayar jauh, melewati pulau-pulau kenangan. Di setiap pulau, aku menemukan alasan untuk terus berlayar. Dan alasan terbesarnya adalah kamu." data-delay="12"></p>
      <p class="typewriter-text" data-text="Dari lintasan F1 sampai dunia Ladybug, dari gelap yang penuh ragu sampai cahaya yang kamu bawa, semua mengarah ke satu hal: aku ingin kamu tahu, aku masih di sini. Masih dengan rasa yang sama." data-delay="12"></p>
      <p class="typewriter-text" data-text="Aku tidak ingin lagi menjadi bajak laut yang hanya berlayar di sekitarmu. Aku ingin berlabuh. Di hatimu." data-delay="12"></p>
      <p class="typewriter-text" data-text="Jadi, dengan segenap keberanian yang kupunya, aku bertanya..." data-delay="12"></p>

      <div class="signature" id="signature">— Bajak Lautmu</div>

      <div class="final-question" id="finalQuestion">
        <div class="question-text">Maukah kamu jadi bagian dari hidupku? 💖</div>
        <div class="btn-group" id="btnGroup">
          <button class="btn-yes" id="btnYes">Iya, aku mau! 💖</button>
          <button class="btn-no" id="btnNo">Maaf, belum bisa 🙏</button>
        </div>

        <div class="answer-section" id="answerSection">
          <div class="response-message" id="responseMessage"></div>
          <textarea id="heartMessage" placeholder="Tulis isi hatimu di sini..."></textarea>
          <button class="btn-send" id="btnSend">Kirim Jawaban 💌</button>
        </div>
      </div>
    </div>
  </div>

  <script src="state.js"></script>
  <script>
    (function() {
      const signature = document.getElementById('signature');
      const finalQuestion = document.getElementById('finalQuestion');
      const btnGroup = document.getElementById('btnGroup');
      const btnYes = document.getElementById('btnYes');
      const btnNo = document.getElementById('btnNo');
      const answerSection = document.getElementById('answerSection');
      const responseMessage = document.getElementById('responseMessage');
      const heartMessage = document.getElementById('heartMessage');
      const btnSend = document.getElementById('btnSend');
      const typewriterElements = document.querySelectorAll('.typewriter-text');

      let chosenAnswer = '';

      // Typewriter
      let currentIndex = 0;
      function typeNext() {
        if (currentIndex >= typewriterElements.length) {
          signature.style.opacity = '1';
          setTimeout(() => {
            finalQuestion.classList.add('visible');
          }, 800);
          return;
        }
        const element = typewriterElements[currentIndex];
        const text = element.getAttribute('data-text');
        const delay = parseInt(element.getAttribute('data-delay')) || 30;
        element.textContent = '';
        let charIndex = 0;
        function typeChar() {
          if (charIndex < text.length) {
            element.textContent += text.charAt(charIndex);
            charIndex++;
            setTimeout(typeChar, delay);
          } else {
            currentIndex++;
            setTimeout(typeNext, 500);
          }
        }
        typeChar();
      }
      typeNext();

      function showAnswerSection(answer) {
        chosenAnswer = answer;
        responseMessage.textContent = answer === 'yes' 
          ? 'Yay! 🥳 Tulis isi hatimu di bawah ini ya...' 
          : 'Aku hargai kejujuranmu. Tulis apa pun yang ingin kamu sampaikan...';
        btnGroup.style.display = 'none';
        answerSection.classList.add('visible');
      }

      btnYes.addEventListener('click', function() {
        showAnswerSection('yes');
      });

      btnNo.addEventListener('click', function() {
        showAnswerSection('no');
      });

      btnSend.addEventListener('click', function() {
        const message = heartMessage.value.trim();
        if (!chosenAnswer) return;

        btnSend.disabled = true;
        btnSend.textContent = 'Mengirim...';

        const payload = {
          answer: chosenAnswer,
          message: message || '(tidak menulis pesan)',
          timestamp: new Date().toISOString()
        };

        fetch('https://formspree.io/f/xqpkyngp', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(payload)
        })
        .then(response => {
          if (response.ok) {
            responseMessage.textContent = 'Jawabanmu sudah terkirim! 💌 Terima kasih sudah berlayar bersamaku.';
            heartMessage.style.display = 'none';
            btnSend.style.display = 'none';
            completeIsland('island4');
          } else {
            throw new Error('Gagal kirim');
          }
        })
        .catch(error => {
          responseMessage.textContent = 'Gagal mengirim. Coba lagi ya...';
          btnSend.disabled = false;
          btnSend.textContent = 'Kirim Jawaban 💌';
        });
      });
    })();
  </script>
</body>
</html>
