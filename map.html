<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta Kepulauan Ratu Kucing Duyung 🏝️</title>
  <style>
    :root {
      --deep-sea-1: #0a1c2e;
      --deep-sea-2: #0d2b45;
      --deep-sea-3: #0f3b5c;
      --gold-1: #FFD700;
      --text-light: #e0f0ff;
      --accent-pink: #ff8fab;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(180deg, var(--deep-sea-1), var(--deep-sea-2), var(--deep-sea-3));
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 20;
      padding: 10px 20px;
      border-radius: 50px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border: 2px solid rgba(255,255,255,0.3);
      backdrop-filter: blur(10px);
    }
    .map-container { position: relative; z-index: 2; width: 100%; max-width: 850px; text-align: center; }
    .map-title { color: #fff; font-size: 2rem; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
    .map-subtitle { color: #c2d8e8; font-size: 1rem; margin-bottom: 20px; }
    .map-area { position: relative; width: 100%; height: 600px; margin: 0 auto; }
    .snake-path { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    .snake-path path {
      fill: none;
      stroke: rgba(255,215,0,0.6);
      stroke-width: 4;
      stroke-dasharray: 12 10;
      stroke-linecap: round;
      animation: dashMove 2s linear infinite;
    }
    .snake-path-hidden path { stroke: none; }
    @keyframes dashMove { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -22; } }
    .island {
      position: absolute;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.3s, filter 0.3s;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
      user-select: none;
    }
    .island:hover:not(.locked) { transform: scale(1.1); }
    .island.locked { opacity: 0.5; filter: grayscale(0.6) drop-shadow(0 4px 6px rgba(0,0,0,0.5)); cursor: not-allowed; }
    .island-emoji { font-size: 4.5rem; line-height: 1; }
    .island.unlocked .island-emoji { animation: islandFloat 3s ease-in-out infinite; }
    @keyframes islandFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .island-label { color: #fff; font-weight: 700; margin-top: 6px; background: rgba(0,0,0,0.6); padding: 4px 18px; border-radius: 30px; text-transform: uppercase; letter-spacing: 1px; }
    .key-indicator { position: absolute; top: -15px; right: -25px; font-size: 2.2rem; animation: keyBounce 2s ease-in-out infinite; filter: drop-shadow(0 0 8px rgba(255,215,0,0.8)); display: none; }
    .island.unlocked .key-indicator { display: block; }
    @keyframes keyBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .duyung-walker {
      position: absolute;
      width: 80px;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -100%);
      filter: drop-shadow(0 0 15px rgba(255,80,120,0.8));
      transition: opacity 0.5s;
    }
    .duyung-walker.show { opacity: 1; }
    .map-message { margin-top: 20px; color: #fff; font-weight: 600; }
    @media (max-width: 600px) {
      .map-area { height: 480px; }
      .island-emoji { font-size: 3.2rem; }
      .island-label { font-size: 0.85rem; }
      .duyung-walker { width: 60px; }
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-btn">⬅️ Kembali</a>

  <div class="map-container">
    <div class="map-title">🗺️ Peta Kepulauan Ratu Kucing Duyung</div>
    <div class="map-subtitle">Jelajahi pulau-pulau untuk mengumpulkan kunci dan membuka misteri</div>

    <div class="map-area" id="mapArea">
      <!-- Path tersembunyi start -> island1 -->
      <svg class="snake-path snake-path-hidden" viewBox="0 0 800 600" preserveAspectRatio="none">
        <path id="snakePathHidden" d="M400,540 C300,450 200,250 120,120" />
      </svg>

      <!-- Path terlihat island1 -> island2 -> island3 -> island4 -->
      <svg class="snake-path" viewBox="0 0 800 600" preserveAspectRatio="none">
        <path id="snakePathVisible" d="M120,120 C180,200 250,350 280,390 C350,450 450,350 520,300 C580,250 650,400 704,510" />
      </svg>

      <!-- Pulau-pulau -->
      <div class="island unlocked" id="island1" style="left:15%; top:20%;" data-target="island-1.html">
        <div class="island-emoji">🏝️</div>
        <div class="island-label">Island 1</div>
        <span class="key-indicator">🔑</span>
      </div>
      <div class="island locked" id="island2" style="left:35%; top:65%;" data-target="island-2.html">
        <div class="island-emoji">🏝️</div>
        <div class="island-label">Island 2</div>
        <span class="key-indicator">🔑</span>
      </div>
      <div class="island locked" id="island3" style="left:65%; top:50%;" data-target="island-3.html">
        <div class="island-emoji">🏝️</div>
        <div class="island-label">Island 3</div>
        <span class="key-indicator">🔑</span>
      </div>
      <div class="island locked" id="island4" style="left:88%; top:85%;" data-target="island-4.html">
        <div class="island-emoji">🏝️</div>
        <div class="island-label">Island 4</div>
        <span class="key-indicator">🔑</span>
      </div>

      <!-- Karakter Duyung -->
      <img src="assets/duyung.png" alt="Ratu Kucing Duyung" class="duyung-walker" id="duyungWalker">
    </div>

    <div class="map-message" id="mapMessage">Klik pulau yang sudah terbuka untuk berlayar.</div>
  </div>

  <script>
    // ===== Gelembung =====
    const bubblesContainer = document.createElement('div');
    bubblesContainer.style.cssText = 'position:fixed;width:100%;height:100%;top:0;left:0;pointer-events:none;z-index:0;';
    document.body.appendChild(bubblesContainer);
    for (let i = 0; i < 30; i++) {
      const bubble = document.createElement('div');
      const size = Math.random() * 50 + 20;
      bubble.style.cssText = `position:absolute;bottom:-80px;width:${size}px;height:${size}px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:50%;animation:rise ${Math.random() * 8 + 6}s linear infinite;animation-delay:${Math.random() * 5}s;left:${Math.random() * 100}%;`;
      bubblesContainer.appendChild(bubble);
    }
    const riseStyle = document.createElement('style');
    riseStyle.textContent = '@keyframes rise { 0% { transform: translateY(0) scale(1); opacity: 0.6; } 100% { transform: translateY(-110vh) scale(1.4); opacity: 0; } }';
    document.head.appendChild(riseStyle);

    // ===== Status pulau dari localStorage =====
    let unlockedIslands = JSON.parse(localStorage.getItem('unlockedIslands')) || [];
    if (unlockedIslands.length === 0) {
      unlockedIslands = ['island1'];
      localStorage.setItem('unlockedIslands', JSON.stringify(unlockedIslands));
    }

    const islandElements = document.querySelectorAll('.island');
    islandElements.forEach(island => {
      if (unlockedIslands.includes(island.id)) {
        island.classList.remove('locked');
        island.classList.add('unlocked');
      } else {
        island.classList.add('locked');
        island.classList.remove('unlocked');
      }
    });

    // ===== Posisi duyung dari localStorage =====
    let duyungState = JSON.parse(localStorage.getItem('duyungState')) || { path: 'hidden', progress: 0 };

    const pathHidden = document.getElementById('snakePathHidden');
    const pathVisible = document.getElementById('snakePathVisible');
    const duyungWalker = document.getElementById('duyungWalker');
    const mapArea = document.getElementById('mapArea');
    const mapMessage = document.getElementById('mapMessage');
    let isAnimating = false;

    function getScreenPosition(path, progress) {
      const totalLength = path.getTotalLength();
      const point = path.getPointAtLength(totalLength * progress);
      const mapRect = mapArea.getBoundingClientRect();
      const scaleX = mapRect.width / 800;
      const scaleY = mapRect.height / 600;
      return { left: point.x * scaleX, top: point.y * scaleY };
    }

    function setDuyungFromState() {
      const activePath = duyungState.path === 'hidden' ? pathHidden : pathVisible;
      const pos = getScreenPosition(activePath, duyungState.progress);
      duyungWalker.style.left = pos.left + 'px';
      duyungWalker.style.top = pos.top + 'px';
      duyungWalker.classList.add('show');
    }
    setDuyungFromState();

    // Precompute progress untuk pulau di path visible
    const islandCoordsViewBox = {
      island1: { x: 120, y: 120 }, // path visible start
      island2: { x: 280, y: 390 },
      island3: { x: 520, y: 300 },
      island4: { x: 704, y: 510 }  // path visible end
    };

    function findProgressForCoords(path, x, y) {
      const totalLength = path.getTotalLength();
      let bestProgress = 0;
      let bestDist = Infinity;
      for (let i = 0; i <= totalLength; i += 5) {
        const p = path.getPointAtLength(i);
        const dist = Math.hypot(p.x - x, p.y - y);
        if (dist < bestDist) {
          bestDist = dist;
          bestProgress = i / totalLength;
        }
      }
      return bestProgress;
    }

    const progressVisible = {
      island1: 0, // start path visible
      island2: findProgressForCoords(pathVisible, islandCoordsViewBox.island2.x, islandCoordsViewBox.island2.y),
      island3: findProgressForCoords(pathVisible, islandCoordsViewBox.island3.x, islandCoordsViewBox.island3.y),
      island4: 1  // end path visible
    };

    function animateDuyung(path, startProgress, endProgress, callback) {
      const duration = 1500;
      const startTime = performance.now();
      duyungWalker.classList.add('show');
      function step(now) {
        const elapsed = now - startTime;
        const t = Math.min(elapsed / duration, 1);
        const eased = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        const progress = startProgress + (endProgress - startProgress) * eased;
        const pos = getScreenPosition(path, progress);
        duyungWalker.style.left = pos.left + 'px';
        duyungWalker.style.top = pos.top + 'px';
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          if (callback) callback();
        }
      }
      requestAnimationFrame(step);
    }

    islandElements.forEach(island => {
      island.addEventListener('click', function () {
        if (isAnimating) return;
        if (this.classList.contains('locked')) {
          mapMessage.textContent = '🔒 Island ini masih terkunci. Selesaikan island sebelumnya dulu!';
          this.style.animation = 'shake 0.5s ease';
          setTimeout(() => this.style.animation = '', 500);
          return;
        }

        const islandId = this.id;
        const target = this.getAttribute('data-target');
        let targetPath, endProgress;

        if (islandId === 'island1') {
          targetPath = pathHidden;
          endProgress = 1; // ujung path hidden = island1
        } else {
          targetPath = pathVisible;
          endProgress = progressVisible[islandId];
        }

        // Tentukan startProgress berdasarkan posisi duyung saat ini
        let startPath, startProgress;
        if (duyungState.path === 'hidden') {
          startPath = pathHidden;
          startProgress = duyungState.progress;
        } else {
          startPath = pathVisible;
          startProgress = duyungState.progress;
        }

        // Jika target sama dengan posisi sekarang, langsung redirect tanpa animasi
        if (duyungState.path === (islandId === 'island1' ? 'hidden' : 'visible') &&
            Math.abs(startProgress - endProgress) < 0.01) {
          window.location.href = target;
          return;
        }

        mapMessage.textContent = `⛵ Ratu Kucing Duyung berlayar ke ${this.querySelector('.island-label').textContent}...`;
        isAnimating = true;

        animateDuyung(startPath, startProgress, endProgress, () => {
          // Simpan state baru
          if (islandId === 'island1') {
            duyungState = { path: 'visible', progress: 0 }; // berada di island1 (start path visible)
          } else {
            duyungState = { path: 'visible', progress: endProgress };
          }
          localStorage.setItem('duyungState', JSON.stringify(duyungState));
          window.location.href = target;
        });
      });
    });

    const shakeStyle = document.createElement('style');
    shakeStyle.textContent = '@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }';
    document.head.appendChild(shakeStyle);
  </script>
</body>
</html>
