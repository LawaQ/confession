<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta Kepulauan Ratu Kucing Duyung 🏝️</title>
  <style>
    :root {
      --deep-sea-1: #0a1c2e;
      --deep-sea-2: #0d2b45;
      --deep-sea-3: #0f3b5c;
      --gold-1: #FFD700;
      --text-light: #e0f0ff;
      --accent-pink: #ff8fab;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Segoe UI', sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(180deg, var(--deep-sea-1), var(--deep-sea-2), var(--deep-sea-3));
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* ===== DEKORASI BAWAH LAUT ===== */
    .floating-icons {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
      font-size: 2rem;
      user-select: none;
    }
    .float-icon {
      position: absolute;
      animation: floatAround 10s ease-in-out infinite;
      opacity: 0.5;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.2));
    }
    @keyframes floatAround {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-25px) rotate(8deg); }
    }

    .sea-floor {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 120px;
      pointer-events: none;
      z-index: 0;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      font-size: 2.5rem;
      opacity: 0.7;
      padding-bottom: 10px;
      user-select: none;
    }
    .sea-floor span {
      display: inline-block;
      animation: sway 4s ease-in-out infinite;
      transform-origin: bottom center;
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(6deg); }
    }

    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 20;
      padding: 10px 20px;
      border-radius: 50px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border: 2px solid rgba(255,255,255,0.3);
      backdrop-filter: blur(10px);
    }
    .back-btn:hover { background: rgba(0,0,0,0.7); }

    .map-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 850px;
      text-align: center;
    }

    .map-title {
      color: #fff;
      font-size: 2rem;
      text-shadow: 0 0 20px rgba(255,255,255,0.3);
      margin-bottom: 5px;
    }

    .map-subtitle {
      color: #c2d8e8;
      font-size: 1rem;
      margin-bottom: 20px;
    }

    .map-area {
      position: relative;
      width: 100%;
      height: 600px;
      margin: 0 auto;
    }

    .snake-path {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .snake-path path {
      fill: none;
      stroke: rgba(255,215,0,0.6);
      stroke-width: 4;
      stroke-dasharray: 12 10;
      stroke-linecap: round;
      animation: dashMove 2s linear infinite;
      vector-effect: non-scaling-stroke;
    }
    .snake-path-hidden path { stroke: none; }
    @keyframes dashMove { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -22; } }

    .island {
      position: absolute;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.3s, filter 0.3s;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
      user-select: none;
      transform: translate(-50%, -50%);
    }
    .island:hover:not(.locked) { transform: translate(-50%, -50%) scale(1.1); }
    .island.locked {
      opacity: 0.5;
      filter: grayscale(0.6) drop-shadow(0 4px 6px rgba(0,0,0,0.5));
      cursor: not-allowed;
    }
    .island-emoji { font-size: 4.5rem; line-height: 1; }
    .island.unlocked .island-emoji { animation: islandFloat 3s ease-in-out infinite; }
    @keyframes islandFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    .island-label {
      color: #fff;
      font-weight: 700;
      margin-top: 6px;
      background: rgba(0,0,0,0.6);
      padding: 4px 18px;
      border-radius: 30px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 1rem;
      white-space: nowrap;
    }

    .key-indicator {
      position: absolute;
      top: -15px;
      right: -25px;
      font-size: 2.2rem;
      animation: keyBounce 2s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(255,215,0,0.8));
      display: none;
    }
    .island.unlocked .key-indicator { display: block; }
    @keyframes keyBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

    .duyung-walker {
      position: absolute;
      width: 80px;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -100%);
      filter: drop-shadow(0 0 15px rgba(255,80,120,0.8));
      transition: opacity 0.5s;
    }
    .duyung-walker.show { opacity: 1; }

    .map-message {
      margin-top: 20px;
      min-height: 35px;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
    }

    @keyframes shake {
      0%, 100% { transform: translate(-50%, -50%) translateX(0); }
      25% { transform: translate(-50%, -50%) translateX(-6px); }
      75% { transform: translate(-50%, -50%) translateX(6px); }
    }

    @media (max-width: 600px) {
      .map-area { height: 480px; }
      .island-emoji { font-size: 3.2rem; }
      .island-label { font-size: 0.8rem; padding: 3px 12px; }
      .duyung-walker { width: 56px; }
      .map-title { font-size: 1.5rem; }
      .sea-floor { font-size: 1.8rem; height: 90px; }
      .floating-icons { font-size: 1.5rem; }
    }

    @media (max-width: 380px) {
      .map-area { height: 400px; }
      .island-emoji { font-size: 2.6rem; }
      .island-label { font-size: 0.7rem; padding: 2px 10px; }
      .duyung-walker { width: 46px; }
    }
  </style>
</head>
<body>

  <!-- DEKORASI IKON LAUT -->
  <div class="floating-icons">
    <span class="float-icon" style="top:8%; left:7%;">🐠</span>
    <span class="float-icon" style="top:25%; right:10%; animation-delay:2s;">🪼</span>
    <span class="float-icon" style="top:55%; left:12%; animation-delay:4s;">🐡</span>
    <span class="float-icon" style="top:70%; right:15%; animation-delay:1s;">🦑</span>
    <span class="float-icon" style="top:15%; left:60%; animation-delay:3s;">🐳</span>
    <span class="float-icon" style="top:40%; right:25%; animation-delay:5s;">🐬</span>
    <span class="float-icon" style="top:80%; left:30%; animation-delay:2.5s;">🦀</span>
    <span class="float-icon" style="top:65%; left:45%; animation-delay:3.5s;">🐚</span>
    <span class="float-icon" style="top:30%; left:20%; animation-delay:1.5s;">⭐</span>
    <span class="float-icon" style="top:50%; right:5%; animation-delay:4.5s;">💎</span>
    <span class="float-icon" style="bottom:25%; left:5%; animation-delay:0.8s;">🪸</span>
  </div>

  <!-- DASAR LAUT -->
  <div class="sea-floor">
    <span>🌿</span>
    <span>🪸</span>
    <span>🌿</span>
    <span>🐚</span>
    <span>🪸</span>
    <span>🌿</span>
    <span>⭐</span>
  </div>

  <a href="index.html" class="back-btn">⬅️ Kembali</a>

  <div class="map-container">
    <div class="map-title">🗺️ Peta Kepulauan Ratu Kucing Duyung</div>
    <div class="map-subtitle">Jelajahi pulau-pulau untuk mengumpulkan kunci dan membuka misteri</div>

    <div class="map-area" id="mapArea">
      <!-- Path tersembunyi: titik mulai -> island1 -->
      <svg class="snake-path snake-path-hidden" viewBox="0 0 800 600" preserveAspectRatio="none">
        <path id="snakePathHidden" d="M400,560 C300,480 180,280 120,120" />
      </svg>

      <!-- Path terlihat: island1 -> island2 -> island3 -> island4 -->
      <svg class="snake-path" viewBox="0 0 800 600" preserveAspectRatio="none">
        <path id="snakePathVisible" d="M120,120 C260,180 140,320 304,432 C420,520 480,220 640,270 C560,340 760,400 704,510" />
      </svg>

      <!-- Pulau-pulau -->
      <div class="island" id="island1" style="left:15%; top:20%;" data-target="island-1.html">
        <div class="island-emoji">🏝️</div>
        <div class="island-label">Island 1</div>
        <span class="key-indicator">🔑</span>
      </div>
      <div class="island" id="island2" style="left:38%; top:72%;" data-target="island-2.html">
        <div class="island-emoji">🏝️</div>
        <div class="island-label">Island 2</div>
        <span class="key-indicator">🔑</span>
      </div>
      <div class="island" id="island3" style="left:80%; top:45%;" data-target="island-3.html">
        <div class="island-emoji">🏝️</div>
        <div class="island-label">Island 3</div>
        <span class="key-indicator">🔑</span>
      </div>
      <div class="island" id="island4" style="left:88%; top:85%;" data-target="island-4.html">
        <div class="island-emoji">🏝️</div>
        <div class="island-label">Island 4</div>
        <span class="key-indicator">🔑</span>
      </div>

      <!-- Karakter Duyung -->
      <img src="assets/duyung.png" alt="Ratu Kucing Duyung" class="duyung-walker" id="duyungWalker">
    </div>

    <div class="map-message" id="mapMessage">Klik pulau yang sudah terbuka untuk berlayar.</div>
  </div>

  <script src="state.js"></script>
  <script>
    (function() {
      // Dekorasi gelembung
      const bubblesContainer = document.createElement('div');
      bubblesContainer.style.cssText = 'position:fixed;width:100%;height:100%;top:0;left:0;pointer-events:none;z-index:0;';
      document.body.appendChild(bubblesContainer);
      for (let i = 0; i < 30; i++) {
        const bubble = document.createElement('div');
        const size = Math.random() * 50 + 20;
        bubble.style.cssText = `position:absolute;bottom:-80px;width:${size}px;height:${size}px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:50%;animation:rise ${Math.random() * 8 + 6}s linear infinite;animation-delay:${Math.random() * 5}s;left:${Math.random() * 100}%;`;
        bubblesContainer.appendChild(bubble);
      }
      const riseStyle = document.createElement('style');
      riseStyle.textContent = '@keyframes rise { 0% { transform: translateY(0) scale(1); opacity: 0.6; } 100% { transform: translateY(-110vh) scale(1.4); opacity: 0; } }';
      document.head.appendChild(riseStyle);

      const pathHidden = document.getElementById('snakePathHidden');
      const pathVisible = document.getElementById('snakePathVisible');
      const duyungWalker = document.getElementById('duyungWalker');
      const mapArea = document.getElementById('mapArea');
      const mapMessage = document.getElementById('mapMessage');
      const islandElements = document.querySelectorAll('.island');
      let isAnimating = false;

      function refreshIslandLockState() {
        const unlocked = getUnlockedIslands();
        islandElements.forEach(island => {
          if (unlocked.includes(island.id)) {
            island.classList.remove('locked');
            island.classList.add('unlocked');
          } else {
            island.classList.add('locked');
            island.classList.remove('unlocked');
          }
        });
      }
      refreshIslandLockState();

      const islandCoordsViewBox = {
        island1: { x: 120, y: 120 },
        island2: { x: 304, y: 432 },
        island3: { x: 640, y: 270 },
        island4: { x: 704, y: 510 }
      };

      const pathLengthCache = new Map();
      function getPathLength(path) {
        if (!pathLengthCache.has(path)) pathLengthCache.set(path, path.getTotalLength());
        return pathLengthCache.get(path);
      }

      function findProgressForCoords(path, x, y) {
        const totalLength = getPathLength(path);
        let bestProgress = 0;
        let bestDist = Infinity;
        for (let i = 0; i <= totalLength; i += 4) {
          const p = path.getPointAtLength(i);
          const dist = Math.hypot(p.x - x, p.y - y);
          if (dist < bestDist) {
            bestDist = dist;
            bestProgress = i / totalLength;
          }
        }
        return bestProgress;
      }

      const progressVisible = {
        island1: 0,
        island2: findProgressForCoords(pathVisible, islandCoordsViewBox.island2.x, islandCoordsViewBox.island2.y),
        island3: findProgressForCoords(pathVisible, islandCoordsViewBox.island3.x, islandCoordsViewBox.island3.y),
        island4: 1
      };

      function resolveAnchor(atIsland) {
        if (atIsland === null || atIsland === undefined) {
          return { path: pathHidden, progress: 0 };
        }
        if (atIsland === 'island1') {
          return { path: pathVisible, progress: 0 };
        }
        return { path: pathVisible, progress: progressVisible[atIsland] ?? 0 };
      }

      function getScreenPosition(path, progress) {
        const totalLength = getPathLength(path);
        const point = path.getPointAtLength(totalLength * progress);
        const mapRect = mapArea.getBoundingClientRect();
        const scaleX = mapRect.width / 800;
        const scaleY = mapRect.height / 600;
        return { left: point.x * scaleX, top: point.y * scaleY };
      }

      let duyungState = getDuyungState();

      function setDuyungFromState() {
        const { path, progress } = resolveAnchor(duyungState.atIsland);
        const pos = getScreenPosition(path, progress);
        duyungWalker.style.left = pos.left + 'px';
        duyungWalker.style.top = pos.top + 'px';
        duyungWalker.classList.add('show');
      }
      setDuyungFromState();

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (!isAnimating) setDuyungFromState();
        }, 150);
      });

      function animateDuyung(path, fromProgress, toProgress, callback) {
        if (Math.abs(toProgress - fromProgress) < 0.001) {
          if (callback) callback();
          return;
        }
        const duration = 1400;
        const startTime = performance.now();
        duyungWalker.classList.add('show');
        function step(now) {
          const elapsed = now - startTime;
          const t = Math.min(elapsed / duration, 1);
          const eased = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
          const progress = fromProgress + (toProgress - fromProgress) * eased;
          const pos = getScreenPosition(path, progress);
          duyungWalker.style.left = pos.left + 'px';
          duyungWalker.style.top = pos.top + 'px';
          if (t < 1) requestAnimationFrame(step);
          else if (callback) callback();
        }
        requestAnimationFrame(step);
      }

      islandElements.forEach(island => {
        island.addEventListener('click', function() {
          if (isAnimating) return;
          if (this.classList.contains('locked')) {
            mapMessage.textContent = '🔒 Island ini masih terkunci. Selesaikan island sebelumnya dulu!';
            this.style.animation = 'shake 0.5s ease';
            setTimeout(() => { this.style.animation = ''; }, 500);
            return;
          }
          const islandId = this.id;
          const target = this.getAttribute('data-target');
          const label = this.querySelector('.island-label').textContent;
          if (duyungState.atIsland === islandId) {
            window.location.href = target;
            return;
          }
          const start = resolveAnchor(duyungState.atIsland);
          const end = resolveAnchor(islandId);
          mapMessage.textContent = `⛵ Ratu Kucing Duyung berlayar ke ${label}...`;
          isAnimating = true;
          function arrive() {
            duyungState = { atIsland: islandId };
            setDuyungAtIsland(islandId);
            window.location.href = target;
          }
          if (start.path === end.path) {
            animateDuyung(start.path, start.progress, end.progress, arrive);
          } else {
            animateDuyung(start.path, start.progress, 1, () => {
              animateDuyung(end.path, 0, end.progress, arrive);
            });
          }
        });
      });
    })();
  </script>
</body>
</html>
