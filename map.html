<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta Kepulauan Ratu Kucing Duyung 🏝️</title>
  <style>
    /* ===== DASAR LAUT ===== */
    :root {
      --deep-sea-1: #0a1c2e;
      --deep-sea-2: #0d2b45;
      --deep-sea-3: #0f3b5c;
      --sand: #d4b483;
      --gold-1: #FFD700;
      --gold-light: #FFE44D;
      --glow-gold: 0 0 25px rgba(255, 215, 0, 0.7);
      --text-light: #e0f0ff;
      --accent-pink: #ff8fab;
      --card-bg: rgba(10, 25, 40, 0.75);
      --card-border: rgba(255, 255, 255, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, var(--deep-sea-1) 0%, var(--deep-sea-2) 40%, var(--deep-sea-3) 100%);
      overflow-x: hidden;
      position: relative;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ===== GELEMBUNG ===== */
    .bubbles {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bubble {
      position: absolute;
      bottom: -80px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      animation: rise linear infinite;
    }
    @keyframes rise {
      0% { transform: translateY(0) scale(1); opacity: 0.6; }
      100% { transform: translateY(-110vh) scale(1.4); opacity: 0; }
    }

    /* ===== IKON LAUT MENGAPUNG ===== */
    .floating-icons {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
      font-size: 2rem;
      user-select: none;
    }
    .float-icon {
      position: absolute;
      animation: floatAround 10s ease-in-out infinite;
      opacity: 0.4;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.2));
    }
    @keyframes floatAround {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-25px) rotate(8deg); }
    }

    /* ===== DASAR LAUT ===== */
    .sea-floor {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 120px;
      pointer-events: none;
      z-index: 0;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      font-size: 2.5rem;
      opacity: 0.6;
      padding-bottom: 10px;
      user-select: none;
    }
    .sea-floor span {
      display: inline-block;
      animation: sway 4s ease-in-out infinite;
      transform-origin: bottom center;
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(6deg); }
    }

    /* ===== KONTEN UTAMA ===== */
    .map-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 700px;
      text-align: center;
    }

    .map-title {
      color: var(--text-light);
      font-size: 1.8rem;
      font-weight: 700;
      text-shadow: 0 0 20px rgba(255,255,255,0.3);
      margin-bottom: 10px;
      animation: fadeInDown 1s ease;
    }
    .map-subtitle {
      color: #c2d8e8;
      font-size: 0.95rem;
      margin-bottom: 30px;
      animation: fadeInDown 1s ease 0.2s both;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== AREA PETA ===== */
    .map-area {
      position: relative;
      width: 100%;
      height: 500px;
      margin: 0 auto;
    }

    /* Garis meliuk (SVG) */
    .snake-path {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .snake-path path {
      fill: none;
      stroke: rgba(255, 215, 0, 0.55);
      stroke-width: 3;
      stroke-dasharray: 10 8;
      stroke-linecap: round;
      animation: dashMove 2s linear infinite;
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -18; }
    }

    /* ===== PULAU ===== */
    .island {
      position: absolute;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.3s, filter 0.3s;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
      user-select: none;
    }
    .island:hover:not(.locked) {
      transform: scale(1.1);
    }
    .island.locked {
      opacity: 0.5;
      filter: grayscale(0.6) drop-shadow(0 4px 6px rgba(0,0,0,0.5));
      cursor: not-allowed;
    }
    .island.locked:hover {
      transform: none;
    }

    .island-emoji {
      font-size: 4rem;
      line-height: 1;
      transition: transform 0.3s;
    }
    .island.unlocked .island-emoji {
      animation: islandFloat 3s ease-in-out infinite;
    }
    @keyframes islandFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .island-label {
      color: var(--text-light);
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 5px;
      background: rgba(0,0,0,0.5);
      padding: 3px 12px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    /* Indikator kunci */
    .key-indicator {
      position: absolute;
      top: -10px;
      right: -15px;
      font-size: 1.8rem;
      animation: keyBounce 2s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(255,215,0,0.8));
      display: none;
    }
    .island.unlocked .key-indicator {
      display: block;
    }
    @keyframes keyBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* ===== PESAN ===== */
    .map-message {
      margin-top: 25px;
      min-height: 30px;
      color: var(--text-light);
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      animation: fadeInUp 0.5s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .map-area {
        height: 400px;
      }
      .island-emoji {
        font-size: 3rem;
      }
      .map-title {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

  <!-- GELEMBUNG -->
  <div class="bubbles" id="bubbles"></div>

  <!-- IKON LAUT -->
  <div class="floating-icons">
    <span class="float-icon" style="top:8%; left:7%;">🐠</span>
    <span class="float-icon" style="top:25%; right:10%; animation-delay:2s;">🪼</span>
    <span class="float-icon" style="top:55%; left:12%; animation-delay:4s;">🐡</span>
    <span class="float-icon" style="top:70%; right:15%; animation-delay:1s;">🦑</span>
    <span class="float-icon" style="top:15%; left:60%; animation-delay:3s;">🐳</span>
    <span class="float-icon" style="top:40%; right:25%; animation-delay:5s;">🐬</span>
    <span class="float-icon" style="top:80%; left:30%; animation-delay:2.5s;">🦀</span>
    <span class="float-icon" style="top:65%; left:45%; animation-delay:3.5s;">🐚</span>
    <span class="float-icon" style="top:30%; left:20%; animation-delay:1.5s;">⭐</span>
    <span class="float-icon" style="top:50%; right:5%; animation-delay:4.5s;">💎</span>
    <span class="float-icon" style="bottom:25%; left:5%; animation-delay:0.8s;">🪸</span>
  </div>

  <!-- DASAR LAUT -->
  <div class="sea-floor">
    <span>🌿</span>
    <span>🪸</span>
    <span>🌿</span>
    <span>🐚</span>
    <span>🪸</span>
    <span>🌿</span>
    <span>⭐</span>
  </div>

  <!-- PETA -->
  <div class="map-container">
    <div class="map-title">🗺️ Peta Kepulauan Ratu Kucing Duyung</div>
    <div class="map-subtitle">Jelajahi pulau-pulau untuk mengumpulkan kunci dan membuka misteri</div>

    <div class="map-area">

      <!-- SVG GARIS MELIUK SEPERTI ULAR -->
      <svg class="snake-path" viewBox="0 0 700 500" preserveAspectRatio="none">
        <path d="M100,400 
                 C150,250 200,350 280,250 
                 C360,150 380,300 470,200 
                 C540,120 570,250 620,150" />
      </svg>

      <!-- PULAU 1 (TERBUKA) -->
      <div class="island unlocked" id="island1" style="left:8%; top:65%;" data-target="island-1.html">
        <div class="island-emoji">🏝️</div>
        <div class="island-label">Pulau 1</div>
        <span class="key-indicator">🔑</span>
      </div>

      <!-- PULAU 2 (TERKUNCI) -->
      <div class="island locked" id="island2" style="left:32%; top:38%;" data-target="island-2.html">
        <div class="island-emoji">🏝️</div>
        <div class="island-label">Pulau 2</div>
        <span class="key-indicator">🔑</span>
      </div>

      <!-- PULAU 3 (TERKUNCI) -->
      <div class="island locked" id="island3" style="left:58%; top:25%;" data-target="island-3.html">
        <div class="island-emoji">🏝️</div>
        <div class="island-label">Pulau 3</div>
        <span class="key-indicator">🔑</span>
      </div>

      <!-- PULAU 4 (TERKUNCI) -->
      <div class="island locked" id="island4" style="left:80%; top:12%;" data-target="island-4.html">
        <div class="island-emoji">🏝️</div>
        <div class="island-label">Pulau 4</div>
        <span class="key-indicator">🔑</span>
      </div>

    </div>

    <div class="map-message" id="mapMessage">Klik pulau yang sudah terbuka untuk memulai.</div>
  </div>

  <script>
    // ===== GELEMBUNG =====
    const bubblesContainer = document.getElementById('bubbles');
    const bubbleCount = 30;
    for (let i = 0; i < bubbleCount; i++) {
      const bubble = document.createElement('div');
      bubble.classList.add('bubble');
      const size = Math.random() * 50 + 20;
      bubble.style.width = size + 'px';
      bubble.style.height = size + 'px';
      bubble.style.left = Math.random() * 100 + '%';
      bubble.style.animationDuration = Math.random() * 8 + 6 + 's';
      bubble.style.animationDelay = Math.random() * 5 + 's';
      bubblesContainer.appendChild(bubble);
    }

    // ===== INTERAKSI PULAU =====
    const islands = document.querySelectorAll('.island');
    const mapMessage = document.getElementById('mapMessage');

    islands.forEach(island => {
      island.addEventListener('click', function() {
        if (this.classList.contains('locked')) {
          mapMessage.textContent = "🔒 Pulau ini masih terkunci. Selesaikan pulau sebelumnya dulu!";
          // Efek getar
          this.style.animation = 'shake 0.5s ease';
          setTimeout(() => { this.style.animation = ''; }, 500);
        } else {
          const target = this.getAttribute('data-target');
          mapMessage.textContent = `⛵ Berlayar ke ${this.querySelector('.island-label').textContent}...`;
          setTimeout(() => {
            window.location.href = target;
          }, 800);
        }
      });
    });

    // Tambahkan keyframes shake
    const styleSheet = document.createElement('style');
    styleSheet.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        75% { transform: translateX(6px); }
      }
    `;
    document.head.appendChild(styleSheet);

    // ===== CONTOH UNLOCK OTOMATIS (untuk uji coba) =====
    // Ubah nilai ini untuk mengatur pulau mana yang terbuka.
    // Misal: setelah menyelesaikan pulau 1, kamu bisa set pulau2 unlocked.
    const unlockedIslands = ['island1']; // hanya pulau 1 yang terbuka awal
    unlockedIslands.forEach(id => {
      const island = document.getElementById(id);
      if (island) island.classList.remove('locked');
    });
  </script>
</body>
</html>
