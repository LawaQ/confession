<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Story</title>

  <style>
    :root {
      --deep-sea-1: #0a1c2e;
      --deep-sea-2: #0d2b45;
      --deep-sea-3: #0f3b5c;
      --turquoise: #7fd8e6;
      --gold-1: #FFD700;
      --gold-soft: #ffea9a;
      --text-light: #e0f0ff;
      --accent-pink: #ff8fab;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 35%, rgba(45, 130, 160, 0.18), transparent 45%),
        linear-gradient(
          180deg,
          var(--deep-sea-1),
          var(--deep-sea-2),
          var(--deep-sea-3)
        );
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      transition: background 2.5s ease;
    }

    /* ============================================================
       DEKORASI LAUT
    ============================================================ */

    .floating-icons {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
      font-size: 2rem;
      user-select: none;
      transition: opacity 2s ease;
    }

    .float-icon {
      position: absolute;
      animation: floatAround 10s ease-in-out infinite;
      opacity: 0.5;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.2));
    }

    @keyframes floatAround {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-25px) rotate(8deg);
      }
    }

    .sea-floor {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 120px;
      pointer-events: none;
      z-index: 0;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      font-size: 2.5rem;
      opacity: 0.7;
      padding-bottom: 10px;
      user-select: none;
      transition: opacity 2s ease;
    }

    .sea-floor span {
      display: inline-block;
      animation: sway 4s ease-in-out infinite;
      transform-origin: bottom center;
    }

    @keyframes sway {
      0%, 100% {
        transform: rotate(-6deg);
      }

      50% {
        transform: rotate(6deg);
      }
    }

    body.heart-mode .floating-icons {
      opacity: 0.22;
    }

    body.heart-mode .sea-floor {
      opacity: 0.3;
    }

    /* ============================================================
       MAP
    ============================================================ */

    .map-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 850px;
      text-align: center;
    }

    .map-title {
      color: #fff;
      font-size: 2.2rem;
      font-weight: 700;
      text-shadow: 0 0 20px rgba(255,255,255,0.3);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      transition:
        opacity 1.5s ease,
        transform 1.5s ease;
    }

    .map-subtitle {
      color: #c2d8e8;
      font-size: 1rem;
      margin-bottom: 25px;
      font-style: italic;
      transition:
        opacity 1.5s ease,
        transform 1.5s ease;
    }

    body.heart-mode .map-subtitle {
      opacity: 0;
      transform: translateY(-8px);
    }

    .map-area {
      position: relative;
      width: 100%;
      height: 600px;
      margin: 0 auto;
    }

    /* ============================================================
       PATH
    ============================================================ */

    .snake-path {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      overflow: visible;
    }

    .snake-path path {
      fill: none;
      stroke: rgba(255,215,0,0.6);
      stroke-width: 4;
      stroke-dasharray: 12 10;
      stroke-linecap: round;
      animation: dashMove 2s linear infinite;
      vector-effect: non-scaling-stroke;
    }

    @keyframes dashMove {
      0% {
        stroke-dashoffset: 0;
      }

      100% {
        stroke-dashoffset: -22;
      }
    }

    /* Path awal */
    #pathNormal {
      opacity: 1;
      transition: opacity 1.4s ease;
    }

    /* Path heart */
    #pathHeart {
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    #pathHeart path {
      stroke: rgba(255, 234, 154, 0.9);
      stroke-width: 4.5;
      stroke-dasharray: 14 11;
      stroke-dashoffset: 1000;
      filter:
        drop-shadow(0 0 5px rgba(255,220,120,0.4))
        drop-shadow(0 0 12px rgba(255,220,120,0.18));
    }

    body.heart-mode #pathNormal {
      opacity: 0;
    }

    body.heart-mode #pathHeart {
      opacity: 1;
    }

    body.heart-mode #pathHeart path {
      animation:
        heartPathDraw 2.8s ease-out forwards,
        dashMove 2s linear infinite 2.8s;
    }

    @keyframes heartPathDraw {
      from {
        stroke-dashoffset: 1000;
      }

      to {
        stroke-dashoffset: 0;
      }
    }

    /* ============================================================
       ISLAND
    ============================================================ */

    .island {
      position: absolute;
      z-index: 3;

      display: flex;
      flex-direction: column;
      align-items: center;

      cursor: pointer;
      user-select: none;

      transform: translate(-50%, -50%);

      filter:
        drop-shadow(0 6px 10px rgba(0,0,0,0.5));

      transition:
        left 2.7s cubic-bezier(0.65, 0, 0.35, 1),
        top 2.7s cubic-bezier(0.65, 0, 0.35, 1),
        transform 0.35s ease,
        filter 0.5s ease;
    }

    .island:hover:not(.locked) {
      transform:
        translate(-50%, -50%)
        scale(1.08);
    }

    .island.locked {
      opacity: 0.55;
      filter:
        grayscale(0.55)
        drop-shadow(0 4px 6px rgba(0,0,0,0.5));

      cursor: not-allowed;
    }

    .island.locked:hover {
      transform: translate(-50%, -50%);
    }

    .island-emoji {
      font-size: 4.5rem;
      line-height: 1;
    }

    .island.unlocked .island-emoji {
      animation: islandFloat 3s ease-in-out infinite;
    }

    @keyframes islandFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .island-label {
      color: #fff;
      font-weight: 700;
      margin-top: 6px;
      background: rgba(0,0,0,0.6);
      padding: 4px 18px;
      border-radius: 30px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 1rem;
      white-space: nowrap;
      transition:
        background 1.5s ease,
        transform 1.5s ease;
    }

    /* ============================================================
       LOCK
    ============================================================ */

    .lock-indicator {
      position: absolute;
      top: -12px;
      right: -20px;
      font-size: 1.6rem;
      filter:
        drop-shadow(0 0 8px rgba(255,255,255,0.4));
      opacity: 0.75;
      display: none;
    }

    .island.locked .lock-indicator {
      display: block;
    }

    /* ============================================================
       HEART FORMATION
       
       PENTING:
       !important diperlukan karena island memiliki inline style
       left/top pada HTML awal.
    ============================================================ */

    body.heart-mode #island1 {
      left: 23% !important;
      top: 27% !important;
    }

    body.heart-mode #island2 {
      left: 77% !important;
      top: 27% !important;
    }

    body.heart-mode #island3 {
      left: 34% !important;
      top: 65% !important;
    }

    body.heart-mode #island4 {
      left: 66% !important;
      top: 65% !important;
    }

    body.heart-mode .island-label {
      background: rgba(5, 18, 30, 0.5);
      transform: translateY(2px);
    }

    /* ============================================================
       DUYUNG
    ============================================================ */

    .duyung-walker {
      position: absolute;
      width: 80px;
      z-index: 8;
      pointer-events: none;

      opacity: 0;

      transform:
        translate(-50%, -50%);

      filter:
        drop-shadow(0 0 15px rgba(255,80,120,0.8));

      transition:
        opacity 0.5s ease;
    }

    .duyung-walker.show {
      opacity: 1;
    }

    body.heart-mode .duyung-walker {
      transition:
        opacity 0.5s ease,
        left 1.9s cubic-bezier(0.65, 0, 0.35, 1),
        top 1.9s cubic-bezier(0.65, 0, 0.35, 1),
        filter 1s ease;

      filter:
        drop-shadow(0 0 22px rgba(255,200,220,0.9));
    }

    /* ============================================================
       RIPPLE
    ============================================================ */

    .ripple {
      position: absolute;
      width: 20px;
      height: 20px;

      border:
        2px solid rgba(180,230,245,0.75);

      border-radius: 50%;

      transform:
        translate(-50%, -50%);

      pointer-events: none;
      z-index: 7;
      opacity: 0;
    }

    .ripple.active {
      animation:
        rippleExpand 2.2s ease-out forwards;
    }

    @keyframes rippleExpand {
      0% {
        opacity: 0.85;
        transform:
          translate(-50%, -50%)
          scale(0.5);

        border-width: 3px;
      }

      100% {
        opacity: 0;
        transform:
          translate(-50%, -50%)
          scale(9);

        border-width: 0.5px;
      }
    }

    .ripple.delay-1 {
      animation-delay: 0.4s;
    }

    .ripple.delay-2 {
      animation-delay: 0.9s;
    }

    /* ============================================================
       SPARKLE
    ============================================================ */

    .sparkle-heart {
      position: absolute;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      z-index: 9;
      color: #ffe4ec;
      text-shadow:
        0 0 10px rgba(255,200,220,0.9);

      transition: opacity 1.5s ease;
    }

    .sparkle-heart.active {
      opacity: 0.75;
      animation:
        sparkleTwinkle 3.5s ease-in-out infinite;
    }

    @keyframes sparkleTwinkle {
      0%, 100% {
        transform:
          scale(1)
          rotate(0deg);

        opacity: 0.5;
      }

      50% {
        transform:
          scale(1.2)
          rotate(15deg);

        opacity: 0.9;
      }
    }

    /* ============================================================
       MESSAGE
    ============================================================ */

    .map-message {
      margin-top: 20px;
      min-height: 35px;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      transition:
        opacity 1s ease,
        transform 1s ease;
    }

    body.heart-mode .map-message {
      opacity: 0;
      transform: translateY(8px);
    }

    /* ============================================================
       SHAKE
    ============================================================ */

    @keyframes shake {
      0%, 100% {
        transform:
          translate(-50%, -50%)
          translateX(0);
      }

      25% {
        transform:
          translate(-50%, -50%)
          translateX(-6px);
      }

      75% {
        transform:
          translate(-50%, -50%)
          translateX(6px);
      }
    }

    /* ============================================================
       ENDING OVERLAY
    ============================================================ */

    .ending-overlay {
      position: fixed;
      inset: 0;

      background:
        radial-gradient(
          ellipse at center,
          rgba(10,25,40,0.48) 0%,
          rgba(5,15,25,0.86) 100%
        );

      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      opacity: 0;
      pointer-events: none;

      transition:
        opacity 1.5s ease;
    }

    .ending-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .ending-content {
      text-align: center;
      max-width: 520px;
      padding: 10px 8px;
    }

    .ending-title {
      font-family:
        'Chakra Petch',
        'Poppins',
        sans-serif;

      color: #fff8ee;

      font-size:
        clamp(1.4rem, 5.5vw, 1.9rem);

      font-weight: 700;
      letter-spacing: 0.8px;
      line-height: 1.35;

      text-shadow:
        0 0 25px rgba(255,220,180,0.45);

      opacity: 0;
      transform: translateY(12px);

      transition:
        opacity 1.2s ease,
        transform 1.2s ease;
    }

    .ending-subtitle {
      margin-top: 16px;

      color: #e6dccb;

      font-size:
        clamp(0.95rem, 3.8vw, 1.08rem);

      line-height: 1.7;
      font-style: italic;

      opacity: 0;
      transform: translateY(12px);

      transition:
        opacity 1.2s ease 0.5s,
        transform 1.2s ease 0.5s;
    }

    .ending-buttons {
      margin-top: 34px;

      display: flex;
      flex-wrap: wrap;
      justify-content: center;

      gap: 12px;

      opacity: 0;
      transform: translateY(12px);

      transition:
        opacity 1.2s ease 1.1s,
        transform 1.2s ease 1.1s;
    }

    .ending-overlay.text-in .ending-title {
      opacity: 1;
      transform: translateY(0);
    }

    .ending-overlay.text-in .ending-subtitle {
      opacity: 1;
      transform: translateY(0);
    }

    .ending-overlay.text-in .ending-buttons {
      opacity: 1;
      transform: translateY(0);
    }

    .ending-btn {
      padding: 13px 28px;

      border: none;
      border-radius: 50px;

      font-family:
        'Chakra Petch',
        'Poppins',
        sans-serif;

      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.8px;

      cursor: pointer;

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        background 0.3s ease;

      white-space: nowrap;
    }

    .ending-btn.primary {
      background:
        linear-gradient(
          135deg,
          #d9a86b,
          #f2c98a
        );

      color: #2a1d10;

      box-shadow:
        0 8px 22px rgba(217,168,107,0.35);
    }

    .ending-btn.primary:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 28px rgba(217,168,107,0.55);
    }

    .ending-btn.secondary {
      background:
        rgba(255,255,255,0.1);

      color: #f0e9dd;

      border:
        1.5px solid rgba(255,240,215,0.5);
    }

    .ending-btn.secondary:hover {
      background:
        rgba(255,255,255,0.2);

      transform: translateY(-2px);
    }

    /* ============================================================
       BUBBLES
    ============================================================ */

    .bubbles-layer {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      bottom: -80px;

      background:
        rgba(255,255,255,0.08);

      border:
        1px solid rgba(255,255,255,0.15);

      border-radius: 50%;

      animation:
        rise linear infinite;
    }

    @keyframes rise {
      0% {
        transform:
          translateY(0)
          scale(1);

        opacity: 0.6;
      }

      100% {
        transform:
          translateY(-110vh)
          scale(1.4);

        opacity: 0;
      }
    }

    /* ============================================================
       RESPONSIVE
    ============================================================ */

    @media (max-width: 600px) {

      .map-area {
        height: 480px;
      }

      .island-emoji {
        font-size: 3.2rem;
      }

      .island-label {
        font-size: 0.8rem;
        padding: 3px 12px;
      }

      .duyung-walker {
        width: 56px;
      }

      .map-title {
        font-size: 1.6rem;
      }

      .sea-floor {
        font-size: 1.8rem;
        height: 90px;
      }

      .floating-icons {
        font-size: 1.5rem;
      }

      .lock-indicator {
        font-size: 1.3rem;
        top: -10px;
        right: -16px;
      }

      body.heart-mode .island-label {
        font-size: 0.7rem;
        padding: 3px 9px;
      }

      .ending-btn {
        padding: 12px 22px;
        font-size: 0.9rem;
      }

      /* Sedikit lebih rapat di mobile */
      body.heart-mode #island1 {
        left: 21% !important;
        top: 28% !important;
      }

      body.heart-mode #island2 {
        left: 79% !important;
        top: 28% !important;
      }

      body.heart-mode #island3 {
        left: 33% !important;
        top: 65% !important;
      }

      body.heart-mode #island4 {
        left: 67% !important;
        top: 65% !important;
      }
    }

    @media (max-width: 380px) {

      .map-area {
        height: 400px;
      }

      .island-emoji {
        font-size: 2.6rem;
      }

      .island-label {
        font-size: 0.7rem;
        padding: 2px 10px;
      }

      .duyung-walker {
        width: 46px;
      }

      .ending-buttons {
        flex-direction: column;
        align-items: center;
      }

      body.heart-mode #island1 {
        left: 20% !important;
      }

      body.heart-mode #island2 {
        left: 80% !important;
      }

      body.heart-mode #island3 {
        left: 31% !important;
      }

      body.heart-mode #island4 {
        left: 69% !important;
      }
    }
  </style>
</head>

<body>

  <!-- ============================================================
       DEKORASI LAUT
  ============================================================ -->

  <div class="floating-icons">

    <span class="float-icon" style="top:8%; left:7%;">
      🐠
    </span>

    <span class="float-icon"
          style="top:25%; right:10%; animation-delay:2s;">
      🪼
    </span>

    <span class="float-icon"
          style="top:55%; left:12%; animation-delay:4s;">
      🐡
    </span>

    <span class="float-icon"
          style="top:70%; right:15%; animation-delay:1s;">
      🦑
    </span>

    <span class="float-icon"
          style="top:15%; left:60%; animation-delay:3s;">
      🐳
    </span>

    <span class="float-icon"
          style="top:40%; right:25%; animation-delay:5s;">
      🐬
    </span>

    <span class="float-icon"
          style="top:80%; left:30%; animation-delay:2.5s;">
      🦀
    </span>

    <span class="float-icon"
          style="top:65%; left:45%; animation-delay:3.5s;">
      🐚
    </span>

    <span class="float-icon"
          style="top:30%; left:20%; animation-delay:1.5s;">
      ⭐
    </span>

    <span class="float-icon"
          style="top:50%; right:5%; animation-delay:4.5s;">
      💎
    </span>

    <span class="float-icon"
          style="bottom:25%; left:5%; animation-delay:0.8s;">
      🪸
    </span>

  </div>

  <div class="sea-floor">
    <span>🌿</span>
    <span>🪸</span>
    <span>🌿</span>
    <span>🐚</span>
    <span>🪸</span>
    <span>🌿</span>
    <span>⭐</span>
  </div>

  <div class="bubbles-layer" id="bubblesLayer"></div>

  <!-- ============================================================
       MAP
  ============================================================ -->

  <div class="map-container">

    <div class="map-title" id="mapTitle">
      A Little Story
    </div>

    <div class="map-subtitle" id="mapSubtitle">
      Just a few things I wanted you to see.
    </div>

    <div class="map-area" id="mapArea">

      <!-- Jalur tersembunyi menuju Island 1 -->
      <svg
        class="snake-path"
        viewBox="0 0 800 600"
        preserveAspectRatio="none"
        aria-hidden="true">

        <path
          id="snakePathHidden"
          d="M400,560 C300,480 180,280 120,120" />

      </svg>


      <!-- Jalur perjalanan normal -->
      <svg
        class="snake-path"
        id="pathNormal"
        viewBox="0 0 800 600"
        preserveAspectRatio="none"
        aria-hidden="true">

        <path
          id="snakePathVisible"
          d="
            M120,120
            C260,180 140,320 304,432
            C420,520 480,220 640,270
            C560,340 760,400 704,510
          " />

      </svg>


      <!-- ========================================================
           HEART PATH

           Ini merupakan outline hati.
           Pulau menjadi empat titik utama di sekitarnya.
      ========================================================= -->

      <svg
        class="snake-path"
        id="pathHeart"
        viewBox="0 0 800 600"
        preserveAspectRatio="none"
        aria-hidden="true">

        <path
          d="
            M190,175

            C225,105 325,85 400,175

            C475,85 575,105 610,175

            C665,275 605,390 400,545

            C195,390 135,275 190,175
          " />

      </svg>


      <!-- ========================================================
           ISLANDS
      ======================================================== -->

      <div
        class="island"
        id="island1"
        style="left:15%; top:20%;"
        data-target="island-1.html">

        <div class="island-emoji">
          🏝️
        </div>

        <div class="island-label">
          Island 1
        </div>

        <span class="lock-indicator">
          🔒
        </span>

      </div>


      <div
        class="island"
        id="island2"
        style="left:38%; top:72%;"
        data-target="island-2.html">

        <div class="island-emoji">
          🏝️
        </div>

        <div class="island-label">
          Island 2
        </div>

        <span class="lock-indicator">
          🔒
        </span>

      </div>


      <div
        class="island"
        id="island3"
        style="left:80%; top:45%;"
        data-target="island-3.html">

        <div class="island-emoji">
          🏝️
        </div>

        <div class="island-label">
          Island 3
        </div>

        <span class="lock-indicator">
          🔒
        </span>

      </div>


      <div
        class="island"
        id="island4"
        style="left:88%; top:85%;"
        data-target="island-4.html">

        <div class="island-emoji">
          🏝️
        </div>

        <div class="island-label">
          Island 4
        </div>

        <span class="lock-indicator">
          🔒
        </span>

      </div>


      <!-- Ripple -->
      <div class="ripple" id="ripple1"></div>
      <div class="ripple delay-1" id="ripple2"></div>
      <div class="ripple delay-2" id="ripple3"></div>


      <!-- Ratu Kucing Duyung -->
      <img
        src="assets/duyung.png"
        alt="Ratu Kucing Duyung"
        class="duyung-walker"
        id="duyungWalker">

    </div>

    <div class="map-message" id="mapMessage">
      Pilih salah satu pulau buat kamu jelajahi.
    </div>

  </div>


  <!-- ============================================================
       ENDING
  ============================================================ -->

  <div
    class="ending-overlay"
    id="endingOverlay">

    <div class="ending-content">

      <div class="ending-title">
        You Made It All the Way Here
      </div>

      <div class="ending-subtitle">
        And now you know everything I wanted you to know.
      </div>

      <div class="ending-buttons">

        <button
          class="ending-btn primary"
          id="btnReplay">

          Replay the Journey ↻

        </button>

        <button
          class="ending-btn secondary"
          id="btnExplore">

          Explore the Islands →

        </button>

      </div>

    </div>

  </div>


  <!-- ============================================================
       JAVASCRIPT
  ============================================================ -->

  <script src="state.js"></script>

  <script>
    (function() {

      /* ==========================================================
         BUBBLES
      ========================================================== */

      const bubblesLayer =
        document.getElementById('bubblesLayer');

      for (let i = 0; i < 30; i++) {

        const bubble =
          document.createElement('div');

        bubble.className = 'bubble';

        const size =
          Math.random() * 50 + 20;

        bubble.style.width = size + 'px';
        bubble.style.height = size + 'px';

        bubble.style.left =
          Math.random() * 100 + '%';

        bubble.style.animationDuration =
          (Math.random() * 8 + 6) + 's';

        bubble.style.animationDelay =
          Math.random() * 5 + 's';

        bubblesLayer.appendChild(bubble);
      }


      /* ==========================================================
         ELEMENTS
      ========================================================== */

      const pathHidden =
        document.getElementById('snakePathHidden');

      const pathVisible =
        document.getElementById('snakePathVisible');

      const duyungWalker =
        document.getElementById('duyungWalker');

      const mapArea =
        document.getElementById('mapArea');

      const mapMessage =
        document.getElementById('mapMessage');

      const islandElements =
        document.querySelectorAll('.island');

      const endingOverlay =
        document.getElementById('endingOverlay');

      const btnReplay =
        document.getElementById('btnReplay');

      const btnExplore =
        document.getElementById('btnExplore');

      const ripple1 =
        document.getElementById('ripple1');

      const ripple2 =
        document.getElementById('ripple2');

      const ripple3 =
        document.getElementById('ripple3');


      let isAnimating = false;
      let heartMode = false;


      /* ==========================================================
         STATE PULAU
      ========================================================== */

      function refreshIslandLockState() {

        const unlocked =
          getUnlockedIslands();

        islandElements.forEach(island => {

          const id =
            island.id;

          if (unlocked.includes(id)) {

            island.classList.remove('locked');
            island.classList.add('unlocked');

          } else {

            island.classList.add('locked');
            island.classList.remove('unlocked');

          }

        });

      }

      refreshIslandLockState();


      /* ==========================================================
         PATH GEOMETRY
      ========================================================== */

      const islandCoordsViewBox = {

        island1: {
          x: 120,
          y: 120
        },

        island2: {
          x: 304,
          y: 432
        },

        island3: {
          x: 640,
          y: 270
        },

        island4: {
          x: 704,
          y: 510
        }

      };


      const pathLengthCache =
        new Map();


      function getPathLength(path) {

        if (!pathLengthCache.has(path)) {

          pathLengthCache.set(
            path,
            path.getTotalLength()
          );

        }

        return pathLengthCache.get(path);

      }


      function findProgressForCoords(
        path,
        x,
        y
      ) {

        const totalLength =
          getPathLength(path);

        let bestProgress = 0;
        let bestDist = Infinity;

        for (
          let i = 0;
          i <= totalLength;
          i += 4
        ) {

          const p =
            path.getPointAtLength(i);

          const dist =
            Math.hypot(
              p.x - x,
              p.y - y
            );

          if (dist < bestDist) {

            bestDist = dist;

            bestProgress =
              i / totalLength;

          }

        }

        return bestProgress;

      }


      const progressVisible = {

        island1: 0,

        island2:
          findProgressForCoords(
            pathVisible,
            islandCoordsViewBox.island2.x,
            islandCoordsViewBox.island2.y
          ),

        island3:
          findProgressForCoords(
            pathVisible,
            islandCoordsViewBox.island3.x,
            islandCoordsViewBox.island3.y
          ),

        island4: 1

      };


      function resolveAnchor(atIsland) {

        if (
          atIsland === null ||
          atIsland === undefined
        ) {

          return {
            path: pathHidden,
            progress: 0
          };

        }

        if (atIsland === 'island1') {

          return {
            path: pathVisible,
            progress: 0
          };

        }

        return {

          path: pathVisible,

          progress:
            progressVisible[atIsland] ?? 0

        };

      }


      function getScreenPosition(
        path,
        progress
      ) {

        const totalLength =
          getPathLength(path);

        const point =
          path.getPointAtLength(
            totalLength * progress
          );

        const mapRect =
          mapArea.getBoundingClientRect();

        const scaleX =
          mapRect.width / 800;

        const scaleY =
          mapRect.height / 600;

        return {

          left:
            point.x * scaleX,

          top:
            point.y * scaleY

        };

      }


      /* ==========================================================
         DUYUNG STATE
      ========================================================== */

      let duyungState =
        getDuyungState();


      function setDuyungFromState() {

        if (heartMode) return;

        const {
          path,
          progress
        } = resolveAnchor(
          duyungState.atIsland
        );

        const pos =
          getScreenPosition(
            path,
            progress
          );

        duyungWalker.style.left =
          pos.left + 'px';

        duyungWalker.style.top =
          pos.top + 'px';

        duyungWalker.classList.add('show');

      }


      function refreshDuyungAfterBack() {

        isAnimating = false;

        const overlay =
          document.getElementById(
            'transitionOverlay'
          );

        if (overlay) {

          overlay.style.opacity = '0';
          overlay.style.pointerEvents = 'none';
          overlay.style.display = 'none';

        }

        duyungState =
          getDuyungState();

        if (!heartMode) {
          setDuyungFromState();
        }

        refreshIslandLockState();

      }


      setDuyungFromState();


      /* ==========================================================
         RESIZE
      ========================================================== */

      let resizeTimer;

      window.addEventListener(
        'resize',
        () => {

          clearTimeout(resizeTimer);

          resizeTimer =
            setTimeout(() => {

              if (
                !isAnimating &&
                !heartMode
              ) {

                setDuyungFromState();

              }

            }, 150);

        }
      );


      window.addEventListener(
        'pageshow',
        () => {

          setTimeout(
            refreshDuyungAfterBack,
            50
          );

        }
      );


      document.addEventListener(
        'visibilitychange',
        () => {

          if (
            !document.hidden &&
            !isAnimating
          ) {

            refreshDuyungAfterBack();

          }

        }
      );


      /* ==========================================================
         DUYUNG MOVEMENT
      ========================================================== */

      function animateDuyung(
        path,
        fromProgress,
        toProgress,
        callback
      ) {

        if (
          Math.abs(
            toProgress - fromProgress
          ) < 0.001
        ) {

          if (callback) callback();

          return;

        }


        const duration = 1400;

        const startTime =
          performance.now();

        duyungWalker.classList.add('show');


        function step(now) {

          const elapsed =
            now - startTime;

          const t =
            Math.min(
              elapsed / duration,
              1
            );

          const eased =
            t < 0.5
              ? 2 * t * t
              : -1 + (4 - 2 * t) * t;

          const progress =
            fromProgress +
            (
              toProgress -
              fromProgress
            ) * eased;

          const pos =
            getScreenPosition(
              path,
              progress
            );

          duyungWalker.style.left =
            pos.left + 'px';

          duyungWalker.style.top =
            pos.top + 'px';


          if (t < 1) {

            requestAnimationFrame(step);

          } else if (callback) {

            callback();

          }

        }

        requestAnimationFrame(step);

      }


      /* ==========================================================
         CLICK ISLAND
      ========================================================== */

      islandElements.forEach(island => {

        island.addEventListener(
          'click',
          function() {

            if (isAnimating) return;


            if (
              this.classList.contains('locked')
            ) {

              mapMessage.textContent =
                '🔒 Pulau ini masih terkunci. Selesaikan pulau sebelumnya dulu ya.';

              this.style.animation =
                'shake 0.5s ease';

              setTimeout(() => {

                this.style.animation = '';

              }, 500);

              return;

            }


            const islandId =
              this.id;

            const target =
              this.getAttribute(
                'data-target'
              );


            /* Heart mode:
               pengguna bebas mengeksplorasi
               island tanpa menggerakkan duyung. */

            if (heartMode) {

              navigateTo(target);

              return;

            }


            const label =
              this.querySelector(
                '.island-label'
              ).textContent;


            if (
              duyungState.atIsland === islandId
            ) {

              navigateTo(target);

              return;

            }


            const start =
              resolveAnchor(
                duyungState.atIsland
              );

            const end =
              resolveAnchor(
                islandId
              );


            mapMessage.textContent =
              `Ratu Kucing Duyung berlayar ke ${label}...`;

            isAnimating = true;


            function arrive() {

              isAnimating = false;

              duyungState = {
                atIsland: islandId
              };

              setDuyungFromState();

              navigateTo(target);

            }


            if (
              start.path === end.path
            ) {

              animateDuyung(
                start.path,
                start.progress,
                end.progress,
                arrive
              );

            } else {

              animateDuyung(
                start.path,
                start.progress,
                1,
                () => {

                  animateDuyung(
                    end.path,
                    0,
                    end.progress,
                    arrive
                  );

                }
              );

            }

          }
        );

      });


      /* ==========================================================
         ENDING
      ========================================================== */

      const ALL_ISLANDS = [
        'island1',
        'island2',
        'island3',
        'island4'
      ];


      function allIslandsCompleted() {

        const completed =
          getCompletedIslands();

        return ALL_ISLANDS.every(
          id =>
            completed.includes(id)
        );

      }


      /* ==========================================================
         ENTER HEART FORMATION
      ========================================================== */

      function enterHeartFormation(
        animate
      ) {

        heartMode = true;


        /* --------------------------------------------------------
           REVISIT
        -------------------------------------------------------- */

        if (!animate) {

          document.body.classList.add(
            'heart-mode'
          );


          const mapRect =
            mapArea.getBoundingClientRect();


          duyungWalker.style.transition =
            'none';


          duyungWalker.style.left =
            (mapRect.width * 0.5) + 'px';


          duyungWalker.style.top =
            (mapRect.height * 0.47) + 'px';


          duyungWalker.classList.add(
            'show'
          );


          setTimeout(() => {

            duyungWalker.style.transition =
              '';

          }, 50);


          return;

        }


        /* --------------------------------------------------------
           FIRST TIME
        -------------------------------------------------------- */

        setTimeout(() => {

          /*
             Aktifkan heart-mode.
             Empat island mulai bergerak.
          */

          document.body.classList.add(
            'heart-mode'
          );


          /*
             Tunggu sampai formasi selesai.
          */

          setTimeout(() => {

            const mapRect =
              mapArea.getBoundingClientRect();


            const centerX =
              mapRect.width * 0.5;


            /*
               Sedikit di atas center supaya
               duyung berada di ruang kosong
               tengah heart.
            */

            const centerY =
              mapRect.height * 0.47;


            /*
               Duyung sekarang bergerak
               menuju pusat heart.
            */

            duyungWalker.style.left =
              centerX + 'px';

            duyungWalker.style.top =
              centerY + 'px';

            duyungWalker.classList.add(
              'show'
            );


            /*
               Setelah duyung sampai,
               buat ripple.
            */

            setTimeout(() => {

              [
                ripple1,
                ripple2,
                ripple3
              ].forEach(ripple => {

                ripple.style.left =
                  centerX + 'px';

                ripple.style.top =
                  centerY + 'px';

                ripple.classList.remove(
                  'active'
                );

                void ripple.offsetWidth;

                ripple.classList.add(
                  'active'
                );

              });


              /*
                 Beri waktu untuk menikmati
                 formasi heart sebelum teks.
              */

              setTimeout(() => {

                endingOverlay.classList.add(
                  'visible'
                );


                setTimeout(() => {

                  endingOverlay.classList.add(
                    'text-in'
                  );

                }, 150);

              }, 1800);


            }, 1900);


          }, 2900);


        }, 700);

      }


      /* ==========================================================
         REPLAY
      ========================================================== */

      btnReplay.addEventListener(
        'click',
        function() {

          /*
             Jangan reset progress.
             Replay hanya membawa pengguna
             kembali ke awal cerita.
          */

          sessionStorage.setItem(
            'heartEndingPlayed',
            'true'
          );

          navigateTo(
            'index.html'
          );

        }
      );


      /* ==========================================================
         EXPLORE
      ========================================================== */

      btnExplore.addEventListener(
        'click',
        function() {

          sessionStorage.setItem(
            'heartEndingPlayed',
            'true'
          );


          endingOverlay.classList.remove(
            'text-in'
          );


          setTimeout(() => {

            endingOverlay.classList.remove(
              'visible'
            );

          }, 500);

        }
      );


      /* ==========================================================
         INITIAL LOAD
      ========================================================== */

      window.addEventListener(
        'load',
        function() {

          if (!allIslandsCompleted()) {

            sessionStorage.removeItem(
              'heartEndingPlayed'
            );

            return;

          }


          const alreadyPlayed =
            sessionStorage.getItem(
              'heartEndingPlayed'
            ) === 'true';


          if (alreadyPlayed) {

            /*
               Kalau kembali lagi ke map,
               langsung tampilkan heart.
            */

            enterHeartFormation(false);

          } else {

            /*
               Pertama kali selesai:
               jalankan cinematic sequence.
            */

            enterHeartFormation(true);

          }

        }
      );

    })();
  </script>

</body>
</html>
