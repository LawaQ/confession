<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Story</title>
  <style>
    :root {
      --deep-sea-1: #0a1c2e;
      --deep-sea-2: #0d2b45;
      --deep-sea-3: #0f3b5c;
      --turquoise: #7fd8e6;
      --gold-1: #FFD700;
      --gold-soft: #ffea9a;
      --text-light: #e0f0ff;
      --accent-pink: #ff8fab;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Segoe UI', sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(180deg, var(--deep-sea-1), var(--deep-sea-2), var(--deep-sea-3));
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      transition: background 2s ease;
    }

    /* ====== Dekorasi laut ====== */
    .floating-icons {
      position: fixed; width: 100%; height: 100%; top: 0; left: 0;
      pointer-events: none; z-index: 0; font-size: 2rem; user-select: none;
      transition: opacity 1.5s ease;
    }
    .float-icon {
      position: absolute;
      animation: floatAround 10s ease-in-out infinite;
      opacity: 0.5;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.2));
    }
    @keyframes floatAround {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-25px) rotate(8deg); }
    }
    .sea-floor {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 120px;
      pointer-events: none; z-index: 0;
      display: flex; justify-content: space-around; align-items: flex-end;
      font-size: 2.5rem; opacity: 0.7; padding-bottom: 10px; user-select: none;
      transition: opacity 1.5s ease;
    }
    .sea-floor span {
      display: inline-block;
      animation: sway 4s ease-in-out infinite;
      transform-origin: bottom center;
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(6deg); }
    }
    body.heart-mode .floating-icons { opacity: 0.3; }
    body.heart-mode .sea-floor { opacity: 0.4; }

    /* ====== Map layout ====== */
    .map-container {
      position: relative; z-index: 2;
      width: 100%; max-width: 850px; text-align: center;
    }
    .map-title {
      color: #fff; font-size: 2.2rem; font-weight: 700;
      text-shadow: 0 0 20px rgba(255,255,255,0.3);
      margin-bottom: 8px; letter-spacing: 0.5px;
      transition: opacity 1.2s ease, transform 1.2s ease;
    }
    .map-subtitle {
      color: #c2d8e8; font-size: 1rem; margin-bottom: 25px;
      font-style: italic;
      transition: opacity 1.2s ease, transform 1.2s ease;
    }
    body.heart-mode .map-subtitle { opacity: 0; }

    .map-area {
      position: relative; width: 100%; height: 600px; margin: 0 auto;
    }

    .snake-path {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      transition: opacity 2s ease;
    }
    .snake-path path {
      fill: none;
      stroke: rgba(255,215,0,0.6);
      stroke-width: 4;
      stroke-dasharray: 12 10;
      stroke-linecap: round;
      animation: dashMove 2s linear infinite;
      vector-effect: non-scaling-stroke;
      transition: stroke 1.5s ease, stroke-width 1.5s ease;
    }
    .snake-path-hidden path { stroke: none; }
    @keyframes dashMove { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -22; } }

    #pathHeart { opacity: 0; }
    body.heart-mode #pathNormal { opacity: 0; }
    body.heart-mode #pathHeart { opacity: 1; }
    body.heart-mode #pathHeart path {
      stroke: rgba(255, 234, 154, 0.85);
      stroke-width: 4.5;
    }

    .island {
      position: absolute; z-index: 2;
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer;
      transition: left 2.2s cubic-bezier(0.65, 0, 0.35, 1),
                  top 2.2s cubic-bezier(0.65, 0, 0.35, 1),
                  transform 0.3s ease, filter 0.3s ease;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
      user-select: none;
      transform: translate(-50%, -50%);
    }
    .island:hover:not(.locked) { transform: translate(-50%, -50%) scale(1.1); }
    .island.locked {
      opacity: 0.55;
      filter: grayscale(0.55) drop-shadow(0 4px 6px rgba(0,0,0,0.5));
      cursor: not-allowed;
    }
    .island.locked:hover { transform: translate(-50%, -50%); }

    .island-emoji { font-size: 4.5rem; line-height: 1; }
    .island.unlocked .island-emoji { animation: islandFloat 3s ease-in-out infinite; }
    @keyframes islandFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    .island-label {
      color: #fff; font-weight: 700;
      margin-top: 6px;
      background: rgba(0,0,0,0.6);
      padding: 4px 18px;
      border-radius: 30px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 1rem;
      white-space: nowrap;
    }

    /* Lock icon untuk pulau yang belum terbuka */
    .lock-indicator {
      position: absolute;
      top: -12px;
      right: -20px;
      font-size: 1.6rem;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.4));
      opacity: 0.75;
      display: none;
    }
    .island.locked .lock-indicator { display: block; }

    /* Heart formation positions */
    body.heart-mode #island1 { left: 28%; top: 30%; }
    body.heart-mode #island2 { left: 72%; top: 30%; }
    body.heart-mode #island3 { left: 40%; top: 68%; }
    body.heart-mode #island4 { left: 60%; top: 68%; }

    body.heart-mode .island-label {
      background: rgba(0,0,0,0.45);
      font-size: 0.9rem;
    }

    /* ====== Duyung walker ====== */
    .duyung-walker {
      position: absolute;
      width: 80px;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -100%);
      filter: drop-shadow(0 0 15px rgba(255,80,120,0.8));
      transition: opacity 0.5s ease;
    }
    .duyung-walker.show { opacity: 1; }
    body.heart-mode .duyung-walker {
      transition: opacity 0.5s ease,
                  left 1.8s cubic-bezier(0.65, 0, 0.35, 1),
                  top 1.8s cubic-bezier(0.65, 0, 0.35, 1),
                  filter 1s ease;
      filter: drop-shadow(0 0 25px rgba(255, 200, 220, 0.95));
    }

    /* ====== Ripple effect ====== */
    .ripple {
      position: absolute;
      width: 20px; height: 20px;
      border: 2px solid rgba(180, 230, 245, 0.75);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 4;
      opacity: 0;
    }
    .ripple.active {
      animation: rippleExpand 2.2s ease-out forwards;
    }
    @keyframes rippleExpand {
      0% { opacity: 0.85; transform: translate(-50%, -50%) scale(0.5); border-width: 3px; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(9); border-width: 0.5px; }
    }
    .ripple.delay-1 { animation-delay: 0.4s; }
    .ripple.delay-2 { animation-delay: 0.9s; }

    /* Sparkle subtle di sekitar duyung setelah sampai */
    .sparkle-heart {
      position: absolute;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      z-index: 6;
      color: #ffe4ec;
      text-shadow: 0 0 10px rgba(255, 200, 220, 0.9);
      transition: opacity 1.5s ease;
    }
    .sparkle-heart.active {
      opacity: 0.75;
      animation: sparkleTwinkle 3.5s ease-in-out infinite;
    }
    @keyframes sparkleTwinkle {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.5; }
      50% { transform: scale(1.2) rotate(15deg); opacity: 0.9; }
    }

    /* ====== Map message ====== */
    .map-message {
      margin-top: 20px;
      min-height: 35px;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      transition: opacity 1s ease;
    }
    body.heart-mode .map-message { opacity: 0; }

    @keyframes shake {
      0%, 100% { transform: translate(-50%, -50%) translateX(0); }
      25% { transform: translate(-50%, -50%) translateX(-6px); }
      75% { transform: translate(-50%, -50%) translateX(6px); }
    }

    /* ====== Ending overlay ====== */
    .ending-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, rgba(10, 25, 40, 0.55) 0%, rgba(5, 15, 25, 0.85) 100%);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.4s ease;
    }
    .ending-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .ending-content {
      text-align: center;
      max-width: 520px;
      padding: 10px 8px;
    }
    .ending-title {
      font-family: 'Chakra Petch', 'Poppins', sans-serif;
      color: #fff8ee;
      font-size: clamp(1.4rem, 5.5vw, 1.9rem);
      font-weight: 700;
      letter-spacing: 0.8px;
      line-height: 1.35;
      text-shadow: 0 0 25px rgba(255, 220, 180, 0.45);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 1.2s ease, transform 1.2s ease;
    }
    .ending-subtitle {
      margin-top: 16px;
      color: #e6dccb;
      font-size: clamp(0.95rem, 3.8vw, 1.08rem);
      line-height: 1.7;
      font-style: italic;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 1.2s ease 0.5s, transform 1.2s ease 0.5s;
    }
    .ending-buttons {
      margin-top: 34px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 1.2s ease 1.1s, transform 1.2s ease 1.1s;
    }
    .ending-overlay.text-in .ending-title { opacity: 1; transform: translateY(0); }
    .ending-overlay.text-in .ending-subtitle { opacity: 1; transform: translateY(0); }
    .ending-overlay.text-in .ending-buttons { opacity: 1; transform: translateY(0); }

    .ending-btn {
      padding: 13px 28px;
      border: none;
      border-radius: 50px;
      font-family: 'Chakra Petch', 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .ending-btn.primary {
      background: linear-gradient(135deg, #d9a86b, #f2c98a);
      color: #2a1d10;
      box-shadow: 0 8px 22px rgba(217, 168, 107, 0.35);
    }
    .ending-btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(217, 168, 107, 0.55);
    }
    .ending-btn.secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #f0e9dd;
      border: 1.5px solid rgba(255, 240, 215, 0.5);
    }
    .ending-btn.secondary:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    /* ====== Responsive ====== */
    @media (max-width: 600px) {
      .map-area { height: 480px; }
      .island-emoji { font-size: 3.2rem; }
      .island-label { font-size: 0.8rem; padding: 3px 12px; }
      .duyung-walker { width: 56px; }
      .map-title { font-size: 1.6rem; }
      .sea-floor { font-size: 1.8rem; height: 90px; }
      .floating-icons { font-size: 1.5rem; }
      .lock-indicator { font-size: 1.3rem; top: -10px; right: -16px; }
      body.heart-mode .island-label { font-size: 0.75rem; }
      .ending-btn { padding: 12px 22px; font-size: 0.9rem; }
    }
    @media (max-width: 380px) {
      .map-area { height: 400px; }
      .island-emoji { font-size: 2.6rem; }
      .island-label { font-size: 0.7rem; padding: 2px 10px; }
      .duyung-walker { width: 46px; }
      .ending-buttons { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>

  <!-- Dekorasi laut -->
  <div class="floating-icons">
    <span class="float-icon" style="top:8%; left:7%;">🐠</span>
    <span class="float-icon" style="top:25%; right:10%; animation-delay:2s;">🪼</span>
    <span class="float-icon" style="top:55%; left:12%; animation-delay:4s;">🐡</span>
    <span class="float-icon" style="top:70%; right:15%; animation-delay:1s;">🦑</span>
    <span class="float-icon" style="top:15%; left:60%; animation-delay:3s;">🐳</span>
    <span class="float-icon" style="top:40%; right:25%; animation-delay:5s;">🐬</span>
    <span class="float-icon" style="top:80%; left:30%; animation-delay:2.5s;">🦀</span>
    <span class="float-icon" style="top:65%; left:45%; animation-delay:3.5s;">🐚</span>
    <span class="float-icon" style="top:30%; left:20%; animation-delay:1.5s;">⭐</span>
    <span class="float-icon" style="top:50%; right:5%; animation-delay:4.5s;">💎</span>
    <span class="float-icon" style="bottom:25%; left:5%; animation-delay:0.8s;">🪸</span>
  </div>

  <div class="sea-floor">
    <span>🌿</span><span>🪸</span><span>🌿</span><span>🐚</span><span>🪸</span><span>🌿</span><span>⭐</span>
  </div>

  <div class="map-container">
    <div class="map-title" id="mapTitle">A Little Story</div>
    <div class="map-subtitle" id="mapSubtitle">Just a few things I wanted you to see.</div>

    <div class="map-area" id="mapArea">
      <!-- Path tersembunyi: titik mulai → island1 -->
      <svg class="snake-path snake-path-hidden" viewBox="0 0 800 600" preserveAspectRatio="none">
        <path id="snakePathHidden" d="M400,560 C300,480 180,280 120,120" />
      </svg>

      <!-- Path normal: tersebar -->
      <svg class="snake-path" id="pathNormal" viewBox="0 0 800 600" preserveAspectRatio="none">
        <path id="snakePathVisible" d="M120,120 C260,180 140,320 304,432 C420,520 480,220 640,270 C560,340 760,400 704,510" />
      </svg>

      <!-- Path heart: formasi hati -->
      <svg class="snake-path" id="pathHeart" viewBox="0 0 800 600" preserveAspectRatio="none">
        <path d="M224,180 
                 C 300,120 360,215 400,215 
                 C 440,215 500,120 576,180 
                 C 660,255 660,375 560,435
                 C 460,490 380,460 320,408
                 C 360,470 380,555 400,555
                 C 420,555 440,470 480,408" />
      </svg>

      <!-- Islands -->
      <div class="island" id="island1" style="left:15%; top:20%;" data-target="island-1.html">
        <div class="island-emoji">🏝️</div>
        <div class="island-label">Island 1</div>
        <span class="lock-indicator">🔒</span>
      </div>
      <div class="island" id="island2" style="left:38%; top:72%;" data-target="island-2.html">
        <div class="island-emoji">🏝️</div>
        <div class="island-label">Island 2</div>
        <span class="lock-indicator">🔒</span>
      </div>
      <div class="island" id="island3" style="left:80%; top:45%;" data-target="island-3.html">
        <div class="island-emoji">🏝️</div>
        <div class="island-label">Island 3</div>
        <span class="lock-indicator">🔒</span>
      </div>
      <div class="island" id="island4" style="left:88%; top:85%;" data-target="island-4.html">
        <div class="island-emoji">🏝️</div>
        <div class="island-label">Island 4</div>
        <span class="lock-indicator">🔒</span>
      </div>

      <!-- Ripples -->
      <div class="ripple" id="ripple1"></div>
      <div class="ripple delay-1" id="ripple2"></div>
      <div class="ripple delay-2" id="ripple3"></div>

      <!-- Duyung -->
      <img src="assets/duyung.png" alt="Ratu Kucing Duyung" class="duyung-walker" id="duyungWalker">
    </div>

    <div class="map-message" id="mapMessage">Pilih salah satu pulau buat kamu jelajahi.</div>
  </div>

  <!-- ====== Ending Overlay ====== -->
  <div class="ending-overlay" id="endingOverlay">
    <div class="ending-content">
      <div class="ending-title">You Made It All the Way Here</div>
      <div class="ending-subtitle">And now you know everything I wanted you to know.</div>
      <div class="ending-buttons">
        <button class="ending-btn primary" id="btnReplay">Replay the Journey ↻</button>
        <button class="ending-btn secondary" id="btnExplore">Explore the Islands →</button>
      </div>
    </div>
  </div>

  <script src="state.js"></script>
  <script>
    (function() {
      // ====== Gelembung ======
      const bubblesContainer = document.createElement('div');
      bubblesContainer.style.cssText = 'position:fixed;width:100%;height:100%;top:0;left:0;pointer-events:none;z-index:0;';
      document.body.appendChild(bubblesContainer);
      for (let i = 0; i < 30; i++) {
        const bubble = document.createElement('div');
        const size = Math.random() * 50 + 20;
        bubble.style.cssText = `position:absolute;bottom:-80px;width:${size}px;height:${size}px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:50%;animation:rise ${Math.random() * 8 + 6}s linear infinite;animation-delay:${Math.random() * 5}s;left:${Math.random() * 100}%;`;
        bubblesContainer.appendChild(bubble);
      }
      const riseStyle = document.createElement('style');
      riseStyle.textContent = '@keyframes rise { 0% { transform: translateY(0) scale(1); opacity: 0.6; } 100% { transform: translateY(-110vh) scale(1.4); opacity: 0; } }';
      document.head.appendChild(riseStyle);

      // ====== Elemen ======
      const pathHidden = document.getElementById('snakePathHidden');
      const pathVisible = document.getElementById('snakePathVisible');
      const duyungWalker = document.getElementById('duyungWalker');
      const mapArea = document.getElementById('mapArea');
      const mapMessage = document.getElementById('mapMessage');
      const islandElements = document.querySelectorAll('.island');
      const endingOverlay = document.getElementById('endingOverlay');
      const btnReplay = document.getElementById('btnReplay');
      const btnExplore = document.getElementById('btnExplore');
      const ripple1 = document.getElementById('ripple1');
      const ripple2 = document.getElementById('ripple2');
      const ripple3 = document.getElementById('ripple3');

      let isAnimating = false;
      let heartMode = false;

      // ====== Fungsi state pulau ======
      function refreshIslandLockState() {
        const unlocked = getUnlockedIslands();
        islandElements.forEach(island => {
          const id = island.id;
          if (unlocked.includes(id)) {
            island.classList.remove('locked');
            island.classList.add('unlocked');
          } else {
            island.classList.add('locked');
            island.classList.remove('unlocked');
          }
        });
      }
      refreshIslandLockState();

      // ====== Path geometry ======
      const islandCoordsViewBox = {
        island1: { x: 120, y: 120 },
        island2: { x: 304, y: 432 },
        island3: { x: 640, y: 270 },
        island4: { x: 704, y: 510 }
      };

      const pathLengthCache = new Map();
      function getPathLength(path) {
        if (!pathLengthCache.has(path)) pathLengthCache.set(path, path.getTotalLength());
        return pathLengthCache.get(path);
      }

      function findProgressForCoords(path, x, y) {
        const totalLength = getPathLength(path);
        let bestProgress = 0;
        let bestDist = Infinity;
        for (let i = 0; i <= totalLength; i += 4) {
          const p = path.getPointAtLength(i);
          const dist = Math.hypot(p.x - x, p.y - y);
          if (dist < bestDist) {
            bestDist = dist;
            bestProgress = i / totalLength;
          }
        }
        return bestProgress;
      }

      const progressVisible = {
        island1: 0,
        island2: findProgressForCoords(pathVisible, islandCoordsViewBox.island2.x, islandCoordsViewBox.island2.y),
        island3: findProgressForCoords(pathVisible, islandCoordsViewBox.island3.x, islandCoordsViewBox.island3.y),
        island4: 1
      };

      function resolveAnchor(atIsland) {
        if (atIsland === null || atIsland === undefined) {
          return { path: pathHidden, progress: 0 };
        }
        if (atIsland === 'island1') {
          return { path: pathVisible, progress: 0 };
        }
        return { path: pathVisible, progress: progressVisible[atIsland] ?? 0 };
      }

      function getScreenPosition(path, progress) {
        const totalLength = getPathLength(path);
        const point = path.getPointAtLength(totalLength * progress);
        const mapRect = mapArea.getBoundingClientRect();
        const scaleX = mapRect.width / 800;
        const scaleY = mapRect.height / 600;
        return { left: point.x * scaleX, top: point.y * scaleY };
      }

      let duyungState = getDuyungState();

      function setDuyungFromState() {
        if (heartMode) return; // di heart mode posisi duyung dikunci di tengah
        const { path, progress } = resolveAnchor(duyungState.atIsland);
        const pos = getScreenPosition(path, progress);
        duyungWalker.style.left = pos.left + 'px';
        duyungWalker.style.top = pos.top + 'px';
        duyungWalker.classList.add('show');
      }

      function refreshDuyungAfterBack() {
        isAnimating = false;

        const overlay = document.getElementById('transitionOverlay');
        if (overlay) {
          overlay.style.opacity = '0';
          overlay.style.pointerEvents = 'none';
          overlay.style.display = 'none';
        }

        duyungState = getDuyungState();
        if (!heartMode) setDuyungFromState();
        refreshIslandLockState();
      }

      setDuyungFromState();

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (!isAnimating && !heartMode) setDuyungFromState();
        }, 150);
      });

      window.addEventListener('pageshow', function() {
        setTimeout(refreshDuyungAfterBack, 50);
      });

      document.addEventListener('visibilitychange', function() {
        if (!document.hidden && !isAnimating) {
          refreshDuyungAfterBack();
        }
      });

      // ====== Animasi duyung mengikuti path ======
      function animateDuyung(path, fromProgress, toProgress, callback) {
        if (Math.abs(toProgress - fromProgress) < 0.001) {
          if (callback) callback();
          return;
        }
        const duration = 1400;
        const startTime = performance.now();
        duyungWalker.classList.add('show');
        function step(now) {
          const elapsed = now - startTime;
          const t = Math.min(elapsed / duration, 1);
          const eased = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
          const progress = fromProgress + (toProgress - fromProgress) * eased;
          const pos = getScreenPosition(path, progress);
          duyungWalker.style.left = pos.left + 'px';
          duyungWalker.style.top = pos.top + 'px';
          if (t < 1) requestAnimationFrame(step);
          else if (callback) callback();
        }
        requestAnimationFrame(step);
      }

      // ====== Klik pulau ======
      islandElements.forEach(island => {
        island.addEventListener('click', function() {
          if (isAnimating) return;
          if (this.classList.contains('locked')) {
            mapMessage.textContent = '🔒 Pulau ini masih terkunci. Selesaikan pulau sebelumnya dulu ya.';
            this.style.animation = 'shake 0.5s ease';
            setTimeout(() => { this.style.animation = ''; }, 500);
            return;
          }

          const islandId = this.id;
          const target = this.getAttribute('data-target');

          // Di heart mode: langsung navigasi tanpa animasi duyung
          if (heartMode) {
            navigateTo(target);
            return;
          }

          const label = this.querySelector('.island-label').textContent;
          if (duyungState.atIsland === islandId) {
            navigateTo(target);
            return;
          }
          const start = resolveAnchor(duyungState.atIsland);
          const end = resolveAnchor(islandId);
          mapMessage.textContent = `Ratu Kucing Duyung berlayar ke ${label}...`;
          isAnimating = true;
          function arrive() {
            isAnimating = false;
            duyungState = { atIsland: islandId };
            setDuyungAtIsland(islandId);
            navigateTo(target);
          }
          if (start.path === end.path) {
            animateDuyung(start.path, start.progress, end.progress, arrive);
          } else {
            animateDuyung(start.path, start.progress, 1, () => {
              animateDuyung(end.path, 0, end.progress, arrive);
            });
          }
        });
      });

      // ============================================================
      // ====== ENDING SEQUENCE ======
      // ============================================================
      const ALL_ISLANDS = ['island1', 'island2', 'island3', 'island4'];

      function allIslandsCompleted() {
        const completed = getCompletedIslands();
        return ALL_ISLANDS.every(id => completed.includes(id));
      }

      function enterHeartFormation(animate) {
        heartMode = true;

        if (!animate) {
          // Langsung set posisi tanpa animasi (untuk revisit)
          document.body.classList.add('heart-mode');
          // Posisikan duyung di tengah
          const mapRect = mapArea.getBoundingClientRect();
          duyungWalker.style.transition = 'none';
          duyungWalker.style.left = (mapRect.width * 0.5) + 'px';
          duyungWalker.style.top = (mapRect.height * 0.52) + 'px';
          duyungWalker.classList.add('show');
          // Restore transition
          setTimeout(() => { duyungWalker.style.transition = ''; }, 50);
          return;
        }

        // Animasi:
        // 1) Delay kecil dulu
        // 2) Masuk heart mode (islands + paths animate via CSS transition)
        // 3) Setelah islands selesai, duyung bergerak ke tengah
        // 4) Ripple + sparkle
        // 5) Overlay text

        setTimeout(() => {
          document.body.classList.add('heart-mode');

          // Setelah islands sampai posisi baru (~2.2s), gerakkan duyung ke tengah
          setTimeout(() => {
            const mapRect = mapArea.getBoundingClientRect();
            const centerX = mapRect.width * 0.5;
            const centerY = mapRect.height * 0.52;

            duyungWalker.style.left = centerX + 'px';
            duyungWalker.style.top = centerY + 'px';
            duyungWalker.classList.add('show');

            // Setelah duyung sampai (~1.8s), tampilkan ripple + sparkle
            setTimeout(() => {
              // Ripple di posisi duyung
              [ripple1, ripple2, ripple3].forEach(r => {
                r.style.left = centerX + 'px';
                r.style.top = centerY + 'px';
                r.classList.remove('active');
                void r.offsetWidth;
                r.classList.add('active');
              });

              // Setelah ripple muncul sebentar, tampilkan overlay text
              setTimeout(() => {
                endingOverlay.classList.add('visible');
                setTimeout(() => {
                  endingOverlay.classList.add('text-in');
                }, 100);
              }, 1600);

            }, 1900);

          }, 2300);

        }, 700);
      }

      // ====== Button handlers ======
      btnReplay.addEventListener('click', function() {
        sessionStorage.setItem('heartEndingPlayed', 'true');
        navigateTo('index.html');
      });

      btnExplore.addEventListener('click', function() {
        sessionStorage.setItem('heartEndingPlayed', 'true');
        endingOverlay.classList.remove('text-in');
        setTimeout(() => {
          endingOverlay.classList.remove('visible');
        }, 500);
      });

      // ====== Trigger ending pada load ======
      window.addEventListener('load', function() {
        if (!allIslandsCompleted()) {
          // Kalau tidak semua selesai, hapus flag (kalau ada)
          sessionStorage.removeItem('heartEndingPlayed');
          return;
        }

        const alreadyPlayed = sessionStorage.getItem('heartEndingPlayed') === 'true';

        if (alreadyPlayed) {
          // Revisit: langsung heart formation tanpa animasi
          enterHeartFormation(false);
        } else {
          // First time: play full cinematic sequence
          enterHeartFormation(true);
        }
      });

    })();
  </script>
</body>
</html>
