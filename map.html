<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta Kepulauan Ratu Kucing Duyung 🏝️</title>
  <style>
    :root {
      --deep-sea-1: #0a1c2e;
      --deep-sea-2: #0d2b45;
      --deep-sea-3: #0f3b5c;
      --gold-1: #FFD700;
      --gold-light: #FFE44D;
      --text-light: #e0f0ff;
      --accent-pink: #ff8fab;
      --card-bg: rgba(10, 25, 40, 0.75);
      --card-border: rgba(255, 255, 255, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, var(--deep-sea-1) 0%, var(--deep-sea-2) 40%, var(--deep-sea-3) 100%);
      overflow-x: hidden;
      position: relative;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Gelembung */
    .bubbles {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bubble {
      position: absolute;
      bottom: -80px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      animation: rise linear infinite;
    }
    @keyframes rise {
      0% { transform: translateY(0) scale(1); opacity: 0.6; }
      100% { transform: translateY(-110vh) scale(1.4); opacity: 0; }
    }

    /* Dekorasi ikon laut */
    .floating-icons {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
      font-size: 2rem;
      user-select: none;
    }
    .float-icon {
      position: absolute;
      animation: floatAround 10s ease-in-out infinite;
      opacity: 0.4;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.2));
    }
    @keyframes floatAround {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-25px) rotate(8deg); }
    }

    /* Dasar laut */
    .sea-floor {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 120px;
      pointer-events: none;
      z-index: 0;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      font-size: 2.5rem;
      opacity: 0.6;
      padding-bottom: 10px;
      user-select: none;
    }
    .sea-floor span {
      display: inline-block;
      animation: sway 4s ease-in-out infinite;
      transform-origin: bottom center;
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(6deg); }
    }

    /* Tombol kembali */
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 20;
      padding: 10px 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50px;
      background: rgba(0,0,0,0.4);
      color: var(--text-light);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(10px);
    }
    .back-btn:hover {
      background: rgba(0,0,0,0.6);
      transform: translateX(-3px);
      border-color: var(--accent-pink);
    }

    /* Konten peta */
    .map-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 850px;
      text-align: center;
      margin-top: 40px;
    }

    .map-title {
      color: var(--text-light);
      font-size: 2rem;
      font-weight: 700;
      text-shadow: 0 0 20px rgba(255,255,255,0.3);
      margin-bottom: 5px;
      animation: fadeInDown 1s ease;
    }
    .map-subtitle {
      color: #c2d8e8;
      font-size: 1rem;
      margin-bottom: 20px;
      animation: fadeInDown 1s ease 0.2s both;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Area peta */
    .map-area {
      position: relative;
      width: 100%;
      height: 600px;
      margin: 0 auto;
    }

    /* Garis pathway */
    .snake-path {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .snake-path path {
      fill: none;
      stroke: rgba(255, 215, 0, 0.6);
      stroke-width: 4;
      stroke-dasharray: 12 10;
      stroke-linecap: round;
      animation: dashMove 2s linear infinite;
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -22; }
    }

    /* Pulau */
    .island {
      position: absolute;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.3s, filter 0.3s;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
      user-select: none;
    }
    .island:hover:not(.locked) {
      transform: scale(1.1);
    }
    .island.locked {
      opacity: 0.5;
      filter: grayscale(0.6) drop-shadow(0 4px 6px rgba(0,0,0,0.5));
      cursor: not-allowed;
    }
    .island.locked:hover {
      transform: none;
    }

    .island-emoji {
      font-size: 4.5rem;
      line-height: 1;
      transition: transform 0.3s;
    }
    .island.unlocked .island-emoji {
      animation: islandFloat 3s ease-in-out infinite;
    }
    @keyframes islandFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .island-label {
      color: var(--text-light);
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 6px;
      background: rgba(0,0,0,0.6);
      padding: 4px 18px;
      border-radius: 30px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .key-indicator {
      position: absolute;
      top: -15px;
      right: -25px;
      font-size: 2.2rem;
      animation: keyBounce 2s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(255,215,0,0.8));
      display: none;
    }
    .island.unlocked .key-indicator {
      display: block;
    }
    @keyframes keyBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* Karakter duyung */
    .duyung-walker {
      position: absolute;
      width: 80px;
      height: auto;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      filter: drop-shadow(0 0 15px rgba(255, 80, 120, 0.8));
    }
    .duyung-walker.show {
      opacity: 1;
    }

    /* Pesan */
    .map-message {
      margin-top: 20px;
      min-height: 35px;
      color: var(--text-light);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      animation: fadeInUp 0.5s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsif */
    @media (max-width: 600px) {
      .map-area {
        height: 480px;
      }
      .island-emoji {
        font-size: 3.2rem;
      }
      .island-label {
        font-size: 0.85rem;
        padding: 3px 12px;
      }
      .key-indicator {
        font-size: 1.8rem;
        right: -18px;
        top: -10px;
      }
      .map-title {
        font-size: 1.6rem;
      }
      .duyung-walker {
        width: 60px;
      }
      .back-btn {
        top: 10px;
        left: 10px;
        padding: 8px 15px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- Gelembung -->
  <div class="bubbles" id="bubbles"></div>

  <!-- Ikon laut -->
  <div class="floating-icons">
    <span class="float-icon" style="top:8%; left:7%;">🐠</span>
    <span class="float-icon" style="top:25%; right:10%; animation-delay:2s;">🪼</span>
    <span class="float-icon" style="top:55%; left:12%; animation-delay:4s;">🐡</span>
    <span class="float-icon" style="top:70%; right:15%; animation-delay:1s;">🦑</span>
    <span class="float-icon" style="top:15%; left:60%; animation-delay:3s;">🐳</span>
    <span class="float-icon" style="top:40%; right:25%; animation-delay:5s;">🐬</span>
    <span class="float-icon" style="top:80%; left:30%; animation-delay:2.5s;">🦀</span>
    <span class="float-icon" style="top:65%; left:45%; animation-delay:3.5s;">🐚</span>
    <span class="float-icon" style="top:30%; left:20%; animation-delay:1.5s;">⭐</span>
    <span class="float-icon" style="top:50%; right:5%; animation-delay:4.5s;">💎</span>
    <span class="float-icon" style="bottom:25%; left:5%; animation-delay:0.8s;">🪸</span>
  </div>

  <!-- Dasar laut -->
  <div class="sea-floor">
    <span>🌿</span><span>🪸</span><span>🌿</span><span>🐚</span><span>🪸</span><span>🌿</span><span>⭐</span>
  </div>

  <!-- Tombol kembali -->
  <a href="index.html" class="back-btn">⬅️ Kembali</a>

  <!-- Peta -->
  <div class="map-container">
    <div class="map-title">🗺️ Peta Kepulauan Ratu Kucing Duyung</div>
    <div class="map-subtitle">Jelajahi pulau-pulau untuk mengumpulkan kunci dan membuka misteri</div>

    <div class="map-area" id="mapArea">
      <!-- SVG Pathway (meliuk acak) -->
      <svg class="snake-path" viewBox="0 0 800 600" preserveAspectRatio="none">
        <path id="snakePath" d="M120,520 
                 C180,440 220,480 280,420 
                 C330,370 300,390 370,330 
                 C430,280 420,350 480,300 
                 C540,250 530,210 600,160 
                 C650,120 680,90 720,70" />
      </svg>

      <!-- Island 1 -->
      <div class="island unlocked" id="island1" style="left:12%; top:80%;" data-target="island-1.html">
        <div class="island-emoji">🏝️</div>
        <div class="island-label">Island 1</div>
        <span class="key-indicator">🔑</span>
      </div>

      <!-- Island 2 -->
      <div class="island locked" id="island2" style="left:35%; top:62%;" data-target="island-2.html">
        <div class="island-emoji">🏝️</div>
        <div class="island-label">Island 2</div>
        <span class="key-indicator">🔑</span>
      </div>

      <!-- Island 3 -->
      <div class="island locked" id="island3" style="left:58%; top:45%;" data-target="island-3.html">
        <div class="island-emoji">🏝️</div>
        <div class="island-label">Island 3</div>
        <span class="key-indicator">🔑</span>
      </div>

      <!-- Island 4 -->
      <div class="island locked" id="island4" style="left:82%; top:18%;" data-target="island-4.html">
        <div class="island-emoji">🏝️</div>
        <div class="island-label">Island 4</div>
        <span class="key-indicator">🔑</span>
      </div>

      <!-- Karakter Duyung -->
      <img src="assets/duyung.png" alt="Ratu Kucing Duyung" class="duyung-walker" id="duyungWalker">
    </div>

    <div class="map-message" id="mapMessage">Klik pulau yang sudah terbuka untuk berlayar.</div>
  </div>

  <script>
    // ===== Gelembung =====
    const bubblesContainer = document.getElementById('bubbles');
    const bubbleCount = 30;
    for (let i = 0; i < bubbleCount; i++) {
      const bubble = document.createElement('div');
      bubble.classList.add('bubble');
      const size = Math.random() * 50 + 20;
      bubble.style.width = size + 'px';
      bubble.style.height = size + 'px';
      bubble.style.left = Math.random() * 100 + '%';
      bubble.style.animationDuration = Math.random() * 8 + 6 + 's';
      bubble.style.animationDelay = Math.random() * 5 + 's';
      bubblesContainer.appendChild(bubble);
    }

    // ===== Status pulau dari localStorage =====
    let unlockedIslands = JSON.parse(localStorage.getItem('unlockedIslands')) || [];
    // Jika kosong, set default hanya island1
    if (unlockedIslands.length === 0) {
      unlockedIslands = ['island1'];
      localStorage.setItem('unlockedIslands', JSON.stringify(unlockedIslands));
    }

    // Terapkan class unlocked/locked
    const islandElements = document.querySelectorAll('.island');
    islandElements.forEach(island => {
      const id = island.id;
      if (unlockedIslands.includes(id)) {
        island.classList.remove('locked');
        island.classList.add('unlocked');
      } else {
        island.classList.add('locked');
        island.classList.remove('unlocked');
      }
    });

    // ===== Peta dan animasi =====
    const mapArea = document.getElementById('mapArea');
    const snakePath = document.getElementById('snakePath');
    const duyungWalker = document.getElementById('duyungWalker');
    const mapMessage = document.getElementById('mapMessage');
    let isAnimating = false;

    // Progress pulau di sepanjang path (0 = awal, 1 = akhir)
    const islandProgress = {
      island1: 0.1,
      island2: 0.35,
      island3: 0.6,
      island4: 0.9
    };

    // Fungsi konversi koordinat path ke posisi di map-area
    function getDuyungPosition(progress) {
      const totalLength = snakePath.getTotalLength();
      const point = snakePath.getPointAtLength(totalLength * progress);

      // Konversi viewBox 800x600 ke ukuran mapArea
      const mapRect = mapArea.getBoundingClientRect();
      const scaleX = mapRect.width / 800;
      const scaleY = mapRect.height / 600;

      return {
        left: point.x * scaleX,
        top: point.y * scaleY
      };
    }

    // Fungsi animasi duyung bergerak mengikuti path
    function animateDuyung(startProgress, endProgress, callback) {
      const totalLength = snakePath.getTotalLength();
      const duration = 1500; // ms
      const startTime = performance.now();

      duyungWalker.classList.add('show');

      function step(currentTime) {
        const elapsed = currentTime - startTime;
        const t = Math.min(elapsed / duration, 1);
        // easing sederhana
        const eased = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
        const progress = startProgress + (endProgress - startProgress) * eased;

        const pos = getDuyungPosition(progress);
        duyungWalker.style.left = pos.left + 'px';
        duyungWalker.style.top = pos.top + 'px';

        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          duyungWalker.classList.remove('show');
          if (callback) callback();
        }
      }

      requestAnimationFrame(step);
    }

    // ===== Interaksi pulau =====
    islandElements.forEach(island => {
      island.addEventListener('click', function() {
        if (isAnimating) return;

        if (this.classList.contains('locked')) {
          mapMessage.textContent = "🔒 Island ini masih terkunci. Selesaikan island sebelumnya dulu!";
          this.style.animation = 'shake 0.5s ease';
          setTimeout(() => { this.style.animation = ''; }, 500);
          return;
        }

        const target = this.getAttribute('data-target');
        const islandId = this.id;
        const endProgress = islandProgress[islandId];
        const startProgress = islandId === 'island1' ? 0 : (islandProgress[Object.keys(islandProgress).find(key => islandProgress[key] < endProgress)] || 0);

        mapMessage.textContent = `⛵ Ratu Kucing Duyung berlayar ke ${this.querySelector('.island-label').textContent}...`;
        isAnimating = true;

        animateDuyung(startProgress, endProgress, () => {
          window.location.href = target;
        });
      });
    });

    // Keyframes shake
    const styleSheet = document.createElement('style');
    styleSheet.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        75% { transform: translateX(6px); }
      }
    `;
    document.head.appendChild(styleSheet);
  </script>
</body>
</html>
