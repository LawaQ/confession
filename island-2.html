<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulau 2 - Miraculous Ladybug 🐞</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --merah: #e10600;
      --merah-muda: #ff5f7a;
      --putih: #f5f5f5;
      --abu: #c0c0c0;
      --emas: #ffd700;
      --hitam: #0a0a0a;
      --bubble-bg: rgba(220, 60, 90, 0.30);
      --bubble-border: rgba(255,255,255,0.4);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-image: url('assets/background-island-2.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #1a1a1a;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      padding: 80px 20px 100px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Rajdhani', sans-serif;
      color: var(--putih);
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: 0;
      pointer-events: none;
    }

    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 20;
      padding: 10px 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50px;
      background: rgba(0,0,0,0.5);
      color: var(--putih);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(10px);
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .back-btn:hover {
      background: rgba(0,0,0,0.7);
      border-color: var(--merah-muda);
    }

    .main-container {
      position: relative;
      z-index: 2;
      max-width: 650px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }

    /* Transformasi */
    .transform-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 12vh;
      animation: fadeInDown 1s ease;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ladybug-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(217, 35, 50, 0.8);
    }
    .ladybug-subtitle {
      font-size: 1.1rem;
      color: var(--abu);
      letter-spacing: 1px;
      font-weight: 500;
    }
    .ladybug-earring-img {
      width: 100px;
      max-width: 100%;
      margin: 0 auto;
      filter: drop-shadow(0 0 25px rgba(255, 80, 120, 0.8));
      animation: floatEarring 3s ease-in-out infinite;
      cursor: pointer;
    }
    @keyframes floatEarring {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    .btn-transform {
      padding: 15px 40px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #d92332, #ff5f7a);
      color: white;
      font-size: 1.3rem;
      font-weight: 700;
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 20px rgba(217, 35, 50, 0.6);
    }
    .btn-transform:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 25px rgba(217, 35, 50, 0.9);
    }

    /* Overlay transformasi */
    .transform-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.75);
      flex-direction: column;
      gap: 20px;
    }
    .transform-overlay.active {
      display: flex;
    }
    .transform-earring-img {
      width: 180px;
      max-width: 80%;
      filter: drop-shadow(0 0 60px rgba(255, 95, 122, 1));
      animation: spinGlow 1.5s ease-in-out infinite;
    }
    @keyframes spinGlow {
      0% { transform: scale(0.7) rotate(0deg); opacity: 0.5; }
      50% { transform: scale(1.2) rotate(180deg); opacity: 1; }
      100% { transform: scale(0.7) rotate(360deg); opacity: 0.5; }
    }
    .transform-text {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: white;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(255, 80, 120, 0.9);
      animation: pulseText 1s ease-in-out infinite;
    }
    @keyframes pulseText {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    /* Surat */
    .letter-section {
      display: none;
      text-align: left;
      margin-top: 30px;
      opacity: 0;
      transition: opacity 1s ease;
    }
    .letter-section.visible {
      display: block;
      opacity: 1;
    }

    .ladybug-bubble {
      background-color: var(--bubble-bg);
      background-image: radial-gradient(circle, rgba(0,0,0,0.35) 10px, transparent 11px);
      background-size: 60px 60px;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      border-radius: 30px;
      padding: 35px 30px;
      border: 2px solid var(--bubble-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      position: relative;
    }

    /* Dekorasi bubble */
    .bubble-decor {
      position: absolute;
      width: 80px;
      max-width: 30%;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
      pointer-events: none;
      z-index: 3;
    }
    .bubble-decor-left {
      top: -25px;
      left: -25px;
      transform: rotate(-15deg);
    }
    .bubble-decor-right {
      bottom: -25px;
      right: -25px;
      transform: rotate(15deg);
    }

    .letter-header {
      text-align: center;
      margin-bottom: 35px;
    }
    .letter-tag {
      display: inline-block;
      padding: 6px 20px;
      border: 2px solid #ff5f7a;
      border-radius: 50px;
      color: #ff5f7a;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-transform: uppercase;
      background: rgba(255, 95, 122, 0.1);
    }
    .letter-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: white;
      text-shadow: 0 0 15px rgba(255, 95, 122, 0.7);
    }
    .letter-subtitle {
      color: #e0e0e0;
      font-size: 1rem;
      margin-top: 10px;
    }

    .typewriter-text {
      font-size: 1.15rem;
      line-height: 1.8;
      color: #f0f0f0;
      margin-bottom: 20px;
      min-height: 1.8em;
      font-weight: 500;
      text-shadow: 0 0 5px rgba(0,0,0,0.5);
    }
    .signature {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--emas);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 30px;
      text-align: right;
      opacity: 0;
      transition: opacity 1s;
    }

    /* Tombol selesai */
    .btn-finish {
      display: inline-block;
      margin-top: 25px;
      padding: 15px 35px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #d92332, #ff5f7a);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 20px rgba(217, 35, 50, 0.6);
      opacity: 0;
      pointer-events: none;
    }
    .btn-finish.visible {
      opacity: 1;
      pointer-events: auto;
      animation: fadeInUp 0.8s ease forwards;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .ladybug-title { font-size: 1.8rem; }
      .typewriter-text { font-size: 1.05rem; }
      .ladybug-bubble { padding: 20px 15px; }
      .letter-title { font-size: 1.8rem; }
      .ladybug-earring-img { width: 70px; }
      .transform-earring-img { width: 120px; }
      .bubble-decor { width: 60px; }
      .bubble-decor-left { top: -15px; left: -15px; }
      .bubble-decor-right { bottom: -15px; right: -15px; }
    }
  </style>
</head>
<body>

  <a href="#" class="back-btn" id="backBtn">⬅️ Kembali</a>

  <div class="main-container">
    <!-- Transformasi -->
    <div class="transform-section" id="transformSection">
      <div class="ladybug-title">🐞 Pulau 2: Miraculous Ladybug</div>
      <div class="ladybug-subtitle">Saatnya bertransformasi untuk membuka surat</div>
      <img src="assets/earrings.png" alt="Earrings" class="ladybug-earring-img">
      <button class="btn-transform" id="btnTransform">Transform!</button>
    </div>

    <!-- Overlay -->
    <div class="transform-overlay" id="transformOverlay">
      <img src="assets/earrings.png" alt="Earrings" class="transform-earring-img">
      <div class="transform-text" id="transformText">Tikki, spots on!</div>
    </div>

    <!-- Surat -->
    <div class="letter-section" id="letterSection">
      <div class="ladybug-bubble">
        <img src="assets/island2-kiri.png" alt="" class="bubble-decor bubble-decor-left">
        <img src="assets/island2-kanan.png" alt="" class="bubble-decor bubble-decor-right">

        <div class="letter-header">
          <div class="letter-tag">🐞 Miraculous</div>
          <h1 class="letter-title">Surat dari Ladybug</h1>
          <div class="letter-subtitle">Ditulis setelah transformasi</div>
        </div>

        <p class="typewriter-text" data-text="Halo, kamu..."></p>
        <p class="typewriter-text" data-text="Hari ini aku bertransformasi menjadi Ladybug, pahlawan yang selalu berusaha melindungi yang penting. Dan yang terpenting bagiku sekarang adalah kamu."></p>
        <p class="typewriter-text" data-text="Seperti Ladybug yang butuh Cat Noir, mungkin aku juga butuh kamu. Bukan untuk melawan penjahat, tapi untuk menjalani hari-hari yang kadang terasa berat."></p>
        <p class="typewriter-text" data-text="Aku tahu kita pernah saling suka, tapi aku tidak pernah berani melangkah lebih jauh. Sekarang, aku ingin berubah—bukan karena kekuatan ajaib, tapi karena aku ingin memperjuangkanmu."></p>
        <p class="typewriter-text" data-text="Jika kamu masih mau, aku ingin kita mencoba. Seperti Ladybug dan Cat Noir yang selalu bersama, aku ingin kita juga saling menjaga."></p>
        <p class="typewriter-text" data-text="Terima kasih sudah membaca sampai sini. Surat ini kutulis dengan hati, bukan dengan sihir."></p>

        <div class="signature" id="signature">— Cat Noir-mu</div>

        <button class="btn-finish" id="btnFinish">Selesaikan Pulau 2 ✓</button>
      </div>
    </div>
  </div>

  <script src="state.js"></script>
  <script>
    (function() {
      const backBtn = document.getElementById('backBtn');
      backBtn.addEventListener('click', function(e) {
        e.preventDefault();
        setDuyungAtIsland('island2');
        window.location.href = 'map.html';
      });

      const btnTransform = document.getElementById('btnTransform');
      const transformSection = document.getElementById('transformSection');
      const transformOverlay = document.getElementById('transformOverlay');
      const transformText = document.getElementById('transformText');
      const letterSection = document.getElementById('letterSection');
      const signature = document.getElementById('signature');
      const btnFinish = document.getElementById('btnFinish');
      const typewriterElements = document.querySelectorAll('.typewriter-text');

      let isTransforming = false;

      btnTransform.addEventListener('click', function() {
        if (isTransforming) return;
        isTransforming = true;

        transformSection.style.display = 'none';
        transformOverlay.classList.add('active');

        setTimeout(() => {
          transformText.textContent = 'TRANSFORMED! 🐞';
        }, 2500);

        setTimeout(() => {
          transformOverlay.classList.remove('active');
          letterSection.classList.add('visible');
          startTypewriter();
        }, 3500);
      });

      function startTypewriter() {
        let currentIndex = 0;
        function typeNext() {
          if (currentIndex >= typewriterElements.length) {
            signature.style.opacity = '1';
            btnFinish.classList.add('visible');
            return;
          }
          const element = typewriterElements[currentIndex];
          const text = element.getAttribute('data-text');
          element.textContent = '';
          let charIndex = 0;
          function typeChar() {
            if (charIndex < text.length) {
              element.textContent += text.charAt(charIndex);
              charIndex++;
              setTimeout(typeChar, 30);
            } else {
              currentIndex++;
              setTimeout(typeNext, 400);
            }
          }
          typeChar();
        }
        typeNext();
      }

      btnFinish.addEventListener('click', function() {
        completeIslandAndReturn('island2');
      });
    })();
  </script>
</body>
</html>
