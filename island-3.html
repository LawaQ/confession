<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Out of Character</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #c9a86b;
      --gold-soft: #e6c98a;
      --putih: #f0f0f0;
      --abu-terang: #a8a8a8;
      --abu-sedang: #5a5a5a;
      --abu-gelap: #1e1e1e;
      --panel-dark: rgba(15, 15, 15, 0.55);
      --panel-light: rgba(255, 250, 240, 0.55);
      --border-dark: rgba(255, 255, 255, 0.12);
      --border-light: rgba(255, 220, 180, 0.4);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      padding: 70px 18px 90px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Rajdhani', sans-serif;
      color: var(--putih);
      background-color: #0a0a0a;
    }

    /* ===== BACKGROUND LAYERS (crossfade) ===== */
    .bg-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      z-index: 0;
      pointer-events: none;
      transition: opacity 1.1s ease;
    }
    .bg-dark {
      background-image: url('assets/background-island-3.jpg');
      opacity: 1;
    }
    .bg-light {
      background-image: url('assets/background-island-3-terang.jpg');
      opacity: 0;
    }
    body.light-active .bg-dark { opacity: 0; }
    body.light-active .bg-light { opacity: 1; }

    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: 0;
      pointer-events: none;
      transition: background 1.1s ease;
    }
    body.light-active .bg-overlay {
      background: rgba(0, 0, 0, 0.32);
    }

    /* ===== MAIN CONTAINER ===== */
    .main-container {
      position: relative;
      z-index: 2;
      max-width: 620px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }

    /* ===== HERO ===== */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin-top: 14vh;
      animation: fadeInDown 1.2s ease;
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .hero.hide {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(2.2rem, 9vw, 3rem);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 22px rgba(201, 168, 107, 0.5);
      line-height: 1.05;
    }
    .hero-subtitle {
      font-size: clamp(0.95rem, 3.6vw, 1.1rem);
      color: var(--abu-terang);
      letter-spacing: 0.4px;
      font-weight: 500;
      font-style: italic;
      max-width: 90%;
    }

    .btn {
      padding: 13px 34px;
      border: 1.5px solid var(--gold);
      border-radius: 50px;
      background: rgba(201, 168, 107, 0.12);
      color: var(--gold-soft);
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn:hover {
      background: rgba(201, 168, 107, 0.22);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(201, 168, 107, 0.25);
    }
    .btn:active { transform: translateY(0); }

    /* ===== STORY SECTIONS ===== */
    .story-section {
      display: none;
      margin-top: 10px;
      text-align: left;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1s ease, transform 1s ease;
    }
    .story-section.visible {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .panel {
      border-radius: 26px;
      padding: 32px 26px;
      position: relative;
      border: 1.5px solid;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .panel-dark {
      background: var(--panel-dark);
      border-color: var(--border-dark);
    }
    .panel-light {
      background: var(--panel-light);
      border-color: var(--border-light);
      color: #2a2018;
    }

    .section-heading {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(1.1rem, 4.2vw, 1.35rem);
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1.35;
      text-align: center;
      margin-bottom: 26px;
      text-transform: none;
    }
    .panel-dark .section-heading {
      color: var(--gold-soft);
    }
    .panel-light .section-heading {
      color: #8a6a3a;
    }

    .typewriter-text {
      font-size: clamp(1rem, 4vw, 1.12rem);
      line-height: 1.85;
      margin-bottom: 16px;
      min-height: 1.85em;
      font-weight: 500;
      word-wrap: break-word;
    }
    .panel-dark .typewriter-text {
      color: #d8d8d8;
      text-shadow: 0 0 4px rgba(0,0,0,0.4);
    }
    .panel-light .typewriter-text {
      color: #3a2e20;
      text-shadow: 0 0 2px rgba(255,255,255,0.5);
    }

    .signature {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      margin-top: 22px;
      text-align: right;
      opacity: 0;
      transition: opacity 1s;
    }
    .panel-light .signature {
      color: #8a6a3a;
    }

    /* ===== SUBTLE SPARKLE (light section) ===== */
    .sparkle {
      position: absolute;
      font-size: 1rem;
      opacity: 0.55;
      pointer-events: none;
      animation: sparkleFloat 3s ease-in-out infinite;
    }
    .sparkle.s1 { top: -10px; left: 18px; }
    .sparkle.s2 { top: 40%; right: -6px; animation-delay: 0.8s; }
    .sparkle.s3 { bottom: -8px; left: 30px; animation-delay: 1.6s; }
    @keyframes sparkleFloat {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
      50% { transform: translateY(-6px) scale(1.1); opacity: 0.85; }
    }

    /* ===== FINISH WRAP ===== */
    .finish-wrap {
      text-align: center;
      margin-top: 24px;
    }
    .btn-finish {
      display: inline-block;
      padding: 13px 34px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #c9a86b, #e6c98a);
      color: #2a2018;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 20px rgba(201, 168, 107, 0.35);
      opacity: 0;
      pointer-events: none;
    }
    .btn-finish.visible {
      opacity: 1;
      pointer-events: auto;
      animation: fadeInUp 0.7s ease forwards;
    }
    .btn-finish:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(201, 168, 107, 0.55);
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== TRANSITION OVERLAY ===== */
    .transition-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s ease;
      padding: 0 24px;
    }
    .transition-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .transition-text {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(1.05rem, 4.5vw, 1.35rem);
      font-weight: 600;
      color: #e6c98a;
      font-style: italic;
      text-align: center;
      letter-spacing: 0.5px;
      line-height: 1.5;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 1s ease, transform 1s ease;
      text-shadow: 0 0 20px rgba(230, 201, 138, 0.4);
    }
    .transition-overlay.text-visible .transition-text {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      body { padding: 55px 14px 80px; }
      .hero { margin-top: 9vh; gap: 14px; }
      .panel { padding: 26px 18px; border-radius: 22px; }
      .section-heading { margin-bottom: 22px; }
      .btn, .btn-finish { padding: 12px 28px; font-size: 0.95rem; }
      .hero-title { letter-spacing: 1.5px; }
    }

    @media (max-width: 360px) {
      .panel { padding: 22px 15px; }
      .typewriter-text { font-size: 0.98rem; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .hero { margin-top: 3vh; }
      body { padding: 40px 16px 60px; }
    }
  </style>
</head>
<body>

  <!-- Background layers -->
  <div class="bg-layer bg-dark"></div>
  <div class="bg-layer bg-light"></div>
  <div class="bg-overlay"></div>

  <div class="main-container">

    <!-- ===== HERO ===== -->
    <section class="hero" id="hero">
      <h1 class="hero-title">Out of Character</h1>
      <p class="hero-subtitle">I guess you made me do something I usually don't.</p>
      <button class="btn" id="btnHero">Keep reading →</button>
    </section>

    <!-- ===== DARK SECTION ===== -->
    <section class="story-section" id="darkSection">
      <div class="panel panel-dark">
        <h2 class="section-heading">The Part I Usually Keep to Myself</h2>

        <p class="typewriter-text" data-text="Aku suka sama kamu. Beneran. Bukan iseng, bukan karena lagi kosong, bukan karena lagi pengen main-main."></p>
        <p class="typewriter-text" data-text="Tapi aku punya kebiasaan lama yang susah banget aku tinggalin: aku nyimpen perasaan ini sendiri. Nggak pernah aku bilang. Nggak pernah aku tunjukin. Cukup aku yang tau."></p>
        <p class="typewriter-text" data-text="Kalau aku suka sama seseorang, hal pertama yang muncul bukan seneng. Tapi rasa nggak pantas. Kayak, 'ngapain juga dia sama aku?'"></p>
        <p class="typewriter-text" data-text="Aku selalu ngerasa ada orang lain yang lebih layak. Lebih baik, lebih keren, lebih bisa bikin dia bahagia. Dan aku? Aku cuma orang yang lewat."></p>
        <p class="typewriter-text" data-text="Aku pernah di posisi itu. Waktu itu aku suka sama seseorang, dan ternyata temen aku juga suka sama orang yang sama. Kamu tau apa yang aku lakuin? Aku malah dukung temen aku. Aku ngerasa dia lebih pantas, dan aku milih minggir."></p>
        <p class="typewriter-text" data-text="Dari situ kayaknya aku makin kebiasaan mundur. Tiap kali suka, otomatis aku mikir 'ah, bukan aku orangnya.' Aku nggak pernah ngasih diri aku sendiri kesempatan."></p>
        <p class="typewriter-text" data-text="Rasa rendah diri ini bukan muncul karena kamu. Ini udah ada dari dulu. Kamu cuma orang berikutnya yang aku suka, dengan pola yang persis sama."></p>

        <div class="finish-wrap">
          <button class="btn" id="btnToLight">Continue →</button>
        </div>
      </div>
    </section>

    <!-- ===== LIGHT SECTION ===== -->
    <section class="story-section" id="lightSection">
      <div class="panel panel-light">
        <span class="sparkle s1">✨</span>
        <span class="sparkle s2">✨</span>
        <span class="sparkle s3">✨</span>

        <h2 class="section-heading">Why This Time Is Different</h2>

        <p class="typewriter-text" data-text="Tapi kali ini ada yang beda. Bukan karena kamu nyembuhin aku. Bukan karena tiba-tiba aku jadi percaya diri."></p>
        <p class="typewriter-text" data-text="Yang beda adalah reaksi aku. Biasanya aku milih diem. Kali ini aku pengen kamu tau."></p>
        <p class="typewriter-text" data-text="Kamu bukan orang yang dari awal aku kira bakal aku suka. Nggak ada tanda-tanda, nggak ada rencana. Tapi pelan-pelan, perasaan itu tumbuh aja. Dan semakin aku kenal kamu, semakin aku sadar kalau ini beneran."></p>
        <p class="typewriter-text" data-text="Aku masih takut. Masih kadang ngerasa nggak cukup. Masih suka mikir 'apa iya?'."></p>
        <p class="typewriter-text" data-text="Tapi kali ini, aku nggak mau rasa itu bikin aku diam lagi. Setidaknya sekali ini, aku pengen jujur."></p>
        <p class="typewriter-text" data-text="Makanya aku bikin ini. Website ini. Yang buat orang lain mungkin biasa aja, tapi buat aku... ini hal yang aku nggak pernah bayangin bakal aku lakuin."></p>
        <p class="typewriter-text" data-text="So yeah, this is me. Doing something out of character."></p>

        <div class="signature" id="signature">— Dimas</div>

        <div class="finish-wrap">
          <button class="btn-finish" id="btnFinish">Continue →</button>
        </div>
      </div>
    </section>

  </div>

  <!-- ===== TRANSITION OVERLAY ===== -->
  <div class="transition-overlay" id="transOverlay">
    <div class="transition-text">But somehow, this time was different.</div>
  </div>

  <script src="state.js"></script>
  <script>
    (function() {
      const hero = document.getElementById('hero');
      const btnHero = document.getElementById('btnHero');
      const darkSection = document.getElementById('darkSection');
      const lightSection = document.getElementById('lightSection');
      const btnToLight = document.getElementById('btnToLight');
      const btnFinish = document.getElementById('btnFinish');
      const signature = document.getElementById('signature');
      const transOverlay = document.getElementById('transOverlay');

      // ===== TYPEWRITER =====
      function runTypewriter(container, onDone) {
        const elements = container.querySelectorAll('.typewriter-text');
        let currentIndex = 0;

        function typeNext() {
          if (currentIndex >= elements.length) {
            if (onDone) onDone();
            return;
          }
          const element = elements[currentIndex];
          const text = element.getAttribute('data-text');
          element.textContent = '';
          let charIndex = 0;

          function typeChar() {
            if (charIndex < text.length) {
              element.textContent += text.charAt(charIndex);
              charIndex++;
              setTimeout(typeChar, 28);
            } else {
              currentIndex++;
              setTimeout(typeNext, 380);
            }
          }
          typeChar();
        }
        typeNext();
      }

      // ===== HERO → DARK =====
      btnHero.addEventListener('click', function() {
        btnHero.disabled = true;
        hero.classList.add('hide');

        setTimeout(() => {
          hero.style.display = 'none';
          darkSection.style.display = 'block';
          void darkSection.offsetWidth;
          darkSection.classList.add('visible');

          // Sembunyikan tombol Continue dulu
          btnToLight.style.display = 'none';

          runTypewriter(darkSection, () => {
            btnToLight.style.display = 'inline-block';
            btnToLight.classList.add('visible');
          });
        }, 700);
      });

      // ===== DARK → LIGHT =====
      let transitioning = false;
      btnToLight.addEventListener('click', function() {
        if (transitioning) return;
        transitioning = true;
        btnToLight.disabled = true;

        // Tampilkan overlay hitam
        transOverlay.classList.add('active');

        // Setelah overlay menutupi, ganti background ke light
        setTimeout(() => {
          document.body.classList.add('light-active');
        }, 350);

        // Munculkan transition text
        setTimeout(() => {
          transOverlay.classList.add('text-visible');
        }, 900);

        // Setelah transition text tampil sebentar, hilangkan
        setTimeout(() => {
          transOverlay.classList.remove('text-visible');
        }, 2600);

        // Fade out overlay & tampilkan light section
        setTimeout(() => {
          transOverlay.classList.remove('active');

          setTimeout(() => {
            darkSection.style.display = 'none';
            lightSection.style.display = 'block';
            void lightSection.offsetWidth;
            lightSection.classList.add('visible');

            runTypewriter(lightSection, () => {
              signature.style.opacity = '1';
              setTimeout(() => {
                btnFinish.classList.add('visible');
              }, 700);
            });
          }, 500);
        }, 3200);
      });

      // ===== FINISH =====
      btnFinish.addEventListener('click', function() {
        btnFinish.disabled = true;
        completeIslandAndReturn('island3');
      });
    })();
  </script>
</body>
</html>
