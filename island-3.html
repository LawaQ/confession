<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulau 3 - Dari Gelap ke Cahaya 🌗</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gelap: #0a0a0a;
      --abu-gelap: #1c1c1c;
      --abu-sedang: #3a3a3a;
      --abu-terang: #8a8a8a;
      --putih: #f0f0f0;
      --emas: #c9a86b;
      --teks-gelap: #d0d0d0;
      --teks-terang: #e6e6e6;
      --bubble-bg: rgba(20, 20, 20, 0.55);
      --bubble-border: rgba(255, 255, 255, 0.15);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-image: url('assets/background-island-3.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #0a0a0a;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      padding: 80px 20px 100px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Rajdhani', sans-serif;
      color: var(--teks-gelap);
      transition: background-image 1s ease;
    }

    body.cerah {
      background-image: url('assets/background-island-3-terang.jpg');
    }

    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 20;
      padding: 10px 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50px;
      background: rgba(0,0,0,0.5);
      color: var(--putih);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(10px);
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .back-btn:hover {
      background: rgba(0,0,0,0.7);
    }

    .main-container {
      position: relative;
      z-index: 2;
      max-width: 650px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }

    /* Bubble chat dasar */
    .bubble-chat {
      border-radius: 30px;
      padding: 35px 30px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      background: var(--bubble-bg);
      border: 1px solid var(--bubble-border);
    }

    .letter-header {
      text-align: center;
      margin-bottom: 35px;
      animation: fadeInDown 1.5s ease;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .letter-tag {
      display: inline-block;
      padding: 6px 20px;
      border: 2px solid var(--abu-sedang);
      border-radius: 50px;
      color: var(--abu-terang);
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-transform: uppercase;
      background: rgba(0,0,0,0.4);
    }
    .letter-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--putih);
    }
    .letter-subtitle {
      color: var(--abu-terang);
      font-size: 1rem;
      margin-top: 10px;
    }

    .accent-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 20px 0 30px;
    }
    .accent-line .line { height: 2px; width: 60px; background: var(--abu-sedang); }
    .accent-line .dot { width: 6px; height: 6px; background: var(--abu-terang); border-radius: 50%; }

    .typewriter-text {
      font-size: 1.2rem;
      line-height: 1.9;
      margin-bottom: 25px;
      min-height: 1.9em;
      font-weight: 500;
      color: var(--teks-gelap);
      text-shadow: 0 0 4px rgba(0,0,0,0.4);
    }

    /* Bagian terang: teks 10% lebih cerah */
    body.cerah .typewriter-text {
      color: var(--teks-terang);
      text-shadow: 0 0 4px rgba(0,0,0,0.25);
    }

    .signature {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--emas);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 40px;
      text-align: right;
      opacity: 0;
      transition: opacity 1.5s;
    }

    .btn-lanjut,
    .btn-finish {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 30px;
      border: none;
      border-radius: 50px;
      background: rgba(0,0,0,0.5);
      color: var(--putih);
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      border: 1px solid var(--abu-sedang);
      opacity: 0;
      pointer-events: none;
    }
    .btn-lanjut.visible,
    .btn-finish.visible {
      opacity: 1;
      pointer-events: auto;
      animation: fadeInUp 1s ease forwards;
    }
    .btn-lanjut:hover,
    .btn-finish:hover {
      background: #3a3a3a;
      transform: translateY(-3px);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Overlay transisi background */
    .bg-transition-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    .bg-transition-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* Emoji dekorasi untuk bagian terang */
    .sparkle-decor {
      position: absolute;
      font-size: 1.8rem;
      opacity: 0.8;
      pointer-events: none;
      animation: sparkleFloat 2s ease-in-out infinite;
    }
    .sparkle-decor:nth-child(1) {
      top: -18px;
      left: 10px;
    }
    .sparkle-decor:nth-child(2) {
      top: 30%;
      right: -15px;
      animation-delay: 0.5s;
    }
    .sparkle-decor:nth-child(3) {
      bottom: -15px;
      left: 20px;
      animation-delay: 1s;
    }
    @keyframes sparkleFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.1); }
    }

    @media (max-width: 600px) {
      .letter-title { font-size: 1.8rem; }
      .typewriter-text { font-size: 1.05rem; }
      .bubble-chat { padding: 20px 15px; }
      .sparkle-decor { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <a href="#" class="back-btn" id="backBtn">⬅️ Kembali</a>

  <!-- Overlay untuk transisi background -->
  <div class="bg-transition-overlay" id="bgTransitionOverlay"></div>

  <div class="main-container">
    <!-- ================= BAGIAN GELAP ================= -->
    <div id="gelapSection">
      <div class="bubble-chat">
        <div class="letter-header">
          <div class="letter-tag">🌑 Sisi Gelap</div>
          <h1 class="letter-title">Surat dari Kegelapan</h1>
          <div class="letter-subtitle">Tentang rasa rendah diri dan keraguan</div>
        </div>

        <div class="accent-line">
          <div class="line"></div>
          <div class="dot"></div>
          <div class="line"></div>
        </div>

        <p class="typewriter-text" data-text="Halo, kamu..."></p>
        <p class="typewriter-text" data-text="Malam ini aku menulis dari tempat yang paling gelap dalam pikiranku. Tempat di mana aku sering bertanya-tanya, apakah aku cukup untukmu? Apakah aku pantas?" data-delay="10"></p>
        <p class="typewriter-text" data-text="Aku tahu kita pernah saling suka. Tapi belakangan, aku merasa makin jauh. Mungkin karena aku sendiri yang tidak yakin pada diriku. Aku merasa bukan orang yang bisa membuatmu bangga." data-delay="10"></p>
        <p class="typewriter-text" data-text="Kadang aku melihatmu dari kejauhan, dan aku merasa kecil. Aku takut kalau ternyata semua ini hanya kebetulan, bukan pilihan." data-delay="10"></p>

        <button class="btn-lanjut" id="btnLanjut">Lanjut ke Cahaya →</button>
      </div>
    </div>

    <!-- ================= BAGIAN TERANG ================= -->
    <div id="terangSection" style="display:none;">
      <div class="bubble-chat">
        <!-- Emoji dekorasi -->
        <span class="sparkle-decor">✨</span>
        <span class="sparkle-decor">✨</span>
        <span class="sparkle-decor">✨</span>

        <div class="letter-header">
          <div class="letter-tag" style="border-color:#c9a86b; color:#c9a86b;">🌤️ Sisi Terang</div>
          <h1 class="letter-title">Sejak Kamu Hadir</h1>
          <div class="letter-subtitle" style="color:#aaa;">Tentang cahaya yang tumbuh perlahan</div>
        </div>

        <div class="accent-line">
          <div class="line" style="background:#c9a86b;"></div>
          <div class="dot" style="background:#c9a86b;"></div>
          <div class="line" style="background:#c9a86b;"></div>
        </div>

        <p class="typewriter-text" data-text="Tapi kemudian aku ingat, sejak kamu hadir, ada cahaya yang mulai menyelinap ke dalam hidupku. Bukan cahaya yang menyilaukan, tapi cukup untuk membuatku melihat jalan." data-delay="15"></p>
        <p class="typewriter-text" data-text="Kamu tidak pernah menyuruhku menjadi sempurna. Kamu hanya hadir, dan itu cukup. Di saat aku merasa tidak berharga, kamu tetap di sana, tanpa banyak tanya." data-delay="15"></p>
        <p class="typewriter-text" data-text="Perlahan aku sadar, mungkin aku tidak seburuk yang kupikir. Mungkin aku hanya terlalu keras pada diriku sendiri. Dan mungkin, untuk mencintai seseorang, aku harus mulai belajar menerima diriku." data-delay="15"></p>
        <p class="typewriter-text" data-text="Jadi di surat ini, aku ingin berterima kasih. Karena kamu, aku mulai berani melawan gelapku sendiri." data-delay="15"></p>

        <div class="signature" id="signature">— Aku yang mulai belajar percaya diri</div>

        <button class="btn-finish" id="btnFinish">Selesaikan Pulau 3 ✓</button>
      </div>
    </div>
  </div>

  <script src="state.js"></script>
  <script>
    (function() {
      const backBtn = document.getElementById('backBtn');
      backBtn.addEventListener('click', function(e) {
        e.preventDefault();
        setDuyungAtIsland('island3');
        navigateTo('map.html');
      });

      const gelapSection = document.getElementById('gelapSection');
      const terangSection = document.getElementById('terangSection');
      const btnLanjut = document.getElementById('btnLanjut');
      const btnFinish = document.getElementById('btnFinish');
      const signature = document.getElementById('signature');
      const bgTransitionOverlay = document.getElementById('bgTransitionOverlay');
      const body = document.body;

      function startTypewriter(container, doneCallback) {
        const elements = container.querySelectorAll('.typewriter-text');
        let currentIndex = 0;

        function typeNext() {
          if (currentIndex >= elements.length) {
            if (doneCallback) doneCallback();
            return;
          }

          const element = elements[currentIndex];
          const text = element.getAttribute('data-text');
          const delay = parseInt(element.getAttribute('data-delay')) || 30;
          element.textContent = '';
          let charIndex = 0;

          function typeChar() {
            if (charIndex < text.length) {
              element.textContent += text.charAt(charIndex);
              charIndex++;
              setTimeout(typeChar, delay);
            } else {
              currentIndex++;
              setTimeout(typeNext, 500);
            }
          }

          typeChar();
        }

        typeNext();
      }

      // Mulai bagian gelap
      startTypewriter(gelapSection, () => {
        btnLanjut.classList.add('visible');
      });

      // Tombol lanjut: transisi background
      btnLanjut.addEventListener('click', function() {
        bgTransitionOverlay.classList.add('show');

        setTimeout(() => {
          body.classList.add('cerah');

          setTimeout(() => {
            bgTransitionOverlay.classList.remove('show');
            gelapSection.style.display = 'none';
            terangSection.style.display = 'block';

            startTypewriter(terangSection, () => {
              signature.style.opacity = '1';
              setTimeout(() => {
                btnFinish.classList.add('visible');
              }, 600);
            });
          }, 600);
        }, 600);
      });

      btnFinish.addEventListener('click', function() {
        completeIslandAndReturn('island3');
      });
    })();
  </script>
</body>
</html>
