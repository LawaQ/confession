<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>This Is Me Trying</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #c9a86b;
      --gold-soft: #e6c98a;
      --putih: #f0f0f0;
      --abu-terang: #a8a8a8;
      --abu-sedang: #5a5a5a;
      --panel-dark: rgba(15, 15, 15, 0.55);
      --panel-light: rgba(255, 250, 240, 0.6);
      --border-dark: rgba(255, 255, 255, 0.12);
      --border-light: rgba(200, 160, 110, 0.35);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      padding: 70px 18px 90px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Rajdhani', sans-serif;
      color: var(--putih);
      background-color: #0a0a0a;
    }

    /* ===== BACKGROUND LAYERS ===== */
    .bg-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      z-index: 0;
      pointer-events: none;
      transition: opacity 1.1s ease;
    }
    .bg-dark {
      background-image: url('assets/background-island-3.jpg');
      opacity: 1;
    }
    .bg-light {
      background-image: url('assets/background-island-3-terang.jpg');
      opacity: 0;
    }
    body.light-active .bg-dark { opacity: 0; }
    body.light-active .bg-light { opacity: 1; }

    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: 0;
      pointer-events: none;
      transition: background 1.1s ease;
    }
    body.light-active .bg-overlay {
      background: rgba(0, 0, 0, 0.32);
    }

    /* ===== MAIN CONTAINER ===== */
    .main-container {
      position: relative;
      z-index: 2;
      max-width: 620px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }

    /* ===== HERO ===== */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin-top: 14vh;
      animation: fadeInDown 1.2s ease;
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .hero.hide {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(1.9rem, 7.5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 22px rgba(201, 168, 107, 0.5);
      line-height: 1.15;
      max-width: 100%;
    }
    .hero-subtitle {
      font-size: clamp(0.95rem, 3.6vw, 1.1rem);
      color: var(--abu-terang);
      letter-spacing: 0.4px;
      font-weight: 500;
      font-style: italic;
      max-width: 90%;
    }

    .btn {
      padding: 13px 34px;
      border: 1.5px solid var(--gold);
      border-radius: 50px;
      background: rgba(201, 168, 107, 0.12);
      color: var(--gold-soft);
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn:hover {
      background: rgba(201, 168, 107, 0.22);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(201, 168, 107, 0.25);
    }
    .btn:active { transform: translateY(0); }

    /* ===== STORY SECTIONS ===== */
    .story-section {
      display: none;
      margin-top: 10px;
      text-align: left;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1s ease, transform 1s ease;
    }
    .story-section.visible {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .panel {
      border-radius: 26px;
      padding: 32px 26px;
      position: relative;
      border: 1.5px solid;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .panel-dark {
      background: var(--panel-dark);
      border-color: var(--border-dark);
    }
    .panel-light {
      background: var(--panel-light);
      border-color: var(--border-light);
      color: #2a2018;
    }

    .section-heading {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(1.1rem, 4.2vw, 1.35rem);
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1.35;
      text-align: center;
      margin-bottom: 26px;
      text-transform: none;
    }
    .panel-dark .section-heading {
      color: var(--gold-soft);
    }
    .panel-light .section-heading {
      color: #8a6a3a;
    }

    .typewriter-text {
      font-size: clamp(1rem, 4vw, 1.12rem);
      line-height: 1.85;
      margin-bottom: 16px;
      min-height: 1.85em;
      font-weight: 500;
      word-wrap: break-word;
    }
    .panel-dark .typewriter-text {
      color: #d8d8d8;
      text-shadow: 0 0 4px rgba(0,0,0,0.4);
    }
    .panel-light .typewriter-text {
      color: #3a2e20;
      text-shadow: 0 0 2px rgba(255,255,255,0.5);
    }

    /* ===== SPARKLE (light section) ===== */
    .sparkle {
      position: absolute;
      font-size: 1rem;
      opacity: 0.55;
      pointer-events: none;
      animation: sparkleFloat 3s ease-in-out infinite;
    }
    .sparkle.s1 { top: -10px; left: 18px; }
    .sparkle.s2 { top: 40%; right: -6px; animation-delay: 0.8s; }
    .sparkle.s3 { bottom: -8px; left: 30px; animation-delay: 1.6s; }
    @keyframes sparkleFloat {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
      50% { transform: translateY(-6px) scale(1.1); opacity: 0.85; }
    }

    /* ===== FINISH WRAP ===== */
    .finish-wrap {
      text-align: center;
      margin-top: 24px;
    }
    .btn-finish {
      display: none;
      padding: 13px 34px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #c9a86b, #e6c98a);
      color: #2a2018;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 20px rgba(201, 168, 107, 0.35);
      opacity: 0;
      pointer-events: none;
    }
    .btn-finish.visible {
      display: inline-block;
      opacity: 1;
      pointer-events: auto;
      animation: fadeInUp 0.7s ease forwards;
    }
    .btn-finish:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(201, 168, 107, 0.55);
    }

    .btn-continue {
      display: none;
      margin-top: 22px;
      padding: 13px 34px;
      border: 1.5px solid var(--gold);
      border-radius: 50px;
      background: rgba(201, 168, 107, 0.12);
      color: var(--gold-soft);
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-continue.visible {
      display: inline-block;
      animation: fadeInUp 0.7s ease forwards;
    }
    .btn-continue:hover {
      background: rgba(201, 168, 107, 0.22);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(201, 168, 107, 0.25);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== TRANSITION OVERLAY ===== */
    .transition-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s ease;
      padding: 0 24px;
    }
    .transition-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .transition-text {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(1.05rem, 4.5vw, 1.35rem);
      font-weight: 600;
      color: #e6c98a;
      font-style: italic;
      text-align: center;
      letter-spacing: 0.5px;
      line-height: 1.5;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 1s ease, transform 1s ease;
      text-shadow: 0 0 20px rgba(230, 201, 138, 0.4);
    }
    .transition-overlay.text-visible .transition-text {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      body { padding: 55px 14px 80px; }
      .hero { margin-top: 9vh; gap: 14px; }
      .panel { padding: 26px 18px; border-radius: 22px; }
      .section-heading { margin-bottom: 22px; }
      .btn, .btn-finish, .btn-continue { padding: 12px 28px; font-size: 0.95rem; }
      .hero-title { letter-spacing: 1.5px; }
    }

    @media (max-width: 360px) {
      .panel { padding: 22px 15px; }
      .typewriter-text { font-size: 0.98rem; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .hero { margin-top: 3vh; }
      body { padding: 40px 16px 60px; }
    }
  </style>
</head>
<body>

  <!-- Background layers -->
  <div class="bg-layer bg-dark"></div>
  <div class="bg-layer bg-light"></div>
  <div class="bg-overlay"></div>

  <div class="main-container">

    <!-- ===== HERO ===== -->
    <section class="hero" id="hero">
      <h1 class="hero-title">This Is Me Trying</h1>
      <p class="hero-subtitle">To say the things I usually can't when you're right in front of me.</p>
      <button class="btn" id="btnHero">Keep reading →</button>
    </section>

    <!-- ===== DARK SECTION ===== -->
    <section class="story-section" id="darkSection">
      <div class="panel panel-dark">
        <h2 class="section-heading">Yang Biasanya Aku Simpan</h2>

        <p class="typewriter-text" data-text="Hallo cicit, ketemu lagi nihh😆"></p>
        <p class="typewriter-text" data-text="Terakhir kamu kan buat aku ga karuan karena gombalan kamu yaa😭 Tapi kamu tau ga? Aku dari dulu pengen banget ngelakuin itu sebelum kamu lakuin. Cuma karena akunya terlalu penakut, jadinya gapernah bisa. Dan setelah kamu ngegombal itu, aku jadi punya alasan buat ikutan gombalin balik😭 Dari situ aku mulai berani buat lakuin itu, walaupun masih jaga-jaga juga, takutnya kamu malah risih."></p>
        <p class="typewriter-text" data-text="Tapi sekarang aku mau cerita sesuatu yang mungkin agak aneh tentang aku."></p>
        <p class="typewriter-text" data-text="Kamu tau ga sih, Cit, kalau aku biasanya kalau udah deket banget sama seseorang malah jadi menjauh?"></p>
        <p class="typewriter-text" data-text="Aku juga gatau kenapa. Semakin deket kita di chat, kadang malah semakin keliatan ada jarak pas ketemu langsung. Rasanya aneh banget. Di satu sisi aku pengen bisa bersikap normal, ngobrol kayak biasanya, bercanda kayak di chat, atau sekadar nyapa tanpa mikir macem-macem."></p>
        <p class="typewriter-text" data-text="Tapi entah kenapa, pas ketemu langsung aku malah jadi kaku sendiri😭"></p>
        <p class="typewriter-text" data-text="Kadang aku bahkan udah kepikiran mau ngomong sesuatu, tapi pas udah ada di depan kamu malah jadi, 'ah udahlah.' Terus akhirnya kita malah lewat-lewatan kayak orang yang ga saling kenal😭"></p>
        <p class="typewriter-text" data-text="Padahal bukan karena aku ga mau deket sama kamu. Justru mungkin karena aku terlalu sadar kalau kita udah sedeket itu, jadi aku malah bingung harus bersikap gimana."></p>
        <p class="typewriter-text" data-text="Aneh ya?"></p>
        <p class="typewriter-text" data-text="Di chat aku bisa jadi orang yang banyak ngomong, bisa bercanda, bisa gombal, bisa ngirim hal random. Tapi pas ketemu langsung, kayak ada versi lain dari aku yang tiba-tiba muncul dan bilang, 'udah, jangan aneh-aneh.'😭"></p>
        <p class="typewriter-text" data-text="Dan mungkin kamu pernah mikir, 'ini orang kenapa sih? Di chat begini, pas ketemu malah beda banget.'"></p>
        <p class="typewriter-text" data-text="Kalau kamu pernah mikir begitu, ya... mungkin sekarang kamu sedikit punya jawabannya."></p>
        <p class="typewriter-text" data-text="Aku bukan sengaja bikin jarak. Aku juga bukan tiba-tiba ga nyaman sama kamu."></p>
        <p class="typewriter-text" data-text="Aku cuma masih belajar gimana caranya tetap jadi diriku sendiri ketika orang yang biasanya cuma ada di balik layar, sekarang ada tepat di depan mata."></p>
        <p class="typewriter-text" data-text="Dan mungkin... ada alasan lain kenapa aku selalu seperti itu."></p>
        <p class="typewriter-text" data-text="Tapi yang itu, nanti dulu."></p>

        <div class="finish-wrap">
          <button class="btn-continue" id="btnToLight">Continue →</button>
        </div>
      </div>
    </section>

    <!-- ===== LIGHT SECTION ===== -->
    <section class="story-section" id="lightSection">
      <div class="panel panel-light">
        <span class="sparkle s1">✨</span>
        <span class="sparkle s2">✨</span>
        <span class="sparkle s3">✨</span>

        <h2 class="section-heading">Kenapa Kali Ini Beda</h2>

        <p class="typewriter-text" data-text="Citt kamu tau ga?"></p>
        <p class="typewriter-text" data-text="Agak dejavu yaa dengernya. Soalnya aku inget ada orang yang sering banget bilang gitu, biasanya dengan niat bikin orang lain emosi. Walaupun namanya beda sihh, kamu pasti tau kok😭"></p>
        <p class="typewriter-text" data-text="Aneh yaa, orang yang niatnya bikin emosi malah seringnya bukan bikin emosi, tapi bikin kepikiran. Ganggu banget lagi. Tapi aku suka😭"></p>
        <p class="typewriter-text" data-text="Ganggunya tuh lucu, kadang bikin kesel, tapi di saat yang sama malah bikin seneng. Kayak ada aja hal kecil dari kamu yang akhirnya kepikiran terus. Dan mungkin itu juga salah satu alasan kenapa aku betah sama obrolan kita yang random-random itu."></p>
        <p class="typewriter-text" data-text="Cuma yaa... kayak yang aku ceritain sebelumnya, semua itu rasanya gampang banget dilakukan selama kita nggak saling tatapan langsung😔"></p>
        <p class="typewriter-text" data-text="Begitu ketemu langsung, entah kenapa aku malah balik jadi aku yang biasanya. Jadi kaku, bingung mau ngomong apa, bahkan kadang rasanya lebih gampang pura-pura nggak kenal daripada harus mulai ngobrol duluan."></p>
        <p class="typewriter-text" data-text="Padahal di chat aku bisa ngomongin banyak hal sama kamu."></p>
        <p class="typewriter-text" data-text="Dan semakin aku sadar soal itu, semakin aku ngerasa kayaknya ada sesuatu yang harus aku ubah dari diri aku sendiri."></p>
        <p class="typewriter-text" data-text="Bukan karena kamu pernah maksa aku buat berubah. Kamu juga nggak pernah nyuruh aku buat jadi lebih berani."></p>
        <p class="typewriter-text" data-text="Tapi entah kenapa, sejak kenal kamu, aku jadi punya keinginan buat mencoba."></p>
        <p class="typewriter-text" data-text="Mungkin itu juga alasan kenapa akhirnya aku bikin semua ini."></p>
        <p class="typewriter-text" data-text="Aku pengen bisa bersikap normal pas kita ketemu langsung. Aku pengen bisa ngomong apa yang selama ini cuma berani aku tulis. Aku pengen bisa cerita banyak hal tanpa harus tiba-tiba mundur lagi karena takut salah bersikap."></p>
        <p class="typewriter-text" data-text="Karena kalau dipikir-pikir, lucu juga yaa..."></p>
        <p class="typewriter-text" data-text="Seseorang yang awalnya nggak pernah aku duga bakal kenal sedekat ini, malah jadi orang yang pelan-pelan ngasih aku keberanian buat melakukan sesuatu yang sebelumnya hampir nggak pernah aku lakukan: jujur sama diri sendiri."></p>

        <div class="finish-wrap">
          <button class="btn-finish" id="btnFinish">Continue →</button>
        </div>
      </div>
    </section>

  </div>

  <!-- ===== TRANSITION OVERLAY ===== -->
  <div class="transition-overlay" id="transOverlay">
    <div class="transition-text">But somehow, this time was different.</div>
  </div>

  <script src="state.js"></script>
  <script>
    (function() {
      const hero = document.getElementById('hero');
      const btnHero = document.getElementById('btnHero');
      const darkSection = document.getElementById('darkSection');
      const lightSection = document.getElementById('lightSection');
      const btnToLight = document.getElementById('btnToLight');
      const btnFinish = document.getElementById('btnFinish');
      const transOverlay = document.getElementById('transOverlay');

      // ===== TYPEWRITER =====
      function runTypewriter(container, onDone) {
        const elements = container.querySelectorAll('.typewriter-text');
        let currentIndex = 0;

        function typeNext() {
          if (currentIndex >= elements.length) {
            if (onDone) onDone();
            return;
          }
          const element = elements[currentIndex];
          const text = element.getAttribute('data-text');
          element.textContent = '';
          let charIndex = 0;

          function typeChar() {
            if (charIndex < text.length) {
              element.textContent += text.charAt(charIndex);
              charIndex++;
              setTimeout(typeChar, 26);
            } else {
              currentIndex++;
              setTimeout(typeNext, 420);
            }
          }
          typeChar();
        }
        typeNext();
      }

      // ===== HERO → DARK =====
      btnHero.addEventListener('click', function() {
        btnHero.disabled = true;
        hero.classList.add('hide');

        setTimeout(() => {
          hero.style.display = 'none';
          darkSection.style.display = 'block';
          void darkSection.offsetWidth;
          darkSection.classList.add('visible');

          runTypewriter(darkSection, () => {
            btnToLight.classList.add('visible');
          });
        }, 700);
      });

      // ===== DARK → LIGHT =====
      let transitioning = false;
      btnToLight.addEventListener('click', function() {
        if (transitioning) return;
        transitioning = true;
        btnToLight.disabled = true;

        transOverlay.classList.add('active');

        setTimeout(() => {
          document.body.classList.add('light-active');
        }, 350);

        setTimeout(() => {
          transOverlay.classList.add('text-visible');
        }, 900);

        setTimeout(() => {
          transOverlay.classList.remove('text-visible');
        }, 2600);

        setTimeout(() => {
          transOverlay.classList.remove('active');

          setTimeout(() => {
            darkSection.style.display = 'none';
            lightSection.style.display = 'block';
            void lightSection.offsetWidth;
            lightSection.classList.add('visible');

            runTypewriter(lightSection, () => {
              btnFinish.classList.add('visible');
            });
          }, 500);
        }, 3200);
      });

      // ===== FINISH =====
      btnFinish.addEventListener('click', function() {
        btnFinish.disabled = true;
        completeIslandAndReturn('island3');
      });
    })();
  </script>
</body>
</html>
