<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulau 1 - Sirkuit Kenangan 🏎️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --merah: #e10600;
      --merah-muda: #ff5f7a;
      --putih: #f5f5f5;
      --abu: #c0c0c0;
      --emas: #ffd700;
      --hitam: #0a0a0a;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-image: url('assets/background-f1.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #1a1a1a;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      padding: 80px 20px 100px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Rajdhani', sans-serif;
      color: var(--putih);
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      z-index: 0;
      pointer-events: none;
    }

    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 20;
      padding: 10px 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50px;
      background: rgba(0,0,0,0.5);
      color: var(--putih);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(10px);
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .back-btn:hover {
      background: rgba(0,0,0,0.7);
      border-color: var(--merah);
    }

    .main-container {
      position: relative;
      z-index: 2;
      max-width: 650px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }

    /* Start engine section */
    .start-engine-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 15vh;
      animation: fadeInDown 1s ease;
    }
    .race-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(225, 6, 0, 0.6);
    }
    .race-subtitle {
      font-size: 1.1rem;
      color: var(--abu);
      letter-spacing: 1px;
      font-weight: 500;
    }
    .start-lights {
      display: flex;
      gap: 15px;
      padding: 20px 30px;
      background: rgba(0,0,0,0.6);
      border-radius: 15px;
      border: 2px solid #444;
      margin: 20px 0;
    }
    .start-light {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: #333;
      transition: all 0.2s;
    }
    .start-light.on {
      background: var(--merah);
      box-shadow: 0 0 20px rgba(225,6,0,0.9);
    }
    .btn-start {
      padding: 15px 40px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, var(--merah), #ff4444);
      color: white;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 20px rgba(225, 6, 0, 0.5);
    }
    .btn-start:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(225, 6, 0, 0.8);
    }
    .go-text {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 4rem;
      font-weight: 700;
      color: var(--emas);
      text-shadow: 0 0 30px rgba(255,215,0,0.8);
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.3s;
    }
    .go-text.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* Letter section */
    .letter-section {
      display: none;
      text-align: left;
      margin-top: 30px;
      opacity: 0;
      transition: opacity 1s ease;
    }
    .letter-section.visible {
      display: block;
      opacity: 1;
    }
    .letter-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .letter-tag {
      display: inline-block;
      padding: 6px 20px;
      border: 2px solid var(--merah);
      border-radius: 50px;
      color: var(--merah);
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-transform: uppercase;
      background: rgba(225, 6, 0, 0.1);
    }
    .letter-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(225, 6, 0, 0.5);
    }
    .accent-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 25px 0;
    }
    .accent-line .line {
      height: 3px;
      width: 60px;
      background: var(--merah);
    }
    .accent-line .dot {
      width: 8px;
      height: 8px;
      background: var(--merah);
      border-radius: 50%;
    }

    .typewriter-text {
      font-size: 1.2rem;
      line-height: 1.8;
      color: #e0e0e0;
      margin-bottom: 20px;
      min-height: 1.8em;
      font-weight: 500;
      text-shadow: 0 0 5px rgba(0,0,0,0.5);
    }
    .signature {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--emas);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 30px;
      text-align: right;
      opacity: 0;
      transition: opacity 1s;
    }

    /* Finish button */
    .btn-finish {
      display: inline-block;
      margin-top: 25px;
      padding: 15px 35px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, var(--merah), #ff4444);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 20px rgba(225, 6, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      animation: fadeInUp 0.8s ease forwards;
    }
    .btn-finish.visible {
      opacity: 1;
      pointer-events: auto;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .race-title { font-size: 2rem; }
      .typewriter-text { font-size: 1.05rem; }
      .letter-title { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <!-- Tombol kembali ke peta tanpa unlock -->
  <a href="#" class="back-btn" id="backBtn">⬅️ Kembali</a>

  <div class="main-container">
    <!-- Start Engine -->
    <div class="start-engine-section" id="startEngineSection">
      <div class="race-title">🏁 Pulau 1: Sirkuit Kenangan</div>
      <div class="race-subtitle">Nyalakan mesin untuk membuka surat</div>
      <div class="start-lights" id="startLights">
        <div class="start-light"></div>
        <div class="start-light"></div>
        <div class="start-light"></div>
        <div class="start-light"></div>
        <div class="start-light"></div>
      </div>
      <button class="btn-start" id="btnStart">Start Engine</button>
      <div class="go-text" id="goText">GO! 🏁</div>
    </div>

    <!-- Surat -->
    <div class="letter-section" id="letterSection">
      <div class="letter-header">
        <div class="letter-tag">🏁 Sirkuit Kenangan</div>
        <h1 class="letter-title">Surat dari Lintasan</h1>
        <div class="letter-subtitle" style="color: var(--abu); font-size:1rem; margin-top:10px;">Dari F1 sampai Ratu Kucing Duyung</div>
      </div>

      <div class="accent-line">
        <div class="line"></div>
        <div class="dot"></div>
        <div class="line"></div>
      </div>

      <!-- Paragraf yang akan diketik -->
      <p class="typewriter-text" data-text="Halo, kamu..."></p>
      <p class="typewriter-text" data-text="Aku menulis ini dari tempat yang mungkin tidak pernah kita kunjungi, tapi selalu kita bicarakan: lintasan balap. Tempat semua cerita dimulai, dari obrolan ringan soal F1 yang tak pernah kuduga akan membawaku sejauh ini."></p>
      <p class="typewriter-text" data-text="Dulu kamu sering bercerita tentang tim favoritmu, pembalap yang kamu kagumi, dan serunya menonton balapan tengah malam. Aku yang awalnya biasa saja, pelan-pelan ikut menantikan balapan berikutnya—bukan karena balapannya, tapi karena ada kamu di seberang sana."></p>
      <p class="typewriter-text" data-text="Dari situlah semuanya bergerak. Obrolan kita melebar ke mana-mana. Dari yang serius sampai yang benar-benar konyol. Dan entah bagaimana, di antara semua itu, terciptalah 'Ratu Kucing Duyung'—nama yang lahir dari kekonyolan kita berdua, nama yang sampai sekarang masih membuatku tersenyum setiap mengingatnya."></p>
      <p class="typewriter-text" data-text="Aku menulis ini bukan untuk mengungkit masa lalu, tapi untuk memberitahumu bahwa aku masih di sini. Masih dengan rasa yang sama. Dan semua kenangan itu—dari F1 sampai Ratu Kucing Duyung—tidak pernah benar-benar pergi."></p>
      <p class="typewriter-text" data-text="Mungkin surat ini sederhana. Tapi jika kamu membacanya sampai selesai, itu berarti kamu masih mau berjalan bersamaku."></p>

      <div class="signature" id="signature">— Seorang Bajak Laut</div>

      <!-- Tombol selesai (muncul setelah surat selesai) -->
      <button class="btn-finish" id="btnFinish">Selesaikan Pulau 1 ✓</button>
    </div>
  </div>

  <script src="state.js"></script>
  <script>
    (function() {
      const backBtn = document.getElementById('backBtn');
      backBtn.addEventListener('click', function(e) {
        e.preventDefault();
        // Hanya simpan posisi, jangan unlock
        setDuyungAtIsland('island1');
        window.location.href = 'map.html';
      });

      const startBtn = document.getElementById('btnStart');
      const startLights = document.querySelectorAll('.start-light');
      const goText = document.getElementById('goText');
      const startEngineSection = document.getElementById('startEngineSection');
      const letterSection = document.getElementById('letterSection');
      const signature = document.getElementById('signature');
      const btnFinish = document.getElementById('btnFinish');
      const typewriterElements = document.querySelectorAll('.typewriter-text');

      let raceStarted = false;

      startBtn.addEventListener('click', function() {
        if (raceStarted) return;
        raceStarted = true;
        startBtn.disabled = true;
        startBtn.style.opacity = '0.5';

        let lightIndex = 0;
        const lightInterval = setInterval(() => {
          if (lightIndex < startLights.length) {
            startLights[lightIndex].classList.add('on');
            lightIndex++;
          } else {
            clearInterval(lightInterval);
            setTimeout(() => {
              startLights.forEach(light => light.classList.remove('on'));
              goText.classList.add('visible');
              setTimeout(() => {
                startEngineSection.style.display = 'none';
                letterSection.classList.add('visible');
                startTypewriter();
              }, 800);
            }, 800);
          }
        }, 800);
      });

      function startTypewriter() {
        let currentIndex = 0;

        function typeNext() {
          if (currentIndex >= typewriterElements.length) {
            signature.style.opacity = '1';
            btnFinish.classList.add('visible');
            return;
          }
          const element = typewriterElements[currentIndex];
          const text = element.getAttribute('data-text');
          element.textContent = '';
          let charIndex = 0;
          function typeChar() {
            if (charIndex < text.length) {
              element.textContent += text.charAt(charIndex);
              charIndex++;
              setTimeout(typeChar, 30);
            } else {
              currentIndex++;
              setTimeout(typeNext, 400);
            }
          }
          typeChar();
        }
        typeNext();
      }

      btnFinish.addEventListener('click', function() {
        completeIslandAndReturn('island1');
      });
    })();
  </script>
</body>
</html>
