<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIRST LAP 🏁</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --merah: #e10600;
      --merah-muda: #ff5f7a;
      --putih: #f5f5f5;
      --abu: #c0c0c0;
      --emas: #ffd700;
      --hitam: #0a0a0a;
      --panel-bg: rgba(10, 10, 10, 0.28);
      --panel-border: rgba(255, 255, 255, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      padding: 70px 18px 90px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Rajdhani', sans-serif;
      color: var(--putih);
      background-color: #0a0a0a;
    }

    /* ===== BACKGROUND AWAL ===== */

    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
      transition: opacity 1.2s ease;
    }

    .bg-image.hidden {
      opacity: 0;
    }

    /* ===== BACKGROUND VIDEO ===== */

    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    .video-background.active {
      opacity: 1;
    }

    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.32);
      z-index: 0;
      pointer-events: none;
    }

    /* ===== MAIN ===== */

    .main-container {
      position: relative;
      z-index: 2;
      max-width: 620px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }

    .glass-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      border: 1px solid var(--panel-border);
      border-radius: 26px;
      padding: 28px 22px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.3);
    }

    /* ===== START ENGINE ===== */

    .start-engine-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 10vh;
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .start-engine-section.hide {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
    }

    .race-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(2rem, 9vw, 3rem);
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 22px rgba(225, 6, 0, 0.7);
      line-height: 1.05;
    }

    .race-subtitle {
      font-size: clamp(0.9rem, 3.5vw, 1.05rem);
      color: var(--abu);
      letter-spacing: 0.5px;
      font-weight: 500;
      font-style: italic;
      margin-bottom: 6px;
    }

    /* ===== START LIGHTS ===== */

    .start-lights {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      background: rgba(0,0,0,0.45);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.15);
      margin: 6px 0;
    }

    .start-light {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #2a2a2a;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }

    .start-light.on {
      background: var(--merah);
      box-shadow:
        0 0 18px rgba(225,6,0,0.95),
        0 0 4px rgba(255,255,255,0.4) inset;
    }

    /* ===== START BUTTON ===== */

    .btn-start {
      padding: 13px 34px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(
        135deg,
        rgba(225,6,0,0.85),
        rgba(255,68,68,0.85)
      );
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 20px rgba(225, 6, 0, 0.35);
    }

    .btn-start:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(225, 6, 0, 0.55);
    }

    .btn-start:active {
      transform: translateY(0);
    }

    /* ===== GO ===== */

    .go-text {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(3rem, 14vw, 4.5rem);
      font-weight: 700;
      color: var(--emas);
      text-shadow: 0 0 30px rgba(255,215,0,0.85);
      opacity: 0;
      transform: scale(0.4);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      margin-top: 4px;
    }

    .go-text.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* ===== STORY ===== */

    .letter-section {
      display: none;
      text-align: left;
      margin-top: 20px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.1s ease, transform 1.1s ease;
    }

    .letter-section.visible {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .letter-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .letter-tag {
      display: inline-block;
      padding: 5px 16px;
      border: 1.5px solid var(--merah);
      border-radius: 50px;
      color: var(--merah);
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(225, 6, 0, 0.12);
    }

    .accent-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 14px 0 22px;
    }

    .accent-line .line {
      height: 2px;
      width: 45px;
      background: var(--merah);
    }

    .accent-line .dot {
      width: 6px;
      height: 6px;
      background: var(--merah);
      border-radius: 50%;
    }

    .typewriter-text {
      font-size: clamp(1rem, 4vw, 1.15rem);
      line-height: 1.85;
      color: #f0f0f0;
      margin-bottom: 16px;
      min-height: 1.85em;
      font-weight: 500;
      text-shadow: 0 0 4px rgba(0,0,0,0.5);
    }

    /* ===== FINISH BUTTON ===== */

    .finish-wrap {
      text-align: center;
      margin-top: 22px;
    }

    .btn-finish {
      display: inline-block;
      padding: 13px 30px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(
        135deg,
        rgba(225,6,0,0.85),
        rgba(255,68,68,0.85)
      );
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 20px rgba(225, 6, 0, 0.35);
      opacity: 0;
      pointer-events: none;
    }

    .btn-finish.visible {
      opacity: 1;
      pointer-events: auto;
      animation: fadeInUp 0.7s ease forwards;
    }

    .btn-finish:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(225, 6, 0, 0.55);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== CHECKERED FLAG ===== */

    .lap-complete {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      font-size: 5rem;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition:
        opacity 0.4s ease,
        transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 0 25px rgba(255,255,255,0.5));
    }

    .lap-complete.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* ===== RESPONSIVE ===== */

    @media (max-width: 480px) {
      body {
        padding: 55px 14px 80px;
      }

      .glass-panel {
        padding: 22px 16px;
        border-radius: 22px;
      }

      .start-engine-section {
        margin-top: 7vh;
      }

      .start-lights {
        padding: 12px 16px;
        gap: 8px;
      }

      .start-light {
        width: 17px;
        height: 17px;
      }

      .btn-start {
        padding: 12px 28px;
        font-size: 1rem;
      }

      .race-title {
        letter-spacing: 3px;
      }
    }

    @media (max-width: 340px) {
      .start-light {
        width: 14px;
        height: 14px;
      }
    }

    /* ===== LANDSCAPE MOBILE ===== */

    @media (max-height: 500px) and (orientation: landscape) {
      .start-engine-section {
        margin-top: 3vh;
      }

      body {
        padding: 40px 16px 60px;
      }
    }
  </style>
</head>

<body>

  <script src="state.js"></script>

  <script>
    (function() {

      const bgImage =
        document.getElementById('bgImage');

      const bgVideo =
        document.getElementById('bgVideo');

      const startBtn =
        document.getElementById('btnStart');

      const startLights =
        document.querySelectorAll('.start-light');

      const goText =
        document.getElementById('goText');

      const startEngineSection =
        document.getElementById('startEngineSection');

      const letterSection =
        document.getElementById('letterSection');

      const btnFinish =
        document.getElementById('btnFinish');

      const lapComplete =
        document.getElementById('lapComplete');

      const typewriterElements =
        document.querySelectorAll('.typewriter-text');

      let raceStarted = false;


      /* ===== START ENGINE ===== */

      startBtn.addEventListener('click', function() {

        if (raceStarted) return;

        raceStarted = true;

        startBtn.disabled = true;
        startBtn.style.opacity = '0.5';

        let lightIndex = 0;

        const lightInterval = setInterval(() => {

          if (lightIndex < startLights.length) {

            startLights[lightIndex]
              .classList.add('on');

            lightIndex++;

          } else {

            clearInterval(lightInterval);

            // Semua lampu nyala
            // → jeda
            // → padam
            // → GO!

            setTimeout(() => {

              startLights.forEach(light => {
                light.classList.remove('on');
              });

              setTimeout(() => {

                goText.classList.add('visible');

                // Setelah GO tampil,
                // mulai transisi ke story

                setTimeout(() => {

                  // Ganti background ke video
                  bgImage.classList.add('hidden');

                  bgVideo.classList.add('active');

                  bgVideo.play().catch(() => {});


                  // Fade out start section
                  startEngineSection
                    .classList.add('hide');


                  // Tampilkan story
                  setTimeout(() => {

                    startEngineSection.style.display =
                      'none';

                    letterSection.style.display =
                      'block';

                    // Trigger reflow
                    void letterSection.offsetWidth;

                    letterSection
                      .classList.add('visible');

                    startTypewriter();

                  }, 700);

                }, 900);

              }, 250);

            }, 700);
          }

        }, 550);

      });


      /* ===== TYPEWRITER ===== */

      function startTypewriter() {

        let currentIndex = 0;

        function typeNext() {

          if (
            currentIndex >=
            typewriterElements.length
          ) {

            btnFinish.classList.add('visible');

            return;
          }

          const element =
            typewriterElements[currentIndex];

          const text =
            element.getAttribute('data-text');

          element.textContent = '';

          let charIndex = 0;

          function typeChar() {

            if (charIndex < text.length) {

              element.textContent +=
                text.charAt(charIndex);

              charIndex++;

              setTimeout(typeChar, 28);

            } else {

              currentIndex++;

              setTimeout(typeNext, 380);

            }
          }

          typeChar();
        }

        typeNext();
      }


      /* ===== FINISH ISLAND 1 ===== */

      btnFinish.addEventListener(
        'click',
        function() {

          btnFinish.disabled = true;

          // Checkered flag muncul sebentar
          lapComplete.classList.add('show');

          setTimeout(() => {

            lapComplete.classList.remove('show');

            // Gunakan sistem state yang sudah ada
            completeIslandAndReturn('island1');

          }, 800);

        }
      );

    })();
  </script>
