<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulau 1 - Sirkuit Kenangan 🏎️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --merah: #e10600;
      --merah-muda: #ff5f7a;
      --putih: #f5f5f5;
      --abu: #c0c0c0;
      --emas: #ffd700;
      --hitam: #0a0a0a;
      --panel-bg: rgba(10, 10, 10, 0.25);
      --panel-border: rgba(255, 255, 255, 0.2);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      padding: 80px 20px 100px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: 'Rajdhani', sans-serif;
      color: var(--putih);
      background-color: #111;
    }

    /* === BACKGROUND AWAL (GAMBAR) === */
    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    .bg-image.hidden {
      opacity: 0;
    }

    /* === BACKGROUND VIDEO (MUNCUL SETELAH START ENGINE) === */
    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
      display: none;
    }
    .video-background.active {
      display: block;
    }

    /* Overlay tipis */
    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: 0;
      pointer-events: none;
    }

    .main-container {
      position: relative;
      z-index: 2;
      max-width: 650px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }

    /* Panel kaca lebih transparan */
    .glass-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      padding: 25px 22px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    .start-engine-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-top: 8vh;
      animation: fadeInDown 1s ease;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .race-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(225, 6, 0, 0.7);
    }
    .race-subtitle {
      font-size: 1.1rem;
      color: var(--abu);
      letter-spacing: 1px;
      font-weight: 500;
    }
    .start-lights {
      display: flex;
      gap: 12px;
      padding: 16px 22px;
      background: rgba(0,0,0,0.4);
      border-radius: 15px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .start-light {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #333;
      transition: all 0.2s;
    }
    .start-light.on {
      background: var(--merah);
      box-shadow: 0 0 20px rgba(225,6,0,0.9);
    }
    .btn-start {
      padding: 14px 35px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, rgba(225,6,0,0.8), rgba(255,68,68,0.8));
      color: white;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 20px rgba(225, 6, 0, 0.3);
    }
    .btn-start:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(225, 6, 0, 0.5);
    }
    .go-text {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 4rem;
      font-weight: 700;
      color: var(--emas);
      text-shadow: 0 0 30px rgba(255,215,0,0.8);
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.3s;
    }
    .go-text.visible {
      opacity: 1;
      transform: scale(1);
    }

    .letter-section {
      display: none;
      text-align: left;
      margin-top: 30px;
      opacity: 0;
      transition: opacity 1s ease;
    }
    .letter-section.visible {
      display: block;
      opacity: 1;
    }
    .letter-header {
      text-align: center;
      margin-bottom: 25px;
    }
    .letter-tag {
      display: inline-block;
      padding: 6px 20px;
      border: 2px solid var(--merah);
      border-radius: 50px;
      color: var(--merah);
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-bottom: 15px;
      text-transform: uppercase;
      background: rgba(225, 6, 0, 0.15);
    }
    .letter-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(225, 6, 0, 0.6);
    }
    .accent-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 15px 0 20px;
    }
    .accent-line .line { height: 3px; width: 60px; background: var(--merah); }
    .accent-line .dot { width: 8px; height: 8px; background: var(--merah); border-radius: 50%; }

    .typewriter-text {
      font-size: 1.2rem;
      line-height: 1.8;
      color: #f0f0f0;
      margin-bottom: 18px;
      min-height: 1.8em;
      font-weight: 500;
      text-shadow: 0 0 4px rgba(0,0,0,0.5);
    }
    .signature {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--emas);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 25px;
      text-align: right;
      opacity: 0;
      transition: opacity 1s;
    }

    .btn-finish {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 30px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, rgba(225,6,0,0.8), rgba(255,68,68,0.8));
      color: white;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 20px rgba(225, 6, 0, 0.3);
      opacity: 0;
      pointer-events: none;
    }
    .btn-finish.visible {
      opacity: 1;
      pointer-events: auto;
      animation: fadeInUp 0.8s ease forwards;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .race-title { font-size: 2rem; }
      .typewriter-text { font-size: 1.05rem; }
      .letter-title { font-size: 1.8rem; }
      .glass-panel { padding: 20px 16px; }
    }
  </style>
</head>
<body>

  <!-- BACKGROUND AWAL: GAMBAR -->
  <img src="assets/background-f1.jpg" alt="F1" class="bg-image" id="bgImage">

  <!-- BACKGROUND VIDEO (MUNCUL SETELAH START ENGINE) -->
  <video class="video-background" id="bgVideo" muted loop playsinline preload="auto">
    <source src="assets/background-island1.mp4" type="video/mp4">
  </video>

  <!-- OVERLAY TIPIS -->
  <div class="video-overlay"></div>

  <div class="main-container">
    <!-- START ENGINE -->
    <div class="start-engine-section glass-panel" id="startEngineSection">
      <div class="race-title">🏁 Pulau 1: Sirkuit Kenangan</div>
      <div class="race-subtitle">Nyalakan mesin untuk membuka surat</div>
      <div class="start-lights" id="startLights">
        <div class="start-light"></div>
        <div class="start-light"></div>
        <div class="start-light"></div>
        <div class="start-light"></div>
        <div class="start-light"></div>
      </div>
      <button class="btn-start" id="btnStart">Start Engine</button>
      <div class="go-text" id="goText">GO! 🏁</div>
    </div>

    <!-- SURAT -->
    <div class="letter-section" id="letterSection">
      <div class="glass-panel">
        <div class="letter-header">
          <div class="letter-tag">🏁 Sirkuit Kenangan</div>
          <h1 class="letter-title">Surat dari Lintasan</h1>
          <div class="letter-subtitle" style="color: var(--abu); font-size:1rem; margin-top:10px;">Dari F1 sampai Ratu Kucing Duyung</div>
        </div>

        <div class="accent-line">
          <div class="line"></div>
          <div class="dot"></div>
          <div class="line"></div>
        </div>

        <p class="typewriter-text" data-text="Halo, kamu..."></p>
        <p class="typewriter-text" data-text="Aku menulis ini dari tempat yang mungkin tidak pernah kita kunjungi, tapi selalu kita bicarakan: lintasan balap. Tempat semua cerita dimulai, dari obrolan ringan soal F1 yang tak pernah kuduga akan membawaku sejauh ini."></p>
        <p class="typewriter-text" data-text="Dulu kamu sering bercerita tentang tim favoritmu, pembalap yang kamu kagumi, dan serunya menonton balapan tengah malam. Aku yang awalnya biasa saja, pelan-pelan ikut menantikan balapan berikutnya—bukan karena balapannya, tapi karena ada kamu di seberang sana."></p>
        <p class="typewriter-text" data-text="Dari situlah semuanya bergerak. Obrolan kita melebar ke mana-mana. Dari yang serius sampai yang benar-benar konyol. Dan entah bagaimana, di antara semua itu, terciptalah 'Ratu Kucing Duyung'—nama yang lahir dari kekonyolan kita berdua, nama yang sampai sekarang masih membuatku tersenyum setiap mengingatnya."></p>
        <p class="typewriter-text" data-text="Aku menulis ini bukan untuk mengungkit masa lalu, tapi untuk memberitahumu bahwa aku masih di sini. Masih dengan rasa yang sama. Dan semua kenangan itu—dari F1 sampai Ratu Kucing Duyung—tidak pernah benar-benar pergi."></p>
        <p class="typewriter-text" data-text="Mungkin surat ini sederhana. Tapi jika kamu membacanya sampai selesai, itu berarti kamu masih mau berjalan bersamaku."></p>

        <div class="signature" id="signature">— Seorang Bajak Laut</div>

        <button class="btn-finish" id="btnFinish">Selesaikan Pulau 1 ✓</button>
      </div>
    </div>
  </div>

  <script src="state.js"></script>
  <script>
    (function() {
      const bgImage = document.getElementById('bgImage');
      const bgVideo = document.getElementById('bgVideo');
      const startBtn = document.getElementById('btnStart');
      const startLights = document.querySelectorAll('.start-light');
      const goText = document.getElementById('goText');
      const startEngineSection = document.getElementById('startEngineSection');
      const letterSection = document.getElementById('letterSection');
      const signature = document.getElementById('signature');
      const btnFinish = document.getElementById('btnFinish');
      const typewriterElements = document.querySelectorAll('.typewriter-text');

      let raceStarted = false;

      startBtn.addEventListener('click', function() {
        if (raceStarted) return;
        raceStarted = true;
        startBtn.disabled = true;
        startBtn.style.opacity = '0.5';

        let lightIndex = 0;
        const lightInterval = setInterval(() => {
          if (lightIndex < startLights.length) {
            startLights[lightIndex].classList.add('on');
            lightIndex++;
          } else {
            clearInterval(lightInterval);
            setTimeout(() => {
              startLights.forEach(light => light.classList.remove('on'));
              goText.classList.add('visible');

              // Ganti background ke video setelah lampu selesai
              bgImage.classList.add('hidden');
              bgVideo.classList.add('active');
              bgVideo.play().catch(() => {});

              setTimeout(() => {
                startEngineSection.style.display = 'none';
                letterSection.classList.add('visible');
                startTypewriter();
              }, 900);
            }, 800);
          }
        }, 800);
      });

      function startTypewriter() {
        let currentIndex = 0;
        function typeNext() {
          if (currentIndex >= typewriterElements.length) {
            signature.style.opacity = '1';
            btnFinish.classList.add('visible');
            return;
          }
          const element = typewriterElements[currentIndex];
          const text = element.getAttribute('data-text');
          element.textContent = '';
          let charIndex = 0;
          function typeChar() {
            if (charIndex < text.length) {
              element.textContent += text.charAt(charIndex);
              charIndex++;
              setTimeout(typeChar, 30);
            } else {
              currentIndex++;
              setTimeout(typeNext, 400);
            }
          }
          typeChar();
        }
        typeNext();
      }

      btnFinish.addEventListener('click', function() {
        completeIslandAndReturn('island1');
      });
    })();
  </script>
</body>
</html>
