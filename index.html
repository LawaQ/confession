<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerbang Ratu Kucing Duyung 🐱🧜‍♀️</title>
  <style>
    :root {
      --accent-pink: #ff8fab;
      --accent-gold: #ffd700;
      --gold-light: #FFE44D;
      --text-light: #ffffff;
      --glass-bg: rgba(10, 25, 40, 0.35);
      --glass-border: rgba(255, 255, 255, 0.2);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Segoe UI', sans-serif; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      background-color: #0a1c2e;
    }

    /* === VIDEO BACKGROUND === */
    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }

    /* Overlay lebih tipis supaya video tetap jelas */
    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 10, 20, 0.3);
      z-index: 0;
      pointer-events: none;
    }

    /* Dekorasi sangat halus */
    .floating-icons {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
      font-size: 1.5rem;
      user-select: none;
    }
    .float-icon {
      position: absolute;
      animation: floatAround 12s ease-in-out infinite;
      opacity: 0.25;
      filter: drop-shadow(0 0 4px rgba(255,255,255,0.15));
    }
    @keyframes floatAround {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-18px) rotate(6deg); }
    }

    /* Card kaca lebih transparan */
    .card {
      position: relative;
      z-index: 2;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 35px 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      animation: fadeInUp 1s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Makhluk hybrid */
    .hybrid-container {
      width: 170px;
      height: 170px;
      margin: 0 auto 15px;
      position: relative;
      animation: floatHybrid 4s ease-in-out infinite;
    }
    @keyframes floatHybrid {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .hybrid-container span { position: absolute; display: block; user-select: none; line-height: 1; }
    .hybrid-mermaid { bottom: 0; left: 50%; transform: translateX(-50%); font-size: 110px; z-index: 1; }
    .hybrid-cat { bottom: 68px; left: 50%; transform: translateX(-50%); font-size: 55px; z-index: 2; }
    .hybrid-crown {
      bottom: 130px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 34px;
      z-index: 3;
      filter: drop-shadow(0 0 10px rgba(255,215,0,0.8));
      animation: crownGlow 3s ease-in-out infinite;
    }
    @keyframes crownGlow {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(255,215,0,0.5)); }
      50% { filter: drop-shadow(0 0 18px rgba(255,215,0,1)); }
    }

    h1 {
      font-size: 1.8rem;
      color: var(--text-light);
      margin-bottom: 8px;
      font-weight: 700;
      text-shadow: 0 0 15px rgba(255,255,255,0.4);
    }
    p.subtitle {
      color: rgba(255,255,255,0.8);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .input-group { display: flex; flex-direction: column; gap: 12px; }
    input[type="text"] {
      padding: 14px 18px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50px;
      font-size: 1rem;
      outline: none;
      text-align: center;
      background: rgba(255,255,255,0.1);
      color: white;
      transition: border-color 0.3s, background 0.3s;
      letter-spacing: 0.5px;
    }
    input[type="text"]::placeholder { color: rgba(255,255,255,0.6); font-size: 0.85rem; }
    input[type="text"]:focus {
      border-color: var(--accent-pink);
      background: rgba(255,255,255,0.15);
      box-shadow: 0 0 15px rgba(255,143,171,0.3);
    }

    button {
      padding: 14px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, rgba(255,143,171,0.8), rgba(255,107,157,0.8));
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 20px rgba(255,107,157,0.3);
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(255,107,157,0.5); }
    button:active { transform: translateY(0); }

    .message { margin-top: 15px; min-height: 24px; font-weight: 600; color: #ffb3c1; font-size: 0.9rem; }
    .message.success { color: #7ff0a1; }
    .hint { margin-top: 8px; font-size: 0.75rem; color: rgba(255,255,255,0.5); }

    .key-reward {
      position: relative;
      z-index: 5;
      margin-top: 15px;
      display: none;
      animation: keyAppear 1s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .key-reward.visible { display: block; }
    @keyframes keyAppear {
      0% { opacity: 0; transform: translateY(-40px) scale(0.3); }
      60% { opacity: 1; transform: translateY(8px) scale(1.1); }
      80% { transform: translateY(-4px) scale(0.95); }
      100% { transform: translateY(0) scale(1); }
    }
    .key-emoji { font-size: 3.5rem; display: block; filter: drop-shadow(0 0 15px rgba(255,215,0,0.8)); animation: keyFloat 3s ease-in-out infinite; }
    @keyframes keyFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .key-text { color: var(--gold-light); font-weight: 600; margin-top: 6px; letter-spacing: 1px; }

    .btn-sail {
      position: relative;
      z-index: 5;
      margin-top: 15px;
      display: none;
      padding: 13px 30px;
      border: none;
      border-radius: 50px;
      background: rgba(45,139,168,0.8);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 20px rgba(26,107,138,0.4);
    }
    .btn-sail.visible { display: inline-block; }
    .btn-sail:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(26,107,138,0.6); }

    .wave-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
      display: none;
    }
    .wave-overlay.show { display: block; }
    .wave {
      position: absolute;
      bottom: -120%;
      left: -10%;
      width: 120%;
      height: 130%;
      background: linear-gradient(180deg, rgba(11,59,79,0.9), rgba(29,111,138,0.9));
      border-radius: 45% 45% 0 0;
      animation: waveSweep 2.5s cubic-bezier(0.7, 0, 0.3, 1) forwards;
      opacity: 0.9;
    }
    .wave:nth-child(2) { animation-delay: 0.3s; background: linear-gradient(180deg, rgba(29,111,138,0.9), rgba(58,167,196,0.9)); }
    .wave:nth-child(3) { animation-delay: 0.6s; background: linear-gradient(180deg, rgba(58,167,196,0.9), rgba(127,216,230,0.9)); opacity: 0.8; }
    @keyframes waveSweep { 0% { bottom: -120%; } 100% { bottom: 0; } }

    @media (max-width: 480px) {
      .card { padding: 25px 18px; border-radius: 24px; }
      h1 { font-size: 1.5rem; }
      .hybrid-container { width: 140px; height: 140px; }
      .hybrid-mermaid { font-size: 90px; }
      .hybrid-cat { bottom: 56px; font-size: 45px; }
      .hybrid-crown { bottom: 106px; font-size: 28px; }
    }
  </style>
</head>
<body>

  <!-- VIDEO BACKGROUND -->
  <video class="video-background" autoplay muted loop playsinline preload="auto">
    <source src="assets/background-index.mp4" type="video/mp4">
  </video>

  <!-- OVERLAY TIPIS -->
  <div class="video-overlay"></div>

  <!-- Dekorasi halus -->
  <div class="floating-icons">
    <span class="float-icon" style="top:10%; left:8%;">🐠</span>
    <span class="float-icon" style="top:30%; right:12%; animation-delay:2s;">🪼</span>
    <span class="float-icon" style="top:60%; left:15%; animation-delay:4s;">🐡</span>
    <span class="float-icon" style="top:80%; right:20%; animation-delay:1s;">🦑</span>
    <span class="float-icon" style="top:20%; right:60%; animation-delay:3s;">🐳</span>
  </div>

  <div class="card">
    <div class="hybrid-container">
      <span class="hybrid-mermaid">🧜‍♀️</span>
      <span class="hybrid-cat">🐱</span>
      <span class="hybrid-crown">👑</span>
    </div>

    <h1>Gerbang Rahasia</h1>
    <p class="subtitle">
      Ada sesuatu yang ingin aku sampaikan.<br>
      Tapi sebelumnya, buktikan dulu kalau kamu benar-benar dia.
    </p>

    <div class="input-group">
      <input type="text" id="passwordInput" placeholder="Sebutkan nama rahasia kita..." autocomplete="off">
      <button id="submitBtn">Buka Gerbangnya ✨</button>
    </div>

    <div id="message" class="message"></div>
    <div class="hint">Petunjuk: gabungan kucing, duyung, dan seorang ratu 😉</div>

    <div class="key-reward" id="keyReward">
      <span class="key-emoji">🗝️</span>
      <div class="key-text">KUNCI DITEMUKAN! 🎉</div>
    </div>

    <button class="btn-sail" id="btnSail">Lanjut Berlayar ⛵</button>
  </div>

  <!-- Overlay ombak -->
  <div class="wave-overlay" id="waveOverlay">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
  </div>

  <script src="state.js"></script>
  <script>
    (function() {
      getUnlockedIslands();

      const correctAnswer = "Ratu Kucing Duyung";
      const input = document.getElementById('passwordInput');
      const button = document.getElementById('submitBtn');
      const message = document.getElementById('message');
      const keyReward = document.getElementById('keyReward');
      const btnSail = document.getElementById('btnSail');
      const waveOverlay = document.getElementById('waveOverlay');
      let answerCorrect = false;

      function cleanText(text) {
        return text.trim().toLowerCase().replace(/\s+/g, ' ');
      }

      function checkAnswer() {
        const userAnswer = cleanText(input.value);
        if (userAnswer === "") {
          message.textContent = "Ketik dulu jawabannya ya 😊";
          message.className = "message";
          return;
        }
        if (userAnswer === cleanText(correctAnswer)) {
          message.textContent = "Berhasil! Kamu masih ingat... 🥹";
          message.className = "message success";
          answerCorrect = true;
          input.style.display = 'none';
          button.style.display = 'none';
          document.querySelector('.hint').style.display = 'none';
          setTimeout(() => { keyReward.classList.add('visible'); }, 500);
          setTimeout(() => { btnSail.classList.add('visible'); }, 1500);
        } else {
          message.textContent = "Salah 😌 Coba ingat lagi...";
          message.className = "message";
          input.value = "";
          input.focus();
        }
      }

      button.addEventListener('click', checkAnswer);
      input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') checkAnswer();
      });

      btnSail.addEventListener('click', function() {
        if (!answerCorrect) return;
        waveOverlay.classList.add('show');
        setTimeout(() => {
          navigateTo('map.html');
        }, 2800);
      });

      input.focus();
    })();
  </script>
</body>
</html>
