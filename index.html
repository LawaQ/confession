<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerbang Ratu Kucing Duyung 🐱🧜‍♀️</title>
  <style>
    /* ===== WARNA DASAR LAUT ===== */
    :root {
      --deep-sea-1: #0a1c2e;
      --deep-sea-2: #0d2b45;
      --deep-sea-3: #0f3b5c;
      --accent-pink: #ff8fab;
      --accent-gold: #ffd700;
      --gold-light: #FFE44D;
      --card-bg: rgba(10, 25, 40, 0.75);
      --card-border: rgba(255, 255, 255, 0.15);
      --text-light: #e0f0ff;
      --glow: 0 0 30px rgba(255, 143, 171, 0.7);
      --glow-gold: 0 0 25px rgba(255, 215, 0, 0.7);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(180deg, var(--deep-sea-1) 0%, var(--deep-sea-2) 40%, var(--deep-sea-3) 100%);
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    /* ===== GELEMBUNG ===== */
    .bubbles {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bubble {
      position: absolute;
      bottom: -80px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      animation: rise linear infinite;
    }
    @keyframes rise {
      0% { transform: translateY(0) scale(1); opacity: 0.6; }
      100% { transform: translateY(-110vh) scale(1.4); opacity: 0; }
    }

    /* ===== DEKORASI IKON LAUT MENGAPUNG ===== */
    .floating-icons {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
      font-size: 2.2rem;
      user-select: none;
    }
    .float-icon {
      position: absolute;
      animation: floatAround 10s ease-in-out infinite;
      opacity: 0.5;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.2));
    }
    @keyframes floatAround {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-25px) rotate(8deg); }
    }

    /* ===== DASAR LAUT ===== */
    .sea-floor {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 180px;
      pointer-events: none;
      z-index: 0;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      font-size: 3rem;
      opacity: 0.7;
      padding-bottom: 10px;
      user-select: none;
    }
    .sea-floor span {
      display: inline-block;
      animation: sway 4s ease-in-out infinite;
      transform-origin: bottom center;
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(6deg); }
    }

    /* ===== CARD UTAMA ===== */
    .card {
      position: relative;
      z-index: 2;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      padding: 40px 30px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 30px rgba(255,255,255,0.03);
      animation: fadeInUp 1.5s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== MAKHLUK HYBRID: RATU KUCING DUYUNG ===== */
    .hybrid-container {
      width: 200px;
      height: 200px;
      margin: 0 auto 20px;
      position: relative;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
      animation: floatHybrid 4s ease-in-out infinite;
    }
    @keyframes floatHybrid {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .hybrid-container span {
      position: absolute;
      display: block;
      user-select: none;
      line-height: 1;
    }
    .hybrid-mermaid {
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      font-size: 130px;
      z-index: 1;
      opacity: 0.95;
    }
    .hybrid-cat {
      bottom: 82px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 65px;
      z-index: 2;
    }
    .hybrid-crown {
      bottom: 155px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 40px;
      z-index: 3;
      filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.8));
      animation: crownGlow 3s ease-in-out infinite;
    }
    @keyframes crownGlow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(255,215,0,0.6)); }
      50% { filter: drop-shadow(0 0 20px rgba(255,215,0,1)); }
    }

    h1 {
      font-size: 2rem;
      color: var(--text-light);
      margin-bottom: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 0 20px rgba(255,255,255,0.3);
    }

    p.subtitle {
      color: #c2d8e8;
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    input[type="text"] {
      padding: 15px 20px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      font-size: 1rem;
      outline: none;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      transition: border-color 0.3s, background 0.3s;
      letter-spacing: 0.5px;
    }
    input[type="text"]::placeholder {
      color: rgba(255,255,255,0.5);
      font-size: 0.85rem;
    }
    input[type="text"]:focus {
      border-color: var(--accent-pink);
      background: rgba(255,255,255,0.12);
      box-shadow: 0 0 20px rgba(255,143,171,0.3);
    }

    button {
      padding: 15px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, var(--accent-pink), #ff6b9d);
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 20px rgba(255, 107, 157, 0.4);
    }
    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(255, 107, 157, 0.6);
    }
    button:active {
      transform: translateY(0);
    }

    .message {
      margin-top: 20px;
      min-height: 28px;
      font-weight: 600;
      color: #ff6b6b;
      font-size: 0.95rem;
    }
    .message.success {
      color: #51cf66;
    }

    .hint {
      margin-top: 10px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.45);
    }

    /* ===== KUNCI YANG MUNCUL SETELAH JAWABAN BENAR ===== */
    .key-reward {
      position: relative;
      z-index: 5;
      margin-top: 20px;
      display: none;
      animation: keyAppear 1s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .key-reward.visible {
      display: block;
    }

    @keyframes keyAppear {
      0% { opacity: 0; transform: translateY(-60px) scale(0.3); }
      60% { opacity: 1; transform: translateY(10px) scale(1.1); }
      80% { transform: translateY(-5px) scale(0.95); }
      100% { transform: translateY(0) scale(1); }
    }

    .key-emoji {
      font-size: 4rem;
      display: block;
      filter: drop-shadow(var(--glow-gold));
      animation: keyFloat 3s ease-in-out infinite;
    }
    @keyframes keyFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .key-text {
      color: var(--gold-light);
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 8px;
      letter-spacing: 1px;
    }

    /* ===== TOMBOL BERLAYAR ===== */
    .btn-sail {
      position: relative;
      z-index: 5;
      margin-top: 15px;
      display: none;
      padding: 15px 35px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #2d8ba8, #1a6b8a);
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 20px rgba(26, 107, 138, 0.5);
      animation: fadeInUp 0.8s ease 0.5s both;
    }
    .btn-sail.visible {
      display: inline-block;
    }
    .btn-sail:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 25px rgba(26, 107, 138, 0.7);
    }

    /* ===== OVERLAY OMBAK ===== */
    .wave-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
      display: none;
    }
    .wave-overlay.show {
      display: block;
    }
    .wave {
      position: absolute;
      bottom: -120%;
      left: -10%;
      width: 120%;
      height: 130%;
      background: linear-gradient(180deg, #0b3b4f, #1d6f8a);
      border-radius: 45% 45% 0 0;
      animation: waveSweep 2.5s cubic-bezier(0.7, 0, 0.3, 1) forwards;
      opacity: 0.9;
    }
    .wave:nth-child(2) {
      animation-delay: 0.3s;
      background: linear-gradient(180deg, #1d6f8a, #3aa7c4);
    }
    .wave:nth-child(3) {
      animation-delay: 0.6s;
      background: linear-gradient(180deg, #3aa7c4, #7fd8e6);
      opacity: 0.8;
    }
    @keyframes waveSweep {
      0% { bottom: -120%; }
      100% { bottom: 0; }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
        border-radius: 24px;
      }
      h1 { font-size: 1.5rem; }
      .hybrid-container {
        width: 160px;
        height: 160px;
        margin-bottom: 15px;
      }
      .hybrid-mermaid { font-size: 100px; }
      .hybrid-cat { bottom: 60px; font-size: 50px; }
      .hybrid-crown { bottom: 115px; font-size: 30px; }
      .sea-floor { height: 120px; font-size: 2.2rem; }
      .key-emoji { font-size: 3rem; }
    }
  </style>
</head>
<body>

  <!-- GELEMBUNG BACKGROUND -->
  <div class="bubbles" id="bubbles"></div>

  <!-- IKON LAUT MENGAPUNG -->
  <div class="floating-icons">
    <span class="float-icon" style="top:8%; left:7%;">🐠</span>
    <span class="float-icon" style="top:25%; right:10%; animation-delay:2s;">🪼</span>
    <span class="float-icon" style="top:55%; left:12%; animation-delay:4s;">🐡</span>
    <span class="float-icon" style="top:70%; right:15%; animation-delay:1s;">🦑</span>
    <span class="float-icon" style="top:15%; left:60%; animation-delay:3s;">🐳</span>
    <span class="float-icon" style="top:40%; right:25%; animation-delay:5s;">🐬</span>
    <span class="float-icon" style="top:80%; left:30%; animation-delay:2.5s;">🦀</span>
    <span class="float-icon" style="top:65%; left:45%; animation-delay:3.5s;">🐚</span>
    <span class="float-icon" style="top:30%; left:20%; animation-delay:1.5s;">⭐</span>
    <span class="float-icon" style="top:50%; right:5%; animation-delay:4.5s;">💎</span>
    <span class="float-icon" style="bottom:25%; left:5%; animation-delay:0.8s;">🪸</span>
  </div>

  <!-- DASAR LAUT -->
  <div class="sea-floor">
    <span style="font-size:3.5rem;">🌿</span>
    <span style="font-size:2.8rem;">🪸</span>
    <span style="font-size:3.2rem;">🌿</span>
    <span style="font-size:2.5rem;">🐚</span>
    <span style="font-size:3rem;">🪸</span>
    <span style="font-size:3.5rem;">🌿</span>
    <span style="font-size:2.2rem;">⭐</span>
  </div>

  <!-- CARD UTAMA -->
  <div class="card">

    <!-- MAKHLUK HYBRID -->
    <div class="hybrid-container">
      <span class="hybrid-mermaid">🧜‍♀️</span>
      <span class="hybrid-cat">🐱</span>
      <span class="hybrid-crown">👑</span>
    </div>

    <h1>Gerbang Rahasia</h1>
    <p class="subtitle">
      Ada sesuatu yang ingin aku sampaikan.<br>
      Tapi sebelumnya, buktikan dulu kalau kamu benar-benar dia.
    </p>

    <div class="input-group">
      <input type="text" id="passwordInput" placeholder="Sebutkan nama rahasia kita..." autocomplete="off">
      <button id="submitBtn">Buka Gerbangnya ✨</button>
    </div>

    <div id="message" class="message"></div>
    <div class="hint">Petunjuk: gabungan kucing, duyung, dan seorang ratu 😉</div>

    <!-- KUNCI REWARD -->
    <div class="key-reward" id="keyReward">
      <span class="key-emoji">🗝️</span>
      <div class="key-text">KUNCI DITEMUKAN! 🎉</div>
    </div>

    <!-- TOMBOL BERLAYAR -->
    <button class="btn-sail" id="btnSail">Lanjut Berlayar ⛵</button>

  </div>

  <!-- OVERLAY OMBAK -->
  <div class="wave-overlay" id="waveOverlay">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
  </div>

  <script>
    // ===== SET JAWABAN BENAR =====
    const correctAnswer = "Ratu Kucing Duyung";

    // ===== MEMBUAT GELEMBUNG OTOMATIS =====
    const bubblesContainer = document.getElementById('bubbles');
    const bubbleCount = 30;
    for (let i = 0; i < bubbleCount; i++) {
      const bubble = document.createElement('div');
      bubble.classList.add('bubble');
      const size = Math.random() * 50 + 20;
      bubble.style.width = size + 'px';
      bubble.style.height = size + 'px';
      bubble.style.left = Math.random() * 100 + '%';
      bubble.style.animationDuration = Math.random() * 8 + 6 + 's';
      bubble.style.animationDelay = Math.random() * 5 + 's';
      bubblesContainer.appendChild(bubble);
    }

    // ===== ELEMEN =====
    const input = document.getElementById('passwordInput');
    const button = document.getElementById('submitBtn');
    const message = document.getElementById('message');
    const keyReward = document.getElementById('keyReward');
    const btnSail = document.getElementById('btnSail');
    const waveOverlay = document.getElementById('waveOverlay');
    let answerCorrect = false;

    function cleanText(text) {
      return text.trim().toLowerCase().replace(/\s+/g, ' ');
    }

    // ===== CEK JAWABAN =====
    function checkAnswer() {
      const userAnswer = cleanText(input.value);
      const correct = cleanText(correctAnswer);

      if (userAnswer === "") {
        message.textContent = "Ketik dulu jawabannya ya 😊";
        message.className = "message";
        return;
      }

      if (userAnswer === correct) {
        message.textContent = "Berhasil! Kamu masih ingat... 🥹";
        message.className = "message success";
        answerCorrect = true;

        // Sembunyikan input dan tombol submit
        input.style.display = 'none';
        button.style.display = 'none';
        document.querySelector('.hint').style.display = 'none';

        // Tampilkan kunci reward
        setTimeout(() => {
          keyReward.classList.add('visible');
        }, 500);

        // Tampilkan tombol berlayar
        setTimeout(() => {
          btnSail.classList.add('visible');
        }, 1500);

      } else {
        message.textContent = "Salah 😌 Coba ingat lagi, yang ini sih harusnya nggak lupa...";
        message.className = "message";
        input.value = "";
        input.focus();
      }
    }

    button.addEventListener('click', checkAnswer);
    input.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        checkAnswer();
      }
    });

    // ===== TOMBOL BERLAYAR =====
    btnSail.addEventListener('click', function() {
      if (!answerCorrect) return;

      // Tampilkan overlay ombak
      waveOverlay.classList.add('show');

      // Redirect ke peta setelah ombak selesai (±2.5 detik)
      setTimeout(() => {
        window.location.href = "map.html";
      }, 2800);
    });

    input.focus();
  </script>
</body>
</html>
