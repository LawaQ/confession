<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Only For You</title>
  <style>
    :root {
      --accent-pink: #ff8fab;
      --accent-pink-soft: #ffb6d5;
      --accent-blue: #2d8ba8;
      --accent-blue-dark: #1a6b8a;
      --accent-gold: #ffd700;
      --text-light: #ffffff;
      --text-soft: rgba(255, 255, 255, 0.85);
      --text-muted: rgba(255, 255, 255, 0.55);
      --glass-bg: rgba(15, 25, 40, 0.32);
      --glass-border: rgba(255, 255, 255, 0.22);
      --glass-glow: rgba(255, 143, 171, 0.18);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      background-color: #0a1c2e;
    }

    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }

    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 40%, rgba(20, 40, 60, 0.2) 0%, rgba(5, 15, 25, 0.65) 100%);
      z-index: 0;
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 2;
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 38px 26px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow:
        0 20px 45px rgba(0, 0, 0, 0.45),
        0 0 60px var(--glass-glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      animation: fadeInUp 1.1s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .kicker {
      font-size: 0.72rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
      font-weight: 600;
    }

    /* ===== HYBRID EMOJI ===== */
    .hybrid-container {
      width: 200px;
      height: 200px;
      margin: 0 auto 8px;
      position: relative;
      animation: floatHybrid 4s ease-in-out infinite;
      filter: drop-shadow(0 0 25px rgba(255, 143, 171, 0.45));
    }
    @keyframes floatHybrid {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .hybrid-container span {
      position: absolute;
      display: block;
      user-select: none;
      line-height: 1;
    }
    .hybrid-mermaid {
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      font-size: 130px;
      z-index: 1;
    }
    .hybrid-cat {
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 65px;
      z-index: 2;
    }
    .hybrid-crown {
      bottom: 152px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 42px;
      z-index: 3;
      filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.9));
      animation: crownGlow 3s ease-in-out infinite;
    }
    @keyframes crownGlow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(255,215,0,0.7)); }
      50% { filter: drop-shadow(0 0 22px rgba(255,215,0,1)); }
    }

    .sparkle {
      position: absolute;
      font-size: 1rem;
      opacity: 0.8;
      pointer-events: none;
      animation: sparkleFloat 3s ease-in-out infinite;
    }
    .sparkle.s1 { top: 10px; left: 15px; animation-delay: 0s; }
    .sparkle.s2 { top: 50%; right: 5px; animation-delay: 0.8s; }
    .sparkle.s3 { bottom: 15px; left: 20px; animation-delay: 1.6s; }
    @keyframes sparkleFloat {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
      50% { transform: translateY(-7px) scale(1.15); opacity: 1; }
    }

    h1 {
      font-size: 1.9rem;
      color: var(--text-light);
      margin-bottom: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 0 20px rgba(255, 143, 171, 0.4);
    }
    p.subtitle {
      color: var(--text-soft);
      font-size: 0.94rem;
      line-height: 1.7;
      margin-bottom: 24px;
      padding: 0 4px;
    }

    /* ===== HINT (TRANSPARAN) ===== */
    .hint-wrap {
      text-align: center;
      padding: 10px 14px;
      margin-bottom: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 14px;
    }
    .hint-label {
      display: inline-block;
      font-size: 0.62rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255, 182, 213, 0.5);
      font-weight: 700;
      margin-bottom: 5px;
    }
    .hint-text {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.55;
      font-style: italic;
    }

    /* ===== INPUT GROUP ===== */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="text"] {
      padding: 15px 20px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 50px;
      font-size: 0.98rem;
      outline: none;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
      letter-spacing: 0.3px;
      font-family: inherit;
    }
    input[type="text"]::placeholder {
      color: rgba(255, 255, 255, 0.55);
      font-size: 0.86rem;
    }
    input[type="text"]:focus {
      border-color: var(--accent-pink);
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 22px rgba(255, 143, 171, 0.35);
    }

    .btn-submit {
      padding: 15px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, var(--accent-pink), #ff6b9d);
      color: white;
      font-size: 1.02rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.5px;
      box-shadow: 0 10px 24px rgba(255, 107, 157, 0.35);
      font-family: inherit;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(255, 107, 157, 0.5);
    }
    .btn-submit:active { transform: translateY(0); }

    .microcopy {
      margin-top: 12px;
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 0.3px;
      font-style: italic;
    }

    .message {
      margin-top: 18px;
      min-height: 24px;
      font-weight: 600;
      color: #ffb3c1;
      font-size: 0.92rem;
      line-height: 1.5;
    }
    .message.success { color: #7ff0a1; }

    .btn-sail {
      position: relative;
      z-index: 5;
      margin-top: 16px;
      display: none;
      padding: 14px 34px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-dark));
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.5px;
      box-shadow: 0 10px 24px rgba(26, 107, 138, 0.4);
      animation: fadeInUp 0.7s ease;
      font-family: inherit;
    }
    .btn-sail.visible { display: inline-block; }
    .btn-sail:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(26, 107, 138, 0.6);
    }

    /* ===== WAVE OVERLAY ===== */
    .wave-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
      display: none;
    }
    .wave-overlay.show { display: block; }
    .wave {
      position: absolute;
      bottom: -120%;
      left: -10%;
      width: 120%;
      height: 130%;
      background: linear-gradient(180deg, rgba(11, 59, 79, 0.9), rgba(29, 111, 138, 0.9));
      border-radius: 45% 45% 0 0;
      animation: waveSweep 1.6s cubic-bezier(0.7, 0, 0.3, 1) forwards;
      opacity: 0.95;
    }
    .wave:nth-child(2) {
      animation-delay: 0.15s;
      background: linear-gradient(180deg, rgba(29, 111, 138, 0.9), rgba(58, 167, 196, 0.9));
    }
    .wave:nth-child(3) {
      animation-delay: 0.3s;
      background: linear-gradient(180deg, rgba(58, 167, 196, 0.9), rgba(127, 216, 230, 0.9));
      opacity: 0.85;
    }
    @keyframes waveSweep {
      0% { bottom: -120%; }
      100% { bottom: 0; }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .card {
        padding: 28px 20px 26px;
        border-radius: 26px;
      }
      .kicker { font-size: 0.65rem; letter-spacing: 2.5px; }
      h1 { font-size: 1.6rem; }
      p.subtitle { font-size: 0.88rem; margin-bottom: 20px; }
      .hybrid-container {
        width: 165px;
        height: 165px;
      }
      .hybrid-mermaid { font-size: 105px; }
      .hybrid-cat { bottom: 65px; font-size: 52px; }
      .hybrid-crown { bottom: 123px; font-size: 34px; }
      .hint-text { font-size: 0.76rem; }
      .btn-submit { font-size: 0.98rem; }
      .btn-sail { font-size: 0.95rem; padding: 13px 28px; }
    }

    @media (max-width: 360px) {
      .hybrid-container { width: 145px; height: 145px; }
      .hybrid-mermaid { font-size: 92px; }
      .hybrid-cat { bottom: 56px; font-size: 46px; }
      .hybrid-crown { bottom: 108px; font-size: 30px; }
      h1 { font-size: 1.4rem; }
    }

    @media (max-height: 550px) and (orientation: landscape) {
      .card { padding: 22px 22px 20px; }
      .hybrid-container { width: 130px; height: 130px; margin-bottom: 4px; }
      .hybrid-mermaid { font-size: 85px; }
      .hybrid-cat { bottom: 52px; font-size: 42px; }
      .hybrid-crown { bottom: 98px; font-size: 26px; }
      h1 { font-size: 1.35rem; }
      p.subtitle { margin-bottom: 16px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <video class="video-background" autoplay muted loop playsinline preload="auto">
    <source src="assets/background-index.mp4" type="video/mp4">
  </video>

  <div class="video-overlay"></div>

  <div class="card">
    <div class="kicker">A Little Secret · Just For You</div>

    <div class="hybrid-container">
      <span class="sparkle s1">✨</span>
      <span class="sparkle s2">✨</span>
      <span class="sparkle s3">✨</span>
      <span class="hybrid-mermaid">🧜‍♀️</span>
      <span class="hybrid-cat">🐱</span>
      <span class="hybrid-crown">👑</span>
    </div>

    <h1>Only For You</h1>
    <p class="subtitle">
      Ada beberapa hal yang pengin aku ceritain ke kamu.<br>
      Tapi sebelum itu, jawab satu pertanyaan kecil ini dulu, yaa.
    </p>

    <div class="hint-wrap" id="hintWrap">
      <div class="hint-label">Hint</div>
      <div class="hint-text">Ingat nama random yang lahir dari tiga emoji di atas. Masih inget, kan? 😉</div>
    </div>

    <div class="input-group">
      <input type="text" id="passwordInput" placeholder="Tulis jawaban kamu di sini..." autocomplete="off">
      <button class="btn-submit" id="submitBtn">Coba masuk →</button>
    </div>

    <div class="microcopy">pelan-pelan aja, nggak perlu buru-buru ♡</div>

    <div id="message" class="message"></div>

    <button class="btn-sail" id="btnSail">Mulai perjalanan →</button>
  </div>

  <div class="wave-overlay" id="waveOverlay">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
  </div>

  <script src="state.js"></script>
  <script>
    (function() {
      getUnlockedIslands();

      const correctAnswer = "Ratu Kucing Duyung";
      const input = document.getElementById('passwordInput');
      const button = document.getElementById('submitBtn');
      const message = document.getElementById('message');
      const btnSail = document.getElementById('btnSail');
      const waveOverlay = document.getElementById('waveOverlay');
      const hintWrap = document.getElementById('hintWrap');
      let answerCorrect = false;

      function cleanText(text) {
        return text.trim().toLowerCase().replace(/\s+/g, ' ');
      }

      function checkAnswer() {
        const userAnswer = cleanText(input.value);

        if (userAnswer === "") {
          message.textContent = "Isi dulu jawabannya, yaa 😭";
          message.className = "message";
          return;
        }

        if (userAnswer === cleanText(correctAnswer)) {
          message.textContent = "Nahh, bener! Ternyata masih inget 🥹";
          message.className = "message success";
          answerCorrect = true;

          input.style.display = 'none';
          button.style.display = 'none';
          hintWrap.style.display = 'none';
          document.querySelector('.microcopy').style.display = 'none';

          setTimeout(() => {
            btnSail.classList.add('visible');
          }, 700);
        } else {
          message.textContent = "Hmm, belum tepat 😭 Coba inget lagi, yaa.";
          message.className = "message";
          input.value = "";
          input.focus();
        }
      }

      button.addEventListener('click', checkAnswer);
      input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') checkAnswer();
      });

      btnSail.addEventListener('click', function() {
        if (!answerCorrect) return;
        waveOverlay.classList.add('show');
        setTimeout(() => {
          navigateTo('map.html');
        }, 1800);
      });

      input.focus();
    })();
  </script>
</body>
</html>
